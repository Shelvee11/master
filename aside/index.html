/* 气泡上的三种手势：
     长按 → 操作表（立刻）
     双击 → 待办开关
     单击 → 什么都不做
   单击留白是用户定的：操作表太容易误触，只有长按才配打开它。
   顺带解决了一个老包袱——旧版本单击开操作表，为了分辨「这是不是双击的第一下」
   必须整整压后 DBL_MS 才动手，白白慢四分之一秒。现在单击不做事，第二下一到就
   直接翻待办，双击零延迟，DBL_MS 只剩「两下算不算连击」这一个用途。 */
const DBL_MS = 260;
let longPressTimer = null;
let lastTapId = null, lastTapAt = 0;

function bubbleDown(id) {
  if (selectMode) return;
  longPressTimer = setTimeout(() => {
    longPressTimer = 'fired';
    lastTapId = null;
    openEntryAction(id);
  }, 500);
}
function bubbleUp(id) {
  if (selectMode) return;
  // 刚横滑完，这一下 pointerup 是收尾不是轻点
  if (swSuppress) { clearTimeout(longPressTimer); longPressTimer = null; lastTapId = null; return; }
  if (longPressTimer === 'fired') { longPressTimer = null; return; }
  clearTimeout(longPressTimer);
  longPressTimer = null;

  const now = Date.now();
  if (lastTapId === id && now - lastTapAt < DBL_MS) {
    lastTapId = null;
    toggleTodo(id);
    return;
  }
  // 单击本身不做事，只记一笔等第二下
  lastTapId = id;
  lastTapAt = now;
}
function bubbleCancel() { clearTimeout(longPressTimer); longPressTimer = null; swEnd(); }

/* ── 气泡横滑：一个手势管「靠哪边」和「高不高光」两件事 ───────────────
   规则只有一条，两个方向完全对称：
     朝某个方向滑 → 还没在那边就挪过去；已经在那边了就切高光（来回切，不封顶）
   于是：右边的气泡左滑一下到左边，再左滑就在高光/非高光之间反复切；左边的同理。
   往自己已经在的那侧滑，等于「只切高光」，所以没有任何一个方向是死的。

   监听挂在 #stream 的**捕获阶段**：图片和药丸自己 stopPropagation 了（免得点图
   也算点气泡），冒泡阶段收不到，捕获阶段先于目标触发，所以从图片上起手也能滑。
   轻点/双击/长按仍旧走气泡上那三个内联 handler，这里只负责横滑并在锁定后掐掉它们。 */
const SWIPE_LOCK = 10;   // 越过它才判定为横向意图
const SWIPE_GO   = 52;   // 松手时位移越过它才生效
let sw = null;           // { id, el, x0, y0, dx, locked }
let swSuppress = false;  // 横滑刚结束，吃掉紧跟着的那次 pointerup

function swEnd() {
  if (sw && sw.el) { sw.el.style.transition = ''; sw.el.style.transform = ''; }
  sw = null;
}

function swDown(ev) {
  if (selectMode) return;
  // 起手点落在这一行任何地方都算——空白处、标签、时间、图片都行
  const row = ev.target.closest && ev.target.closest('.srow');
  const el  = row && row.querySelector('.bubble');
  if (!row || !el) return;
  sw = { id: row.dataset.id, el, x0: ev.clientX, y0: ev.clientY, dx: 0, locked: false };
}

function swMove(ev) {
  if (!sw) return;
  const dx = ev.clientX - sw.x0, dy = ev.clientY - sw.y0;
  if (!sw.locked) {
    // 竖向为主 → 这是在滚时间线，撒手让浏览器接管
    if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > SWIPE_LOCK) { swEnd(); return; }
    if (Math.abs(dx) < SWIPE_LOCK) return;
    sw.locked = true;
    clearTimeout(longPressTimer); longPressTimer = null;   // 横滑赢了，别再弹操作表
    lastTapId = null;
    try { sw.el.setPointerCapture(ev.pointerId); } catch (err) {}
    sw.el.style.transition = 'none';
  }
  // 两个方向都有意义（挪位置 or 切高光），所以不再有需要加阻尼的死方向
  sw.dx = dx;
  sw.el.style.transform = `translateX(${dx}px)`;
}

function swUp() {
  if (!sw) return;
  const { id, dx, locked } = sw;
  swEnd();
  if (!locked) return;
  swSuppress = true;
  setTimeout(() => { swSuppress = false; }, 0);   // 只挡紧跟着的那一次 pointerup
  /* 再挡掉浏览器随后补的那一次 click。判定区扩到整行之后，起手点可能落在标签、
     时间或图片上，它们各自有 onclick——不挡的话滑一下会顺手开个标签选择器或灯箱。 */
  const killClick = ce => { ce.stopPropagation(); ce.preventDefault(); };
  document.addEventListener('click', killClick, true);
  setTimeout(() => document.removeEventListener('click', killClick, true), 350);
  if (Math.abs(dx) >= SWIPE_GO) swipeTo(id, dx > 0 ? 1 : -1);
}

/* dir: 1 = 右滑, -1 = 左滑。
   side 和 hl 都是记录自己的字段，JSON 备份和云同步（按整条内容算 hash）自动带上，
   不用改任何一处序列化。 */
function swipeTo(id, dir) {
  const e = entryById(id);
  if (!e) return;
  if (onRight(e) === (dir > 0)) e.hl = !e.hl;   // 已经在这一侧 → 切高光
  else e.side = dir;                            // 还没过来 → 挪过来（从此钉死在这边）
  saveEntries();
  renderAll();
}

function openEntryAction(id) {
  const e = entryById(id);
  if (!e) return;
  const nThread = (e.re || replyCounts()[id]) ? threadOf(id).length : 0;
  openAction(`
    <div class="action-group">
      <div class="action-title">${esc(preview(e, 28))}</div>
      <button class="action-btn" onclick="forceCloseAction(); startReply('${id}')">${ico('reply')}回复这条</button>
      ${nThread > 1 ? `<button class="action-btn" onclick="forceCloseAction(); openThread('${id}')">${ico('thread')}查看整串（${nThread} 条）</button>` : ''}
      <button class="action-btn" onclick="toggleTodo('${id}')">${ico('todo')}${e.td ? '取消待办' : '转成待办'}</button>
      <button class="action-btn" onclick="toggleMark('${id}','hl')">${ico('hl')}${e.hl ? '取消高光' : '高光'}</button>
      <button class="action-btn" onclick="toggleMark('${id}','qt')">${ico('qt')}${e.qt ? '取消摘抄格式' : '摘抄'}</button>
      <button class="action-btn" onclick="forceCloseAction(); enterSelect('${id}')">${ico('multi')}多选</button>
      <button class="action-btn" onclick="toggleMark('${id}','pin')">${ico('pin')}${e.pin ? '取消置顶' : '置顶'}</button>
      <button class="action-btn" onclick="toggleMark('${id}','msk')">${ico('msk')}${e.msk ? '取消隐藏' : '隐藏'}</button>
      <button class="action-btn danger" onclick="deleteEntry('${id}')">${ico('trash')}删除</button>
    </div>
    <div class="action-group">
      <button class="action-btn" onclick="forceCloseAction(); openEditText('${id}')">${ico('edit')}编辑</button>
      ${e.text ? `<button class="action-btn" onclick="copyEntry('${id}')">${ico('copy')}拷贝</button>` : ''}
      <button class="action-btn" onclick="forceCloseAction(); openTagPicker('${id}')">${ico('tag')}标签
        <span class="action-val">${esc(tagById(e.tagId).emoji)} ${esc(tagById(e.tagId).name)}<i>›</i></span></button>
      <button class="action-btn" onclick="forceCloseAction(); openEntryWhen('${id}')">${ico('clock')}时间
        <span class="action-val">${esc(cnDateTime(e.date, e.time))}<i>›</i></span></button>
    </div>
    <div class="action-group">
      <button class="action-btn strong" onclick="forceCloseAction()">取消</button>
    </div>`);
}

/* ═══════════════════ 高光 / 摘抄 / 置顶 ═══════════════════ */

/* 形态（待办 / 摘抄）开着的时候要接管标签，导出和筛选才对得上；
   但关掉时必须还回去，否则误触双击一开一关，就把关键词判出来的标签吃掉了。
   e.tg0 = 被接管之前的那个标签，只在接管期间存在，还回去就删掉。 */
const FORM_TAG = { td: 'todo', qt: 'quote' };
const hasTag = id => tags.some(t => t.id === id);

function formTagOn(e, key) {
  const id = FORM_TAG[key];
  if (!hasTag(id) || e.tagId === id) return;   // 本来就是这个标签，没什么好存底的
  if (e.tg0 === undefined) e.tg0 = e.tagId;    // 两个形态都开时，第一次接管的底最原始
  e.tagId = id;
  e.auto = false;
}

function formTagOff(e, key) {
  const id = FORM_TAG[key];
  if (e.tagId !== id) return;                  // 标签早被别的操作改走了，不插手
  const other = key === 'td' ? 'qt' : 'td';    // 另一个形态还开着 → 标签交给它
  if (e[other] && hasTag(FORM_TAG[other])) { e.tagId = FORM_TAG[other]; return; }
  // 这里要的是「存在才还」，tagById 找不到会给兜底标签，不能拿来当校验
  if (e.tg0 !== undefined && hasTag(e.tg0)) e.tagId = e.tg0;
  delete e.tg0;
}

// pin 存的是置顶时刻，多条置顶时按它排序（后置顶的在上面）
function toggleMark(id, kind) {
  const e = entryById(id);
  if (!e) return;
  forceCloseAction();
  const on = !e[kind];
  if (kind === 'pin') e.pin = on ? Date.now() : 0;
  else e[kind] = on;
  // 摘抄样式和「摘抄」标签一起走
  if (kind === 'qt') on ? formTagOn(e, 'qt') : formTagOff(e, 'qt');
  saveEntries();
  renderAll();
  showToast(on ? { hl: '已高光', qt: '已排成摘抄', pin: '已置顶', msk: '已隐藏' }[kind]
               : { hl: '已取消高光', qt: '已取消摘抄格式', pin: '已取消置顶', msk: '已取消隐藏' }[kind]);
}

function pinnedEntries() {
  return entries.filter(e => e.pin).sort((a, b) => b.pin - a.pin);
}

function renderPinBar() {
  const bar = document.getElementById('pinbar');
  const list = pinnedEntries();
  bar.classList.toggle('on', list.length > 0);
  if (!list.length) { bar.innerHTML = ''; return; }
  const top = list[0];
  bar.innerHTML = `<div class="pinbar-pill">
      <span>🎈</span>
      <span class="pinbar-text">${esc(preview(top, 60))}</span>
      ${list.length > 1 ? `<span class="pinbar-n">· ${list.length} 条</span>` : ''}
    </div>`;
}

function openPinned() {
  const list = pinnedEntries();
  if (!list.length) return;
  const rows = list.map(e => {
    return `<div class="pin-row">
        <div class="pin-row-info" onclick="jumpToEntry('${e.id}')">
          <div class="pin-row-text">${esc(preview(e, 60))}</div>
          <div class="pin-row-meta">${esc(cnDate(e.date))} ${esc(e.time)} · ${esc(tagById(e.tagId).name)}</div>
        </div>
        <button class="pin-row-off" onclick="unpinFromList('${e.id}')">取消</button>
      </div>`;
  }).join('');
  openForm(`置顶 ${list.length} 条`, `<div id="pin-list">${rows}</div>
    <div class="form-hint" style="margin-top:10px">点条目回到它在时间线里的位置。</div>`, '完成');
}

function unpinFromList(id) {
  const e = entryById(id);
  if (!e) return;
  e.pin = 0;
  saveEntries();
  renderAll();
  if (pinnedEntries().length) openPinned(); else closeForm();
}

function jumpToEntry(id) {
  const e = entryById(id);
  if (!e) return;
  closeForm();
  if (activeFilter !== 'all' && activeFilter !== e.tagId) { activeFilter = 'all'; renderFilters(); renderStream(); }
  const row = document.querySelector(`.srow[data-id="${id}"]`);
  if (!row) return;
  row.scrollIntoView({ block: 'center', behavior: 'smooth' });
  row.classList.remove('flash');
  void row.offsetWidth;               // 重启动画
  row.classList.add('flash');
  setTimeout(() => row.classList.remove('flash'), 1400);
}

// 删记录的唯一出口：顺手把它挂的图从 IDB 清掉，别留孤儿
function purgeEntries(ids) {
  const set = new Set(ids);
  entries.forEach(e => {
    if (!set.has(e.id)) return;
    (e.imgs || []).forEach(imgId => { imgCache.delete(imgId); delImage(imgId).catch(() => {}); });
  });
  entries = entries.filter(e => !set.has(e.id));
  // 被回复的那条没了，回复方的 re 就是个空指针：断开它，别一直显示「原记录已删除」
  entries.forEach(e => { if (e.re && set.has(e.re)) delete e.re; });
  if (replyTo && set.has(replyTo)) replyTo = null;
  saveEntries();
}

function deleteEntry(id) {
  purgeEntries([id]);
  forceCloseAction();
  renderAll();
  showToast('已删除');
}

/* 气泡关掉了系统选词（双击要留给待办），复制从这里走。
   clipboard 只在 https / localhost 有，退回一个隐藏 textarea + execCommand */
function copyEntry(id) {
  const e = entryById(id);
  if (!e || !e.text) return;
  forceCloseAction();
  const done = () => showToast('已拷贝');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(e.text).then(done).catch(() => legacyCopy(e.text, done));
  } else legacyCopy(e.text, done);
}
function legacyCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); } catch { showToast('拷贝失败'); }
  ta.remove();
}

/* ═══════════════════ 待办（双击气泡开关，方框勾掉） ═══════════════════ */

// e.td：0 / 没有这个字段 = 不是待办，1 = 待办未完成，2 = 已完成
function toggleTodo(id) {
  const e = entryById(id);
  if (!e) return;
  forceCloseAction();
  const on = !e.td;
  e.td = on ? 1 : 0;
  // 跟「摘抄」一个路子：形态和标签一起走，取消时把原标签还回去
  on ? formTagOn(e, 'td') : formTagOff(e, 'td');
  saveEntries();
  renderAll();
  showToast(on ? '已转成待办' : '已取消待办');
}

function toggleDone(id) {
  const e = entryById(id);
  if (!e || !e.td) return;
  e.td = e.td === 2 ? 1 : 2;
  saveEntries();
  renderAll();
  showToast(e.td === 2 ? '已勾掉' : '已取消勾选');
}

/* ═══════════════════ 回复 → thread ═══════════════════ */

let replyTo = null;   // 待回复的那条 id。只活在这次会话里，发出去就清掉

function startReply(id) {
  if (!entryById(id)) return;
  replyTo = id;
  renderComposerBars();
  document.getElementById('input').focus();
}

function exitReply() {
  replyTo = null;
  renderComposerBars();
}

function jumpToReplyTarget() { if (replyTo) jumpToEntry(replyTo); }

// 顺着 re 一路往上走到串头。数据里不该有环，但导入和同步来的东西不保证，加个步数上限
function rootIdOf(e, byId) {
  let cur = e, guard = 0;
  while (cur && cur.re && guard++ < 200) {
    const p = byId.get(cur.re);
    if (!p) break;
    cur = p;
  }
  return cur ? cur.id : null;
}
function depthOf(e, byId) {
  let cur = e, d = 0;
  while (cur && cur.re && d < 200) {
    const p = byId.get(cur.re);
    if (!p) break;
    cur = p; d++;
  }
  return d;
}

// 整串 = 跟它同一个串头的所有记录，按时间排。
// 先把 id 表铺成 Map：不然每层都走一次 entries.find，条数一多就是平方级
function threadOf(id) {
  const byId = new Map(entries.map(e => [e.id, e]));
  const start = byId.get(id);
  if (!start) return [];
  const rid = rootIdOf(start, byId);
  return entries.filter(e => rootIdOf(e, byId) === rid).sort((a, b) => a.ts - b.ts);
}

function openThread(id) {
  const list = threadOf(id);
  if (list.length < 2) { showToast('这条还没有回复'); return; }
  const byId = new Map(entries.map(e => [e.id, e]));
  const rows = list.map(e => {
    const box = e.td ? (e.td === 2 ? '☑ ' : '☐ ') : '';
    return `<div class="th-row ${e.id === id ? 'cur' : ''} ${e.td === 2 ? 'done' : ''}"
                 style="padding-left:${Math.min(depthOf(e, byId), 5) * 14}px" onclick="jumpToEntry('${e.id}')">
        <span class="th-rail"></span>
        <div class="th-body">
          <div class="th-text">${box}${esc(preview(e, 60))}</div>
          <div class="th-meta">${esc(cnDate(e.date))} ${esc(e.time)} · ${esc(tagById(e.tagId).name)}</div>
        </div>
      </div>`;
  }).join('');
  openForm(`整串 ${list.length} 条`, `<div>${rows}</div>
    <div class="form-hint" style="margin-top:10px">点任意一条回到它在时间线里的位置。</div>`, '完成');
}

/* ═══════════════════ 补记（写进过去的某一天） ═══════════════════ */

/* null = 记今天。补记状态只活在这次会话里，刷新就回到今天——
   隔天打开还在不声不响往上周写，是这类功能最容易踩的坑 */
let backfill = null;   // { date: 'YYYY-MM-DD', time: 'HH:MM' }

function enterBackfill(key, time) {
  if (key > todayKey()) return;
  closeCalendar();
  backfill = { date: key, time: time || nowTime(new Date()) };
  renderComposerBars();
  document.getElementById('input').focus();
  showToast(`接下来记的写进 ${cnDate(key)}`);
}

function exitBackfill() {
  if (!backfill) return;
  backfill = null;
  renderComposerBars();
  showToast('回到今天');
}

function openBackfillWhen() {
  if (!backfill) return;
  openForm('补记到哪天', `
    <div class="form-row">
      <div class="form-group" style="flex:1">
        <label class="form-label">日期</label>
        <input class="form-input" type="date" id="bf-date" value="${backfill.date}" max="${todayKey()}">
      </div>
      <div class="form-group" style="flex:1">
        <label class="form-label">时间</label>
        <input class="form-input" type="time" id="bf-time" value="${backfill.time}">
      </div>
    </div>
    <div class="form-hint" style="margin:-6px 0 14px">时间只决定这条排在那天的第几位。</div>
    <button class="btn-primary" onclick="saveBackfillWhen()">确定</button>`);
}

function saveBackfillWhen() {
  const d = document.getElementById('bf-date').value;
  const t = document.getElementById('bf-time').value;
  if (!d || !t) { showToast('日期和时间都要填'); return; }
  if (d > todayKey()) { showToast('补记不能写到未来'); return; }
  backfill = { date: d, time: t };
  closeForm();
  renderComposerBars();
}

/* 「那天 + 那个点」→ ts，流里才会插到该在的位置。同一分钟连补几条会撞上同一个 ts，
   往后挪毫秒——只影响排序，显示的还是同一个 HH:MM。
   selfId 是「改时间」用的：自己不该跟自己撞车。 */
function uniqueTs(date, time, selfId) {
  const [y, mo, da] = date.split('-').map(Number);
  const [hh, mi] = time.split(':').map(Number);
  let ts = new Date(y, mo - 1, da, hh, mi, 0, 0).getTime();
  const used = new Set(entries.filter(e => e.id !== selfId).map(e => e.ts));
  while (used.has(ts)) ts++;
  return ts;
}

function composeWhen() {
  const now = new Date();
  if (!backfill) return { ts: now.getTime(), date: dateKey(now), time: nowTime(now) };
  return { ts: uniqueTs(backfill.date, backfill.time), date: backfill.date, time: backfill.time };
}

/* 输入条上方那两条状态。被回复的记录可能已经删了，顺手把悬空的引用清掉 */
function renderComposerBars() {
  const target = replyTo ? entryById(replyTo) : null;
  if (replyTo && !target) replyTo = null;

  const rb = document.getElementById('reply-bar');
  rb.classList.toggle('on', !!replyTo);
  document.body.classList.toggle('replying', !!replyTo);
  if (target) document.getElementById('reply-what').textContent = preview(target, 34);

  const bb = document.getElementById('backfill-bar');
  bb.classList.toggle('on', !!backfill);
  document.body.classList.toggle('backfilling', !!backfill);
  if (backfill) document.getElementById('bf-when').textContent = `${cnDate(backfill.date)} · ${backfill.time}`;

  document.getElementById('input').placeholder =
    backfill ? `补记 ${cnDate(backfill.date)}…` : replyTo ? '回复这条…' : '记点什么…';
}

/* ═══════════════════ 日历回溯 ═══════════════════ */

let calMonth = '';   // 日历翻到的月份 'YYYY-MM'

function monthOf(key) { return key.slice(0, 7); }
function shiftMonth(mk, d) {
  const [y, m] = mk.split('-').map(Number);
  const t = new Date(y, m - 1 + d, 1);
  return `${t.getFullYear()}-${pad(t.getMonth() + 1)}`;
}
function dayCounts() {
  const c = {};
  entries.forEach(e => { c[e.date] = (c[e.date] || 0) + 1; });
  return c;
}

function openCalendar() {
  calMonth = monthOf(backfill ? backfill.date : todayKey());
  renderCalendar();
  document.getElementById('cal-overlay').classList.add('open');
  document.getElementById('cal-sheet').classList.add('open');
}
function closeCalendar() {
  document.getElementById('cal-overlay').classList.remove('open');
  document.getElementById('cal-sheet').classList.remove('open');
}

// 往回可以一直翻（补记很久以前的事），往前顶到本月：未来没有记录，也不该补
function calStep(d) {
  const next = shiftMonth(calMonth, d);
  if (next > monthOf(todayKey())) return;
  calMonth = next;
  renderCalendar();
}

function renderCalendar() {
  const [y, m] = calMonth.split('-').map(Number);
  const today = todayKey();
  const counts = dayCounts();
  const days = new Date(y, m, 0).getDate();       // 下个月第 0 天 = 这个月最后一天
  const lead = new Date(y, m - 1, 1).getDay();

  let cells = DAY_LABELS.map(d => `<div class="cal-wd">${d}</div>`).join('');
  for (let i = 0; i < lead; i++) cells += `<div class="cal-cell blank"></div>`;
  let total = 0;
  for (let d = 1; d <= days; d++) {
    const key = `${calMonth}-${pad(d)}`;
    const n = counts[key] || 0;
    total += n;
    const lv = !n ? '' : n <= 2 ? ' lv1' : n <= 5 ? ' lv2' : ' lv3';
    const cls = lv + (key === today ? ' today' : '') + (backfill && backfill.date === key ? ' bf' : '');
    cells += `<button class="cal-cell${cls}" aria-label="${key}${n ? ` ${n} 条` : ' 没有记录'}"
        ${key > today ? 'disabled' : `onpointerdown="calDown('${key}')" onpointerup="calUp('${key}')" onpointercancel="calCancel()"`}>
        <span class="cal-d">${d}</span><span class="cal-dot"></span>
      </button>`;
  }

  document.getElementById('cal-body').innerHTML = `
    <div class="cal-nav">
      <button class="nav-btn" onclick="calStep(-1)">‹</button>
      <div class="cal-when">
        <div class="cal-title">${y}年${m}月</div>
        <div class="cal-sub">${total ? `${total} 条` : '这个月还没记'}</div>
      </div>
      <button class="nav-btn" onclick="calStep(1)" ${calMonth >= monthOf(today) ? 'disabled' : ''}>›</button>
    </div>
    <div class="cal-grid">${cells}</div>
    <div class="cal-legend">
      <i style="background:var(--fill)"></i><i style="background:var(--fill2)"></i><i style="background:var(--accent)"></i>
      <span>记得越多，颜色越深</span>
    </div>
    <div class="form-hint" style="text-align:center;margin-top:10px">点有记录的日子回到那天 · 长按任意一天补记</div>`;
}

// 手势跟气泡一致：轻点回溯，长按补记
let calTimer = null;
function calDown(key) {
  clearTimeout(calTimer);
  calTimer = setTimeout(() => { calTimer = 'fired'; enterBackfill(key); }, 500);
}
function calUp(key) {
  if (calTimer === 'fired') { calTimer = null; return; }
  clearTimeout(calTimer);
  calTimer = null;
  if (dayCounts()[key]) jumpToDate(key); else enterBackfill(key);
}
function calCancel() { clearTimeout(calTimer); calTimer = null; }

function jumpToDate(key) {
  closeCalendar();
  // 日历是跨标签的：筛着某个标签时，那天的记录可能一条都不在流里，先把筛选摘掉
  if (activeFilter !== 'all') { activeFilter = 'all'; renderFilters(); renderHeader(); renderStream(); }
  const sep = document.querySelector(`.daysep[data-date="${key}"]`);
  if (!sep) { showToast('这天没有记录'); return; }
  sep.scrollIntoView({ block: 'start', behavior: 'smooth' });
  sep.classList.remove('flash-day');
  void sep.offsetWidth;               // 重启动画
  sep.classList.add('flash-day');
  setTimeout(() => sep.classList.remove('flash-day'), 1700);
}

/* ═══════════════════ 扫描提示（教系统的「扫描文本」手势） ═══════════════════ */

const SCAN_TIP_KEY = 'aside-tip-scan';
/* 扫描本身是系统干的活（iOS 的实况文本 / Mac 的连续互通相机），网页这边没有 API 能直接唤起，
   加号菜单里那一项做的是「把你送到门口」：聚焦输入框 + 把手势写在输入框正上方。
   走这条路不是偷懒——iOS 原生识别中文比任何能塞进单文件 PWA 的 OCR 都准，而且离线可用。
   别在 Windows/Android 上摆这一项，那是个点不出来的菜单。 */
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isMac = !isIOS && /Mac/.test(navigator.platform || '');
const canScan = isIOS || isMac;
const SCAN_HOW = isIOS
  ? '长按输入框 →「扫描文本」→ 对准书页'
  : '在输入框上点右键 →「从 iPhone 或 iPad 插入」→「扫描文本」';

let tipTimer = null;

function showTip(text, autoHideMs) {
  clearTimeout(tipTimer);
  document.querySelector('#tip-scan .tip-text').textContent = text;
  document.getElementById('tip-scan').classList.add('on');
  if (autoHideMs) tipTimer = setTimeout(hideTip, autoHideMs);
}
function hideTip() {
  clearTimeout(tipTimer);
  document.getElementById('tip-scan').classList.remove('on');
}

// 开屏的一次性提示：只负责指路到加号，具体手势等点进去再讲
function initScanTip() {
  if (!canScan || localStorage.getItem(SCAN_TIP_KEY)) return;
  showTip('📷 想抄书上的字？点加号 →「扫描文本」');
}
function dismissScanTip() {
  localStorage.setItem(SCAN_TIP_KEY, '1');
  hideTip();
  showToast('设置里还能找到用法');
}

// 加号菜单点进来：现场教学，15 秒后自己收走，落笔了也收走
function startScanText() {
  localStorage.setItem(SCAN_TIP_KEY, '1');   // 入口已经找到了，开屏那条可以退休
  scanArmed = true;                          // 接下来插进来的那段按扫描办：摘抄标签 + 摘抄排版
  showTip('📷 ' + SCAN_HOW, 15000);
  document.getElementById('input').focus();
}

const THEME_KEY = 'aside-theme';

];

/* ═══════════════════ 多选删除（仿「信息」的批量删除） ═══════════════════ */

let selectMode = false;
const selected = new Set();

function enterSelect(preselectId) {
  if (!entries.length) { showToast('还没有记录'); return; }
  selectMode = true;
  selected.clear();
  if (preselectId) selected.add(preselectId);
  document.body.classList.add('select');
  document.getElementById('input').blur();
  renderStream();
  renderSelBar();
}

function exitSelect() {
  selectMode = false;
  selected.clear();
  document.body.classList.remove('select');
  renderStream();
  renderSelBar();
}

function rowClick(ev, id) {
  if (!selectMode) return;              // 平时点气泡走 bubbleUp，这里不插手
  ev.stopPropagation();
  toggleSelect(id);
}

function toggleSelect(id) {
  if (selected.has(id)) selected.delete(id); else selected.add(id);
  const row = document.querySelector(`.srow[data-id="${id}"]`);
  if (row) {
    row.classList.toggle('checked', selected.has(id));
    row.querySelector('.selcirc').classList.toggle('checked', selected.has(id));
  }
  renderSelBar();
}

function toggleSelectAll() {
  const ids = visibleEntries().map(e => e.id);      // 只针对当前筛选下看得见的
  const allOn = ids.length && ids.every(id => selected.has(id));
  selected.clear();
  if (!allOn) ids.forEach(id => selected.add(id));
  renderStream();
  renderSelBar();
}

function renderSelBar() {
  const n = selected.size;
  const ids = visibleEntries().map(e => e.id);
  document.getElementById('sel-count').textContent = n ? `已选 ${n} 条` : '未选择记录';
  document.getElementById('sel-all').textContent =
    ids.length && ids.every(id => selected.has(id)) ? '取消全选' : '全选';
  document.getElementById('del-btn').disabled = !n;
  document.getElementById('del-btn-text').textContent = n ? `删除 ${n} 条` : '删除';
  document.getElementById('sel-hint').textContent = n ? '' : '点一下选中，可跨天多选';
}

function confirmDeleteSelected() {
  const n = selected.size;
  if (!n) return;
  const withImgs = [...selected].reduce((s, id) => s + ((entryById(id) || {}).imgs || []).length, 0);
  openAction(`
    <div class="action-group">
      <div class="action-title">删除后无法恢复${withImgs ? `，其中 ${withImgs} 张配图也会一起删掉` : ''}</div>
      <button class="action-btn danger" onclick="deleteSelected()">删除 ${n} 条记录</button>
    </div>
    <div class="action-group">
      <button class="action-btn strong" onclick="forceCloseAction()">取消</button>
    </div>`);
}

function deleteSelected() {
  const n = selected.size;
  purgeEntries([...selected]);
  forceCloseAction();
  exitSelect();
  renderAll();
  showToast(`已删除 ${n} 条`);
}

function openTagPicker(id) {
  const e = entryById(id);
  if (!e) return;
  let html = `<div class="action-group"><div class="action-title">选择标签</div>`;
  tags.forEach(t => {
    const on = t.id === e.tagId;
    html += `<button class="action-btn" onclick="setEntryTag('${id}','${t.id}')">
      ${esc(t.emoji)} ${esc(t.name)} ${on ? '<span class="action-check">✓</span>' : ''}
    </button>`;
  });
  html += `</div><div class="action-group"><button class="action-btn strong" onclick="forceCloseAction()">取消</button></div>`;
  openAction(html);
}

function setEntryTag(id, tagId) {
  const e = entryById(id);
  if (!e) return;
  const changed = e.tagId !== tagId;
  e.tagId = tagId;
  // 手动改过标签，形态存的那个底就作废了，取消待办/摘抄时不该再覆盖用户的选择
  if (changed) { e.auto = false; delete e.tg0; }
  saveEntries();
  forceCloseAction();
  renderAll();
  const t = tagById(tagId);
  if (changed) showToast(`已改为 ${t.name}`, '加关键词', () => openLearnKeywords(id, tagId));
  else showToast(`已是 ${t.name}`);
}

/* ═══════════════════ Form sheet（编辑文本 / 标签编辑 / 学关键词） ═══════════════════ */

function openForm(title, bodyHtml, cancelLabel) {

function closeForm() {

  document.getElementById('form-sheet').classList.remove('open');
}

function openEditText(id) {

/* 补记定的是「接下来记的」，这里管的是已经躺在流里的那条。
   ts / date / time 得一起改：流按 ts 排（visibleEntries），日期分隔条按 date 分组。 */
function openEntryWhen(id) {
  const e = entryById(id);
  if (!e) return;
  openForm('改时间', `
    <div class="form-row">
      <div class="form-group" style="flex:1">
        <label class="form-label">日期</label>
        <input class="form-input" type="date" id="ew-date" value="${e.date}" max="${todayKey()}">
      </div>

      </div>
    </div>
    <div class="form-hint" style="margin:-6px 0 14px">改的是这条记录发生的时间点，它会挪到那天对应的位置。</div>
    <button class="btn-primary" onclick="saveEntryWhen('${id}')">保存</button>`);
}

function saveEntryWhen(id) {
  const e = entryById(id);
  if (!e) return;
  const d = document.getElementById('ew-date').value;
  const t = document.getElementById('ew-time').value;
  if (!d || !t) { showToast('日期和时间都要填'); return; }

  if (d === e.date && t === e.time) { closeForm(); return; }
  e.ts = uniqueTs(d, t, e.id);
  e.date = d;
  e.time = t;

function saveEditText(id) {
  const e = entryById(id);
  const v = document.getElementById('edit-text').value.trim();
  if (!e || !v) return;
  e.text = v;
  saveEntries();
  closeForm();
  renderAll();
  showToast('已保存');
}

function openLearnKeywords(entryId, tagId) {
  const e = entryById(entryId);
  const t = tagById(tagId);
  if (!e || !t) return;
  const cands = candidateWords(e.text);
  const chips = cands.length
    ? cands.map(w => `<button class="kw-chip" onclick="this.classList.toggle('on')">${esc(w)}</button>`).join('')
    : `<div class="form-hint">这条文本里没有可用的新候选词，可以在标签管理里手动加。</div>`;
  openForm(`给「${t.name}」加关键词`, `
    <div class="form-group">
      <label class="form-label">从这条记录里挑词</label>
      <div class="kw-list" id="learn-list">${chips}</div>
      <div class="form-hint">选中的词会加进「${esc(t.name)}」的词表，下次出现同样的词就会自动命中。</div>
    </div>
    <button class="btn-primary" onclick="saveLearnKeywords('${tagId}')">加入词表</button>`);
}

function saveLearnKeywords(tagId) {
  const t = tagById(tagId);
  const picked = [...document.querySelectorAll('#learn-list .kw-chip.on')].map(b => b.textContent.trim());
  if (!picked.length) { closeForm(); return; }
  picked.forEach(w => { if (!t.keywords.includes(w)) t.keywords.push(w); });
  saveTags();
  closeForm();
  showToast(`已加入 ${picked.length} 个词`);
}

/* ═══════════════════ Settings ═══════════════════ */

let monthIndex = 0;   // 指向 availableMonths() 的下标
let advOpen = false;  // 「高级」折叠区是否展开（重渲染时保持）

function openSettings() {
  monthIndex = Math.max(0, availableMonths().length - 1);
  renderSettings();
  document.getElementById('settings-overlay').classList.add('open');
  document.getElementById('settings-sheet').classList.add('open');
}
function closeSettings() {
  document.getElementById('settings-overlay').classList.remove('open');
  document.getElementById('settings-sheet').classList.remove('open');
}

function availableMonths() {
  const set = new Set(entries.map(e => e.date.slice(0, 7)));
  return [...set].sort();
}

function renderSettings() {
  const months = availableMonths();
  const cur = months[monthIndex];
  const counts = {};
  entries.forEach(e => { counts[e.tagId] = (counts[e.tagId] || 0) + 1; });

  let html = `<div class="card-label">导出</div><div class="card">`;
  if (months.length) {
    const [y, m] = cur.split('-');
    const n = entries.filter(e => e.date.startsWith(cur)).length;
    html += `
      <div class="month-nav">
        <button class="nav-btn" onclick="stepMonth(-1)" ${monthIndex === 0 ? 'disabled' : ''}>‹</button>
        <div class="month-label">${Number(y)}年${Number(m)}月 · ${n} 条</div>
        <button class="nav-btn" onclick="stepMonth(1)" ${monthIndex >= months.length - 1 ? 'disabled' : ''}>›</button>
      </div>
      <div style="padding: 0 14px 14px">

  }

  html += `<div class="card-label">手势</div><div class="card">

  html += `<div class="card-label">小技巧</div><div class="card">
      <div class="row"><div class="row-info">

  html += `<div class="card-label">标签</div><div class="card">`;
  tags.forEach((t, i) => {
    const sub = t.fallback ? '兜底标签 · 不参与识别' : `${t.keywords.length} 个关键词${t.pattern ? ' · 有形态规则' : ''} · ${counts[t.id] || 0} 条`;

  // JSON 相关一律收进折叠区：它和上面的「导出」是两回事，摆在一起会点串
  html += `<details class="adv"${advOpen ? ' open' : ''} ontoggle="setAdvOpen(this.open)">

// 内联 ontoggle 够不到模块顶层的 let，得走一个函数声明（会挂到 window 上）
function setAdvOpen(v) { advOpen = v; }

function stepMonth(d) {
  const months = availableMonths();
  monthIndex = Math.min(months.length - 1, Math.max(0, monthIndex + d));
  renderSettings();
}

function moveTag(i, d) {
  const j = i + d;
  if (j < 0 || j >= tags.length) return;
  [tags[i], tags[j]] = [tags[j], tags[i]];
  saveTags();
  renderSettings();
  renderFilters();
}

/* ── 标签编辑 ── */

function openTagEdit(id) {
  const t = id ? tagById(id) : { id: '', name: '', emoji: '🏷️', keywords: [], pattern: '' };
  const isNew = !id;
  openForm(isNew ? '新建标签' : '编辑标签', `
    <div class="form-row">
      <div class="form-group" style="width:88px">
        <label class="form-label">图标</label>
        <input class="form-input" id="tag-emoji" value="${esc(t.emoji)}" style="text-align:center">
      </div>
      <div class="form-group" style="flex:1">
        <label class="form-label">名称</label>
        <input class="form-input" id="tag-name" value="${esc(t.name)}" placeholder="如：睡眠">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">关键词（逗号或换行分隔）</label>
      <textarea class="form-area" id="tag-kw" ${t.fallback ? 'disabled' : ''}>${esc(t.keywords.join('、'))}</textarea>
      <div class="form-hint">${t.fallback ? '兜底标签不参与识别，无需关键词。' : '文本里出现这些词就会命中；词越长权重越高。'}</div>
    </div>
    <div class="form-group">
      <label class="form-label">高级：形态规则（正则，可留空）</label>
      <input class="form-input" id="tag-pattern" value="${esc(t.pattern || '')}" placeholder="留空即不用">
      <div class="form-hint">优先级高于所有关键词。摘抄用的是引号/书名号/「——出处」。</div>
    </div>
    <button class="btn-primary" onclick="saveTag('${id || ''}')">保存</button>
    ${(!isNew && !t.fallback) ? `<button class="btn-primary" style="background:var(--red);margin-top:10px" onclick="deleteTag('${id}')">删除标签</button>` : ''}`);
}

function saveTag(id) {
  const name = document.getElementById('tag-name').value.trim();
  const emoji = document.getElementById('tag-emoji').value.trim() || '🏷️';
  const pattern = document.getElementById('tag-pattern').value.trim();
  const kwEl = document.getElementById('tag-kw');
  const keywords = kwEl.disabled ? [] : kwEl.value.split(/[、,，\n]/).map(s => s.trim()).filter(Boolean);
  if (!name) { showToast('名称不能为空'); return; }
  if (pattern) {
    try { new RegExp(pattern, 'm'); }
    catch { showToast('正则写错了'); return; }
  }
  if (id) {
    const t = tagById(id);
    Object.assign(t, { name, emoji, pattern, keywords: t.fallback ? [] : keywords });
  } else {
    // 新标签插在兜底标签之前
    const t = { id: genId(), name, emoji, pattern, keywords };
    const fi = tags.findIndex(x => x.fallback);
    tags.splice(fi < 0 ? tags.length : fi, 0, t);
  }
  saveTags();
  closeForm();
  renderSettings();
  renderAll();
  showToast('已保存');
}

function deleteTag(id) {
  const t = tagById(id);
  const n = entries.filter(e => e.tagId === id).length;
  const fb = fallbackTag();
  if (!confirm(`删除「${t.name}」？${n ? `该标签下的 ${n} 条记录会归到「${fb.name}」。` : ''}`)) return;
  entries.forEach(e => {
    if (e.tagId === id) { e.tagId = fb.id; e.auto = false; }
    if (e.tg0 === id) delete e.tg0;          // 存了底的标签被删了，底也跟着作废
  });
  tags = tags.filter(x => x.id !== id);
  if (activeFilter === id) activeFilter = 'all';
  saveEntries(); saveTags();
  closeForm();
  renderSettings();
  renderAll();
  showToast('已删除标签');
}

/* ═══════════════════ Export / Import ═══════════════════ */

function shareOrDownload(content, filename, mime) {
  // 优先走 iOS 分享面板（一步直达）。部分 iOS 版本不认 text/markdown 这种 MIME，
  // canShare 会直接 false，所以再用 text/plain 试一次（扩展名保留 .md，Obsidian 认扩展名）。
  // 都不行才退回 <a download>；用户主动取消（AbortError）不触发下载。
  const tryShare = m => {
    const f = new File([content], filename, { type: m });
    return (navigator.canShare && navigator.canShare({ files: [f] }))
      ? navigator.share({ files: [f], title: filename })
      : null;
  };
  const p = tryShare(mime) || tryShare('text/plain');
  if (!p) { fallbackDownload(content, filename, mime); return; }
  p.catch(err => { if (!err || err.name !== 'AbortError') fallbackDownload(content, filename, mime); });
}
function fallbackDownload(content, filename, mime) {
  const url = URL.createObjectURL(new Blob([content], { type: mime }));
  const a = Object.assign(document.createElement('a'), { href: url, download: filename });
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function buildMarkdown(month) {
  const list = entries
    .filter(e => !month || e.date.startsWith(month))
    .sort((a, b) => a.ts - b.ts);

  const title = month
    ? `# Aside 导出 · ${Number(month.slice(0, 4))}年${Number(month.slice(5, 7))}月`
    : `# Aside 导出 · 全部记录`;

  const counts = {};
  list.forEach(e => { counts[e.tagId] = (counts[e.tagId] || 0) + 1; });
  const summary = tags.filter(t => counts[t.id]).map(t => `${t.name} ${counts[t.id]}`).join(' / ');
  const d = new Date();
  const stamp = `${dateKey(d)} ${nowTime(d)}`;

  const blocks = [`${title}`, `> 导出时间：${stamp} · 共 ${list.length} 条${summary ? ' · ' + summary : ''}`];

  let lastDate = null;
  list.forEach(e => {
    if (e.date !== lastDate) {
      lastDate = e.date;
      blocks.push(`## ${e.date} ${cnDate(e.date).replace(/^\d+月\d+日 /, '')}`);
    }
    // 导出只要文字：图片不内嵌，留一行占位，免得纯图片的记录导出成空条目。
    // 摘抄排成 blockquote、高光用 Obsidian 的 ==高亮==、待办排成能勾的 task list、
    // 隐藏的用 ||剧透|| 包住、置顶留个 🎈、回复标 ↩ 指回原条——形态跟着一起走。
    // 局部变量别再叫 pad，会盖掉全局那个补零的 pad()
    const ind = e.qt ? '  > ' : '  ';
    const box = e.td ? (e.td === 2 ? '- [x] ' : '- [ ] ') : '';
    const dress = l => {
      let s = l;
      if (e.hl && s.trim()) s = `==${s}==`;
      if (e.msk && s.trim()) s = `||${s}||`;
      return s;
    };
    const lines = [];
    if (e.text) {
      // 待办的后续行要多缩两格，否则跳出这个 task item 变成同级正文
      e.text.replace(/\n{2,}/g, '\n').split('\n').map(l => l.trimEnd())
        .forEach((l, i) => lines.push(ind + (i === 0 ? box : box ? '  ' : '') + dress(l)));
    }
    if ((e.imgs || []).length) lines.push(`  _[图片 ×${e.imgs.length}]_`);
    const p = e.re ? entryById(e.re) : null;
    const ref = p ? ` ↩ ${p.date === e.date ? '' : cnDate(p.date).replace(/ 周./, '') + ' '}${p.time}` : '';
    blocks.push(`- **${e.time}** \`#${tagById(e.tagId).name}\`${e.pin ? ' 🎈' : ''}${ref}\n${lines.join('\n')}`);
  });
  return blocks.join('\n\n') + '\n';
}

function mdFilename(month) { return month ? `aside-${month}.md` : 'aside-all.md'; }

function exportMarkdown(month) {
  const list = entries.filter(e => !month || e.date.startsWith(month));
  if (!list.length) { showToast('这个范围没有记录'); return; }
  const filename = mdFilename(month);
  shareOrDownload(buildMarkdown(month), filename, 'text/markdown');
  showToast(`已导出 ${filename}`);
}

async function exportJSON() {
  const filename = `aside-backup-${todayKey()}.json`;
  showToast('正在打包…');
  const images = await allImages().catch(() => []);   // 图片只有 JSON 备份能带走
  shareOrDownload(JSON.stringify({ version: 2, entries, tags, images }, null, 2), filename, 'application/json');
  showToast(`已导出 ${filename}`);
}

function importJSON(ev) {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data || !Array.isArray(data.entries)) throw new Error('格式不对');
      const have = new Set(entries.map(e => e.id));
      const fresh = data.entries.filter(e => e && e.id && !have.has(e.id));
      const tagIds = new Set(tags.map(t => t.id));
      const newTags = (data.tags || []).filter(t => t && t.id && !tagIds.has(t.id));
      const imgs = (data.images || []).filter(im => im && im.id && im.data);
      if (!confirm(`将新增 ${fresh.length} 条记录${newTags.length ? `、${newTags.length} 个标签` : ''}${imgs.length ? `、${imgs.length} 张图片` : ''}（重复的会跳过）。继续？`)) return;
      // 已存在的标签不覆盖（关键词表是精心维护的主数据）
      const fi = tags.findIndex(t => t.fallback);
      tags.splice(fi < 0 ? tags.length : fi, 0, ...newTags.map(t => ({ ...t, fallback: false })));
      entries = entries.concat(fresh);
      // 引用了不存在的标签 → 归到兜底
      const ids = new Set(tags.map(t => t.id));
      const fb = fallbackTag();
      entries.forEach(e => { if (!ids.has(e.tagId)) e.tagId = fb.id; });
      saveEntries(); saveTags();
      for (const im of imgs) { await putImage(im).catch(() => {}); }   // 同 id 覆盖，幂等
      renderSettings(); renderAll(); scrollToBottom(false);
      showToast(`已导入 ${fresh.length} 条`);
    } catch (err) {
      showToast('导入失败：文件格式不对');
    }
  };
  reader.readAsText(file);
  ev.target.value = '';
}

function clearAll() {
  if (!confirm('清除全部记录、图片和标签设置？此操作不可撤销，建议先导出 JSON 备份。'
    + (syncOn() ? '\n\n云端数据不会被删除，下次同步会重新拉回来。' : ''))) return;
  localStorage.removeItem(ENTRIES_KEY);
  localStorage.removeItem(TAGS_KEY);
  idbRun('readwrite', s => s.clear()).catch(() => {});
  imgCache.clear();
  entries = [];
  tags = JSON.parse(JSON.stringify(SEED_TAGS));
  activeFilter = 'all';
  // 清空只清这台设备。快照和游标一起归零，下次同步就当新设备走全量拉取；
  // 标签 hash 按重置后的值写回，免得把 SEED_TAGS 当成「改动」推上去覆盖云端词表
  localStorage.removeItem(SYNC_AT_KEY);
  localStorage.removeItem(SYNC_SNAP_KEY);
  syncSnap = {};
  localStorage.setItem(SYNC_TAGH_KEY, hashStr(JSON.stringify(tags)));
  saveEntries(); saveTags();
  renderSettings(); renderAll();
  showToast('已清空');
}

/* ═══════════════════ 云同步（Cloudflare Worker + D1） ═══════════════════ */

/* 手机记的东西要在电脑上直接看见，中间不能有任何手动步骤，所以做成后台自动同步：
   存一条 → 2.5 秒后推上去；回到前台 / 网络恢复 → 拉一次。服务端在 sync-worker/，
   部署步骤见那儿的 README.md。

   只同步文字和标签，不同步图片——图片是 base64 dataURL，一张几百 KB，走 D1 不
   划算。电脑端拉到带图的记录时图会自动隐藏、文字照常显示，图片仍然只能靠 JSON
   备份带走（跟导出 Markdown 的取舍一致）。 */

const SYNC_URL_KEY   = 'aside-sync-url';
const SYNC_TOKEN_KEY = 'aside-sync-token';
const SYNC_AT_KEY    = 'aside-sync-at';    // 上次同步拿到的服务器时间，增量拉取的游标
const SYNC_SNAP_KEY  = 'aside-sync-snap';  // id → 内容 hash，用来算「哪几条改过」
const SYNC_TAGH_KEY  = 'aside-sync-tagh';  // 标签表的 hash，单独存——混进 snap 会被当成一条记录，进而生成假墓碑

/* 瞬时故障的退避重试。没有这个的话，一次抖动就把这台设备晾到用户下次动手为止：
   catch 里只记个错误，下一轮同步要等到「又存了一条 / 切回前台 / 网络恢复」。
   电脑上 App 开着一直在动，几秒后就被下一次写入带过去了；手机记完就锁屏，
   一次 500 能卡上一整天——这正是「电脑同步好好的、手机没同步上」的由来。 */
const SYNC_BACKOFF = [3000, 15000, 60000];
const SYNC_TIMEOUT = 20000;  // 挂死的请求必须自己断，见 doSync 里的 AbortController

let syncSnap     = loadJSON(SYNC_SNAP_KEY, {}) || {};
let syncing      = false;
let syncTimer    = null;
let syncErr      = '';
let syncRetry    = 0;      // 连续失败次数，即 SYNC_BACKOFF 的下标。成功或换个由头重来就清零
let syncLastAt   = 0;      // 上次「尝试」同步的时刻，给回前台的触发做节流
let suppressSync = false;  // 同步过程里回写本地会调 saveEntries，别让它再触发一轮

// fatal = 重试多少次都一样、非改配置不可，别浪费退避轮次
function syncFail(msg, fatal) { const e = new Error(msg); e.fatal = !!fatal; return e; }

function syncCfg() {
  return {
    url:   (localStorage.getItem(SYNC_URL_KEY) || '').trim().replace(/\/+$/, ''),
    token: (localStorage.getItem(SYNC_TOKEN_KEY) || '').trim(),
  };
}
function syncOn() { const c = syncCfg(); return !!(c.url && c.token); }

// djb2。只存 hash 不存原文：几千条记录的快照压到几十 KB，不跟正文抢 localStorage 那 5MB
function hashStr(s) {
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
  return (h >>> 0).toString(36);
}

// 跟上次同步后的快照比，算出「改过的」和「被删的」。
// 好处是不用往每条 entry 上加 updated 字段——12 个 saveEntries() 调用点一个都不用动。
function collectDirty() {
  const out = [];
  const live = new Set();
  for (const e of entries) {
    live.add(e.id);
    const data = JSON.stringify(e);
    if (syncSnap[e.id] !== hashStr(data)) out.push({ id: e.id, data });
  }
  // 快照里有、现在没了 → 本机删过。必须给服务端留墓碑，否则下次拉取它又活过来
  for (const id in syncSnap) if (!live.has(id)) out.push({ id, deleted: 1 });
  return out;
}

function applyRemote(rows) {
  let n = 0;
  for (const r of rows) {
    if (!r || !r.id) continue;
    const i = entries.findIndex(e => e.id === r.id);
    if (r.deleted) {
      if (i >= 0) {
        (entries[i].imgs || []).forEach(id => { imgCache.delete(id); delImage(id).catch(() => {}); });
        entries.splice(i, 1);
        n++;
      }
      delete syncSnap[r.id];
      continue;
    }
    let e;
    try { e = JSON.parse(r.data); } catch { continue; }
    if (!e || !e.id) continue;
    if (i >= 0) entries[i] = e; else entries.push(e);
    syncSnap[e.id] = hashStr(JSON.stringify(e));
    n++;
  }
  if (n) {
    entries.sort((a, b) => (a.ts || 0) - (b.ts || 0));
    // 别的设备可能引用了本机没有的标签 → 归到兜底，跟 importJSON 的处理一致
    const ids = new Set(tags.map(t => t.id));
    const fb = fallbackTag();
    entries.forEach(e => { if (!ids.has(e.tagId)) e.tagId = fb.id; });
  }
  return n;
}

function scheduleSync(delay = 2500) {
  if (suppressSync || !syncOn()) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => doSync(), delay);
}

async function doSync(opts = {}) {
  const manual = !!opts.manual;
  if (!syncOn())        { if (manual) showToast('还没设置云同步'); return; }
  if (syncing)          { if (manual) showToast('正在同步…'); return; }
  if (!navigator.onLine) { if (manual) showToast('当前没有网络'); return; }
  // 多选、灯箱开着的时候拉到新数据会整屏重绘，打断操作，等一会儿再说
  if (!manual && (document.body.classList.contains('select') || lbEntry)) { scheduleSync(8000); return; }
  // 换了个由头重来（手点、回前台、网络恢复），退避从头算，别接着上一轮的 60 秒
  if (manual || opts.fresh) syncRetry = 0;

  syncing = true;
  syncLastAt = Date.now();
  setSyncStateText('正在同步…');
  try {
    const cfg = syncCfg();
    const since = Number(localStorage.getItem(SYNC_AT_KEY) || 0);
    const dirty = collectDirty();
    const tagsJSON = JSON.stringify(tags);
    const tagsDirty = hashStr(tagsJSON) !== localStorage.getItem(SYNC_TAGH_KEY);

    /* 超时必须自己掐。移动网络下 fetch 可以吊着永不 reject，而 syncing 是在
       finally 里才放开的——真挂住的话这台设备后面每一次同步都会被「正在同步…」
       挡回去，直到用户重启 App。 */
    const ac = new AbortController();
    const killer = setTimeout(() => ac.abort(), SYNC_TIMEOUT);
    let res;
    try {
      res = await fetch(cfg.url + '/sync', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + cfg.token },
        body: JSON.stringify({ since, entries: dirty, tags: tagsDirty ? tagsJSON : null }),
        signal: ac.signal,
      });
    } catch (e) {
      throw syncFail(e.name === 'AbortError' ? '超时' : '连不上服务器');
    } finally {
      clearTimeout(killer);
    }
    if (res.status === 401) throw syncFail('密钥不对', true);
    // 5xx 和 429 是服务端一时不行（冷启动撞上 D1 抖动就会抛 500），值得重试；
    // 其余 4xx 是这个请求本身有问题，重发一模一样的内容不会有别的结果
    if (!res.ok) throw syncFail('服务端 ' + res.status, res.status < 500 && res.status !== 429);
    const out = await res.json();

    // 推成功了快照才跟上。失败就原样留着，下次整批重推——宁可重推也不能漏推
    for (const d of dirty) {
      if (d.deleted) delete syncSnap[d.id];
      else syncSnap[d.id] = hashStr(d.data);
    }
    if (tagsDirty) localStorage.setItem(SYNC_TAGH_KEY, hashStr(tagsJSON));

    let changed = 0;
    // 标签先落地，再合并记录——applyRemote 结尾要拿新标签表校验 tagId
    if (out.tags) {
      try {
        const rt = JSON.parse(out.tags);
        if (Array.isArray(rt) && rt.length) {
          tags = rt;
          if (!tags.some(t => t.fallback)) tags[tags.length - 1].fallback = true;
          localStorage.setItem(SYNC_TAGH_KEY, hashStr(JSON.stringify(tags)));
          changed++;
        }
      } catch { /* 云端标签坏了就不动本地的 */ }
    }
    changed += applyRemote(out.entries || []);

    localStorage.setItem(SYNC_AT_KEY, String(out.now));
    localStorage.setItem(SYNC_SNAP_KEY, JSON.stringify(syncSnap));
    syncErr = '';
    syncRetry = 0;

    if (changed) {
      suppressSync = true;
      saveEntries(); saveTags();
      suppressSync = false;
      renderAll();
      if (document.getElementById('settings-sheet').classList.contains('open')) renderSettings();
    }
    setSyncStateText();
    if (manual) showToast(changed ? `已同步，更新 ${changed} 条` : '已是最新');
    if (out.truncated) scheduleSync(600);   // 这批没拉完，接着拉下一批
  } catch (err) {
    syncErr = err.message || '同步失败';
    if (manual) showToast('同步失败：' + syncErr);
    /* 退避重试走 scheduleSync 而不是自己起 timer，为的是共用 syncTimer：期间用户
       又存了一条的话，那 2.5 秒的正常同步会顶掉排队中的重试，不会两个计时器打架。
       三轮走完就把计数清零交回给自然触发（存记录 / 回前台 / 网络恢复），
       不无限重试——服务端要是真的躺了，每分钟敲一次没有意义。 */
    if (!err.fatal && syncRetry < SYNC_BACKOFF.length) {
      const wait = SYNC_BACKOFF[syncRetry++];
      syncErr += `，${Math.round(wait / 1000)} 秒后重试`;
      scheduleSync(wait);
    } else {
      syncRetry = 0;
    }
    setSyncStateText();
  } finally {
    syncing = false;
  }
}

function syncStateText() {
  if (!syncOn()) return '未开启 · 记录只存在这台设备上';
  if (syncErr) return '上次失败：' + syncErr;
  const at = Number(localStorage.getItem(SYNC_AT_KEY) || 0);
  if (!at) return '已设置 · 还没同步过';
  const d = new Date(at);
  const k = dateKey(d);
  return `上次同步 ${k === todayKey() ? '' : cnDate(k) + ' '}${nowTime(d)}`;
}
// 设置页没开着时元素不存在，直接跳过就行
function setSyncStateText(msg) {
  const el = document.getElementById('sync-state');
  if (el) el.textContent = msg || syncStateText();
}

function openSyncSetup() {
  const c = syncCfg();
  openForm('云同步', `
    <div class="form-group">
      <label class="form-label">Worker 地址</label>
      <input class="form-input" id="sync-url" value="${esc(c.url)}" placeholder="https://aside-sync.xxx.workers.dev"
             autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="url">
      <div class="form-hint">部署 sync-worker 之后 Cloudflare 给的那个网址。</div>
    </div>
    <div class="form-group">
      <label class="form-label">同步密钥</label>
      <input class="form-input" id="sync-token" value="${esc(c.token)}" placeholder="部署时设的 SYNC_KEY"
             autocapitalize="off" autocorrect="off" spellcheck="false">
      <div class="form-hint">每台设备填同一个，填错会提示「密钥不对」。</div>
    </div>
    <button class="btn-primary" onclick="saveSyncCfg()">保存并同步</button>
    ${syncOn() ? `<button class="btn-primary" style="background:var(--red);margin-top:10px" onclick="disableSync()">停用同步</button>` : ''}`);
}

function saveSyncCfg() {
  const url = document.getElementById('sync-url').value.trim().replace(/\/+$/, '');
  const token = document.getElementById('sync-token').value.trim();
  if (!/^https?:\/\//.test(url)) { showToast('地址要以 https:// 开头'); return; }
  if (!token) { showToast('密钥不能为空'); return; }
  localStorage.setItem(SYNC_URL_KEY, url);
  localStorage.setItem(SYNC_TOKEN_KEY, token);
  syncErr = '';
  closeForm();
  renderSettings();
  doSync({ manual: true });
}

function disableSync() {
  if (!confirm('停用后这台设备不再上传和下载。云端已有的数据不受影响。')) return;
  localStorage.removeItem(SYNC_URL_KEY);
  localStorage.removeItem(SYNC_TOKEN_KEY);
  // 游标和快照一并清掉：下次重新启用时当新设备走一次全量。留着残留快照的话，
  // 停用期间删掉的记录会在重新启用时被当成墓碑推上去，把别的设备上的也删了
  localStorage.removeItem(SYNC_AT_KEY);
  localStorage.removeItem(SYNC_SNAP_KEY);
  localStorage.removeItem(SYNC_TAGH_KEY);
  syncSnap = {};
  syncErr = '';
  renderSettings();
  showToast('已停用同步');
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && Date.now() - syncLastAt > 30000) doSync({ fresh: true });
});
window.addEventListener('online', () => doSync({ fresh: true }));

/* ═══════════════════ Viewport（iOS 键盘） ═══════════════════ */

function syncViewport() {
  const vv = window.visualViewport;
  const h = vv ? vv.height : window.innerHeight;
  const top = vv ? vv.offsetTop : 0;
  const kb = Math.max(0, window.innerHeight - h - top);
  const root = document.documentElement;
  root.style.setProperty('--app-h', h + 'px');
  root.style.setProperty('--vv-top', top + 'px');
  root.style.setProperty('--kb', kb + 'px');
  // 键盘弹起时 safe-area 底部内边距会和键盘叠加，关掉它
  root.style.setProperty('--sab-on', kb > 40 ? 0 : 1);
}
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', syncViewport);
  window.visualViewport.addEventListener('scroll', syncViewport);
}
window.addEventListener('orientationchange', () => setTimeout(syncViewport, 250));
window.addEventListener('pageshow', syncViewport);
window.addEventListener('resize', syncViewport);

/* ═══════════════════ Init ═══════════════════ */

syncViewport();
saveTags();
renderAll();

// 横滑：捕获阶段，理由见 swDown 上面那段
(() => {
  const s = document.getElementById('stream');
  s.addEventListener('pointerdown',   swDown, true);
  s.addEventListener('pointermove',   swMove, true);
  s.addEventListener('pointerup',     swUp,   true);
  s.addEventListener('pointercancel', swEnd,  true);
})();

/* 4 小时的界限会自己走过去。每分钟对一次「该在哪边」，只有真变了才重画——
   不设这个的话，一条消息要等到下次点按才肯漂到左边。 */
let lastSides = entries.map(onRight).join('');
setInterval(() => {
  const now = entries.map(onRight).join('');
  if (now !== lastSides) { lastSides = now; renderAll(); }
}, 60 * 1000);

scrollToBottom(false);
renderAttachStrip();
initScanTip();

// 启动先拉一次：在电脑上打开时立刻看到手机上记的内容，不用等 debounce
if (syncOn()) doSync({ fresh: true });

// 存了图片就得申请持久化，否则 Safari 空间紧张时会把 IndexedDB 清掉
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js').catch(() => {}));
}
</script>
