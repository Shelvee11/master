<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Aside">
  <meta name="theme-color" content="#efeeea">
  <!-- 主题必须在首屏画之前定下来，否则会闪一下默认色 -->
  <!-- 改名迁移：项目原叫 DayLog，所有键从 daylog-* 换到 aside-*。必须跑在任何一次
       读键之前（包括紧接着的主题读取），否则老用户开机看见的是一个空 App。
       逐键「拷完就删」，不一次性铺开——localStorage 只有 5MB，同时留两份可能撑爆。 -->
  <script>
    try {
      if (!localStorage.getItem('aside-renamed')) {
        var olds = [];
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k && k.indexOf('daylog-') === 0) olds.push(k);
        }
        for (var j = 0; j < olds.length; j++) {
          var nk = 'aside-' + olds[j].slice(7);
          if (localStorage.getItem(nk) === null) localStorage.setItem(nk, localStorage.getItem(olds[j]));
          localStorage.removeItem(olds[j]);
        }
        // Worker 也一起改名了，把存着的老地址换掉，省得每台设备进设置重填
        var su = localStorage.getItem('aside-sync-url');
        if (su && su.indexOf('daylog-sync.') > -1) {
          localStorage.setItem('aside-sync-url', su.replace('daylog-sync.', 'aside-sync.'));
        }
        localStorage.setItem('aside-renamed', '1');
      }
    } catch (e) {}
    try {
      var th = localStorage.getItem('aside-theme');
      if (th && th !== 'mynd') {
        document.documentElement.setAttribute('data-theme', th);
        document.querySelector('meta[name="theme-color"]').setAttribute('content', th === 'blue' ? '#ffffff' : '#efeeea');
      }
    } catch (e) {}
  </script>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <title>Aside — 对话式记录</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    /* 配色参照 mynd：暖灰底 + 纯白气泡 + 墨绿高亮，无描边、大圆角 */
    :root {
      --accent:  #3d4f45;   /* 墨绿：今天的气泡、选中态、强调文字 */
      --accent2: #55685c;
      --accent-fg: #ffffff;
      --red:     #b4483c;
      --label:   #1a1a18;
      --label2:  #6b6b64;
      --label3:  #a3a29b;
      --fill:    #e7e6e1;
      --fill2:   #dedcd6;
      --bg:      #efeeea;   /* 页面底 */
      --bg2:     #ffffff;   /* 往日的气泡 / 输入框 / 筛选 chip / 圆按钮 */
      --card:    #ffffff;   /* 设置卡片 / 面板 / 操作表 */
      --bg-blur: rgba(239,238,234,0.92);   /* 顶栏和输入条的毛玻璃底 */
      --hl:      #f0dd7a;   /* 高光气泡 */
      --hl-fg:   #4a4126;
      --sep:     #e2e0da;
      --radius:  18px;
      /* 气泡：三个大圆角 + 尾巴那一角收小（照 mynd）。
         想微调松紧就改这四个数，别去改 .bubble 本身 */
      --bubble-r:     20px;
      --bubble-tail:   7px;   /* 靠说话人那一侧的上角 */
      --bubble-pad-y:  9px;
      --bubble-pad-x: 14px;
      --app-h:   100dvh;
      --vv-top:  0px;
      --kb:      0px;
    }

    /* 备选配色：白底天蓝（参照 iMessage）——灰气泡在左，蓝气泡在右 */
    :root[data-theme="blue"] {
      --accent:  #1f8cf5;
      --accent2: #4aa3f7;
      --accent-fg: #ffffff;
      --red:     #e5484d;
      --label:   #000000;
      --label2:  #6e6e73;
      --label3:  #aeaeb2;
      --fill:    #e9e9eb;
      --fill2:   #dcdce0;
      --bg:      #ffffff;
      --bg2:     #e9e9eb;
      --card:    #ffffff;
      --bg-blur: rgba(255,255,255,0.9);
      --sep:     #e3e3e6;
      --hl:      #f4e361;
      --hl-fg:   #3d3608;
    }

    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: var(--label);
      -webkit-font-smoothing: antialiased;
    }

    /* 整个 App 装在一个固定高度的 flex 列里：header / chips / 滚动流 / 输入条
       高度取 visualViewport，键盘弹起时输入条自动跟着抬起（见底部 syncViewport） */
    .app {
      position: fixed; left: 0; right: 0;
      top: var(--vv-top); height: var(--app-h);
      display: flex; flex-direction: column;
    }

    /* ── Header ── */
    header {
      flex: none;
      background: var(--bg-blur);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      padding: 14px 20px 12px;
      padding-top: calc(env(safe-area-inset-top) + 14px);
    }
    .head-row { max-width: 430px; margin: 0 auto; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    header h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.6px; color: var(--label); }
    header p  { font-size: 12px; color: var(--label3); margin-top: 3px; letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }
    .icon-btn {
      flex: none; border: none; cursor: pointer; line-height: 0;
      width: 38px; height: 38px; border-radius: 50%;
      background: var(--bg2); color: var(--label);
      display: flex; align-items: center; justify-content: center;
    }
    .icon-btn:active { opacity: 0.6; }
    .head-btns { display: flex; gap: 8px; flex: none; }

    /* 多选模式的顶栏（仿「信息」：左全选 / 中计数 / 右取消） */
    .selbar { max-width: 430px; margin: 0 auto; display: none; align-items: center; justify-content: space-between; gap: 12px; min-height: 41px; }
    body.select .selbar { display: flex; }
    body.select .head-row { display: none; }
    .selbar-text {
      border: none; background: none; padding: 2px 0; cursor: pointer;
      font-family: inherit; font-size: 15px; font-weight: 700; color: var(--accent);
    }
    .selbar-text:active { opacity: 0.5; }
    .selbar-count { font-size: 15px; font-weight: 700; color: var(--label); }

    /* ── Filter chips ── */
    .filters {
      flex: none; background: var(--bg-blur);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      overflow-x: auto; -webkit-overflow-scrolling: touch;
    }
    .filters::-webkit-scrollbar { display: none; }
    .filters-inner { display: flex; gap: 8px; padding: 4px 16px 12px; width: max-content; min-width: 100%; }
    .fchip {
      flex: none; border: none; background: var(--bg2);
      color: var(--label2); border-radius: 999px; padding: 7px 14px;
      font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer;
      white-space: nowrap;
    }
    .fchip.active { background: var(--accent); color: var(--accent-fg); }
    .fchip:active { opacity: 0.75; }

    /* ── Stream ── */
    /* overflow-x 必须显式写 hidden：只写 overflow-y 的话另一个轴会被算成 auto，
       气泡横滑出边界就撑出一条横向滚动，iOS 会把手势判给容器滚动、发 pointercancel，
       这一滑就白滑了 */
    .stream-wrap { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
    .stream {
      max-width: 430px; margin: 0 auto;
      padding: 12px 16px 24px;
      display: flex; flex-direction: column; gap: 14px;
    }
    .daysep {
      align-self: center; margin: 10px 0 2px;
      color: var(--label3); padding: 3px 10px; border-radius: 999px;
      font-size: 12px; font-weight: 600; letter-spacing: 0.04em;
    }
    .daysep:first-child { margin-top: 0; }

    /* 一行 = 左侧勾选圈（多选时才滑出）+ 记录本体
       横滑的判定区是整行不是气泡：一行只有一个气泡，不存在歧义，而气泡短的时候
       （「好」「买菜」这种）实在按不住。pan-y 放在这儿，竖向滚动照旧交给浏览器 */
    .srow { display: flex; align-items: center; touch-action: pan-y; }
    .selcirc {
      flex: none; width: 0; opacity: 0; margin-right: 0; border: none; padding: 0;
      background: none; cursor: pointer; line-height: 0; color: var(--label3);
      transition: width 0.22s cubic-bezier(0.32,0.72,0,1), margin-right 0.22s, opacity 0.18s;
      overflow: hidden;
    }
    body.select .selcirc { width: 24px; margin-right: 12px; opacity: 1; }
    .selcirc .on  { display: none; }
    .selcirc.checked .off { display: none; }
    .selcirc.checked .on { display: block; color: var(--accent); }
    body.select .srow { cursor: pointer; }
    body.select .bubble, body.select .imgs img, body.select .tagchip { cursor: pointer; pointer-events: none; }
    body.select .srow.checked .bubble { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* 一条记录 = 气泡 + 气泡外下方的「标签 · 时间」 */
    .brow { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; max-width: 100%; }
    .brow.me { align-items: flex-end; }
    .bubble {
      max-width: 88%; padding: var(--bubble-pad-y) var(--bubble-pad-x);
      background: var(--bg2); color: var(--label);
      /* 收小的那一角贴着说话人：往日在左，收左上角；今天在右，收右上角（下面覆盖）。
         四个值的顺序是 左上 右上 右下 左下 */
      border-radius: var(--bubble-tail) var(--bubble-r) var(--bubble-r) var(--bubble-r);
      cursor: pointer;
      /* 关掉系统选词：双击要用来开待办，不然每次都先蹦出一个「拷贝」气泡。
         拷贝走长按菜单里的「拷贝」 */
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      /* 横滑归我们，竖向滚动照旧交给浏览器——写 none 会把整条时间线滚不动 */
      touch-action: pan-y;
      transition: transform 0.18s ease;
    }
    .brow.me .bubble {
      background: var(--accent); color: var(--accent-fg);
      border-radius: var(--bubble-r) var(--bubble-tail) var(--bubble-r) var(--bubble-r);
    }
    .bubble:active { opacity: 0.8; }

    /* 高光：整条气泡换成便签黄，左右两侧都盖掉 */
    .bubble.hl, .brow.me .bubble.hl { background: var(--hl); color: var(--hl-fg); }
    /* 摘抄：左边一道竖线 + 正文内缩，竖线用 currentColor 才能同时适配深底和白底 */
    .bubble.qt { position: relative; padding-left: 28px; }
    .bubble.qt::before {
      content: ''; position: absolute; left: 15px; top: 13px; bottom: 13px;
      width: 3px; border-radius: 2px; background: currentColor; opacity: 0.38;
    }
    /* 从置顶列表跳回来时闪一下 */
    @keyframes flash { 0%, 100% { box-shadow: 0 0 0 0 transparent; } 30%, 70% { box-shadow: 0 0 0 4px var(--accent2); } }
    .srow.flash .bubble { animation: flash 1.1s ease; }

    /* 待办：气泡里长出一个能勾的正圆（照 mynd），多行时圆垂直居中。
       只让这一行 flex，不动整个气泡——气泡顶部还得能放回复引用 */
    .tdrow { display: flex; align-items: center; gap: 11px; }
    .td-box {
      flex: none; width: 22px; height: 22px; padding: 0;
      border-radius: 50%; border: 2px solid currentColor; opacity: 0.5;
      background: none; color: inherit; cursor: pointer; line-height: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .td-box:active { transform: scale(0.88); }
    .td-box .tick { display: none; }
    /* 勾上用主题色，不用 currentColor——往日气泡的正文色是近黑，勾上去太重，
       跟这套暖灰配色打架。今天的气泡本身就是主题色，那里反过来用白底绿勾 */
    .bubble.td.done .td-box { opacity: 1; background: var(--accent); border-color: var(--accent); }
    .bubble.td.done .td-box .tick { display: block; color: #fff; }
    .brow.me .bubble.td.done .td-box { background: var(--accent-fg); border-color: var(--accent-fg); }
    .brow.me .bubble.td.done .td-box .tick { color: var(--accent); }
    .bubble.td.done .btext { text-decoration: line-through; opacity: 0.5; }
    .tdrow .tdwrap { flex: 1; min-width: 0; }

    /* 隐藏：糊掉就是糊掉，没有「点一下看」。要看得长按走菜单里的「取消隐藏」。
       veil 是一层透明挡板，专门吃掉落在图片上的点击（图片有自己的 onclick） */
    .bubble.msk { position: relative; -webkit-user-select: none; user-select: none; }
    .bubble.msk > * { filter: blur(7px); opacity: 0.5; }
    .msk-veil { position: absolute; inset: 0; z-index: 2; border-radius: inherit; }

    /* 回复：原文引用嵌在气泡顶部（照 mynd）——竖线 + 日期时间 + 原文摘要。
       用 currentColor + opacity，白气泡和主题色气泡上都不用各配一套颜色 */
    .requote {
      margin: -1px 0 8px; padding: 1px 0 1px 10px;
      border-left: 2.5px solid currentColor; cursor: pointer;
      opacity: 0.6; font-size: 12.5px; line-height: 1.42; overflow: hidden;
    }
    .requote-when { font-weight: 600; }
    .requote-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .requote.gone { cursor: default; font-style: italic; }
    .requote:not(.gone):active { opacity: 0.32; }
    .threadchip { color: var(--label2); font-weight: 600; white-space: nowrap; cursor: pointer; }
    .threadchip:active { opacity: 0.5; }

    /* thread 列表：按层级缩进，当前这条描一圈 */
    .th-row { display: flex; align-items: flex-start; gap: 8px; padding: 10px 2px; cursor: pointer; }
    .th-row + .th-row { border-top: 1px solid var(--sep); }
    .th-rail { flex: none; width: 2px; align-self: stretch; border-radius: 2px; background: var(--fill2); }
    .th-row.cur .th-rail { background: var(--accent); }
    .th-body { flex: 1; min-width: 0; }
    .th-text { font-size: 14.5px; line-height: 1.5; color: var(--label); }
    .th-row.done .th-text { text-decoration: line-through; opacity: 0.55; }
    .th-meta { font-size: 11.5px; color: var(--label3); margin-top: 3px; }
    .th-row:active { opacity: 0.6; }

    /* 置顶只在顶部露一颗气球，气泡旁边不挂标记（用户要气球不要钉子） */
    .pinbar {
      flex: none; display: none; align-items: center; justify-content: center; gap: 6px;
      padding: 0 16px 10px; background: var(--bg-blur);
      backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
      cursor: pointer;
    }
    .pinbar.on { display: flex; }
    body.select .pinbar { display: none; }
    .pinbar-pill {
      max-width: 100%; display: flex; align-items: center; gap: 6px;
      background: var(--fill); color: var(--label2);
      border-radius: 999px; padding: 6px 14px; font-size: 12.5px;
    }
    .pinbar-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pinbar-n { flex: none; color: var(--label3); }
    .pinbar:active .pinbar-pill { opacity: 0.6; }

    /* 置顶列表里的一行 */
    .pin-row { display: flex; align-items: flex-start; gap: 10px; padding: 12px 2px; border-bottom: 1px solid var(--sep); }
    .pin-row:last-child { border-bottom: none; }
    .pin-row-info { flex: 1; min-width: 0; cursor: pointer; }
    .pin-row-text { font-size: 14.5px; line-height: 1.5; color: var(--label); }
    .pin-row-meta { font-size: 11.5px; color: var(--label3); margin-top: 3px; }
    .pin-row-off {
      flex: none; border: none; background: none; color: var(--accent);
      font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; padding: 2px 0;
    }
    .pin-row-off:active { opacity: 0.5; }
    .btext { font-size: 15.5px; line-height: 1.4; white-space: pre-wrap; word-break: break-word; }
    .bmeta {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 6px 0; font-size: 12px; color: var(--label3);
      font-variant-numeric: tabular-nums;
    }
    .tagchip { color: var(--label2); font-weight: 600; white-space: nowrap; }
    .tagchip:active { opacity: 0.5; }
    .empty { text-align: center; color: var(--label3); font-size: 14px; line-height: 1.7; padding: 60px 20px; }

    /* ── Composer ── */
    .composer {
      flex: none;
      background: var(--bg-blur);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      padding: 8px 16px 12px;
      padding-bottom: calc(env(safe-area-inset-bottom) * var(--sab-on, 1) + 12px);
    }
    .composer-inner { max-width: 430px; margin: 0 auto; display: flex; align-items: flex-end; gap: 10px; }

    /* 输入框上方的提示条：开屏指路到加号（关掉就不再出现），
       以及从加号点「扫描文本」后的现场教学（15 秒自收） */
    .tip {
      max-width: 430px; margin: 0 auto 8px;
      display: none; align-items: center; gap: 8px;
      background: var(--fill); color: var(--label2);
      border-radius: 999px; padding: 8px 8px 8px 14px;
      font-size: 12.5px; line-height: 1.4;
    }
    .tip.on { display: flex; }
    body.select .tip { display: none; }
    .tip-text { flex: 1; min-width: 0; }
    .tip-x {
      flex: none; width: 24px; height: 24px; border-radius: 50%; border: none;
      background: none; color: var(--label3); cursor: pointer; font-family: inherit;
      font-size: 13px; line-height: 1; display: flex; align-items: center; justify-content: center;
    }
    .tip-x:active { opacity: 0.5; }

    /* 输入条上方的两条状态：补记（写进过去的某天）和回复（挂到某条底下）。
       两条可以同时亮着——补记到上周，同时回复上周的某条。 */
    .cbar {
      max-width: 430px; margin: 0 auto 8px;
      display: none; align-items: center; gap: 8px;
      border-radius: 999px; padding: 6px 6px 6px 13px;
      font-size: 12.5px; line-height: 1.35;
    }
    .cbar.on { display: flex; }
    body.select .cbar { display: none; }
    /* 状态条亮着时把扫描提示收起来，输入框上面不叠三层 */
    body.backfilling .tip, body.replying .tip { display: none; }
    .cbar-label { flex: none; font-weight: 700; opacity: 0.7; }
    .cbar-main {
      flex: 1; min-width: 0; text-align: left; padding: 0;
      border: none; background: none; color: inherit; font-family: inherit;
      font-size: 12.5px; font-weight: 700; cursor: pointer;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .cbar-x {
      flex: none; width: 24px; height: 24px; border-radius: 50%; border: none;
      background: rgba(127,127,127,0.18); color: inherit; cursor: pointer;
      font-family: inherit; font-size: 12px; line-height: 1;
      display: flex; align-items: center; justify-content: center;
    }
    .cbar-x:active { opacity: 0.5; }
    #backfill-bar { background: var(--accent); color: var(--accent-fg); }
    #backfill-bar .cbar-main { text-decoration: underline; text-underline-offset: 2px; text-decoration-thickness: 1px; }
    #backfill-bar .cbar-x { background: rgba(255,255,255,0.22); }
    #reply-bar { background: var(--fill); color: var(--label2); }
    /* 多选时输入条换成删除条 */
    body.select .composer-inner, body.select .attach-strip { display: none; }
    .selactions { max-width: 430px; margin: 0 auto; display: none; align-items: center; justify-content: space-between; gap: 12px; }
    body.select .selactions { display: flex; }
    .del-btn {
      border: none; border-radius: 999px; padding: 11px 20px; cursor: pointer;
      font-family: inherit; font-size: 15px; font-weight: 700;
      background: var(--red); color: #fff;
      display: flex; align-items: center; gap: 7px;
    }
    .del-btn:disabled { background: var(--fill2); color: var(--label3); }
    .del-btn:not(:disabled):active { opacity: 0.75; }
    .sel-hint { font-size: 13px; color: var(--label3); }
    #input {
      flex: 1; resize: none; border: none; background: var(--bg2);
      border-radius: 22px; padding: 12px 16px; font-size: 15.5px; line-height: 1.45;
      font-family: inherit; color: var(--label); outline: none;
      max-height: 120px;
    }
    #input::placeholder { color: var(--label3); }
    .send-btn {
      flex: none; width: 44px; height: 44px; border-radius: 50%; border: none;
      background: var(--accent); color: var(--accent-fg); cursor: pointer; line-height: 0;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, color 0.15s, transform 0.15s;
    }
    .send-btn:disabled { background: var(--bg2); color: var(--label3); }
    .send-btn:active:not(:disabled) { transform: scale(0.92); }
    .card-sub { font-size: 12px; color: var(--label3); }

    /* ── Toast ── */
    .toast {
      position: fixed; top: calc(env(safe-area-inset-top) + 60px);
      left: 50%; transform: translateX(-50%) translateY(-20px);
      background: var(--label); color: #fff; padding: 9px 14px 9px 18px;
      border-radius: 20px; font-size: 14px; font-weight: 600;
      opacity: 0; transition: all 0.25s cubic-bezier(0.32,0.72,0,1); z-index: 400;
      pointer-events: none; white-space: nowrap;
      display: flex; align-items: center; gap: 10px;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
    .toast-action {
      border: none; background: rgba(255,255,255,0.18); color: #fff;
      font-family: inherit; font-size: 13px; font-weight: 700;
      padding: 5px 11px; border-radius: 999px; cursor: pointer;
    }
    .toast-action:active { opacity: 0.6; }

    /* ── Bottom sheet ── */
    .overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.3);
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .overlay.open { opacity: 1; pointer-events: auto; }
    .sheet {
      position: fixed; left: 0; right: 0; bottom: var(--kb); z-index: 201;
      background: var(--card);
      border-radius: var(--radius) var(--radius) 0 0;
      padding: 18px 20px calc(env(safe-area-inset-bottom) * var(--sab-on, 1) + 20px);
      transform: translateY(110%); transition: transform 0.28s cubic-bezier(0.32,0.72,0,1);
      max-height: 84%; overflow-y: auto;
    }
    .sheet.open { transform: translateY(0); }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .sheet-title { font-size: 17px; font-weight: 700; }
    .sheet-done {
      border: none; background: none; color: var(--accent);
      font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; padding: 2px 0;
    }
    .sheet-done:active { opacity: 0.5; }

    /* ── Action sheet ── */
    .action-overlay {
      position: fixed; inset: 0; z-index: 300;
      background: rgba(0,0,0,0.25);
      display: flex; align-items: flex-end;
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .action-overlay.open { opacity: 1; pointer-events: auto; }
    .action-sheet {
      width: 100%; padding: 0 12px calc(env(safe-area-inset-bottom) * var(--sab-on, 1) + 12px);
      transform: translateY(110%); transition: transform 0.28s cubic-bezier(0.32,0.72,0,1);
      max-height: 90%; overflow-y: auto;
    }
    .action-overlay.open .action-sheet { transform: translateY(0); }
    .action-group {
      background: var(--card); border-radius: var(--radius);
      overflow: hidden; margin-bottom: 10px;
    }
    .action-title {
      padding: 12px 16px 10px; font-size: 13px; color: var(--label2);
      text-align: center; border-bottom: 1px solid var(--sep); line-height: 1.5;
    }
    /* 菜单项左对齐 + 描线图标（照 mynd）：居中排版塞不下图标，也读不成一列 */
    .action-btn {
      width: 100%; padding: 14px 18px; border: none; background: var(--card);
      font-size: 16px; font-family: inherit; color: var(--label); cursor: pointer;
      border-bottom: 1px solid var(--sep); display: flex; align-items: center; gap: 14px;
      justify-content: flex-start; text-align: left;
    }
    .action-btn:last-child { border-bottom: none; }
    .action-btn:active { background: var(--fill); }
    .action-btn.danger { color: var(--red); }
    .action-btn.strong { font-weight: 700; justify-content: center; }
    .action-ico { width: 21px; height: 21px; flex: none; }
    .action-check { color: var(--accent); font-weight: 800; margin-left: auto; }
    /* 属性行（标签 / 时间）：右边挂当前值 + 箭头。
       「点它可以换一个」由这个组合说明，标题就不用写成动词了，顺带不点开也看得见现在是什么 */
    .action-val {
      margin-left: auto; min-width: 0; font-size: 15px; color: var(--label2);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .action-val i { font-style: normal; color: var(--label3); margin-left: 6px; }

    /* ── Cards (settings) ── */
    .card-label {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--label3); margin: 18px 2px 8px;
    }
    .card-label:first-of-type { margin-top: 0; }
    .card {
      background: var(--card); border-radius: var(--radius); overflow: hidden;
    }
    .row {
      display: flex; align-items: center; gap: 10px;
      padding: 13px 14px; border-bottom: 1px solid var(--sep);
    }
    .row:last-child { border-bottom: none; }
    .row-btn { width: 100%; border: none; background: var(--card); font-family: inherit;
      font-size: 15px; color: var(--accent); cursor: pointer; text-align: left; font-weight: 600; }
    .row-btn:active { background: var(--fill); }
    .row-btn.danger { color: var(--red); }
    .row-emoji { font-size: 20px; width: 26px; text-align: center; flex: none; }
    .row-info { flex: 1; min-width: 0; }
    .row-name { font-size: 15px; font-weight: 600; }
    .row-sub { font-size: 12px; color: var(--label3); margin-top: 2px; }
    .row-mini {
      flex: none; border: none; background: var(--fill);
      width: 30px; height: 30px; border-radius: 8px; color: var(--label2);
      font-size: 15px; font-family: inherit; cursor: pointer; line-height: 1;
    }
    .row-mini:disabled { color: var(--label3); opacity: 0.4; }
    .row-mini:active:not(:disabled) { background: var(--fill); }

    /* month nav */
    .month-nav { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; }
    .month-label { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .nav-btn {
      width: 30px; height: 30px; border-radius: 50%; border: none;
      background: var(--fill); color: var(--label2); font-size: 14px; cursor: pointer;
      font-family: inherit; line-height: 1;
    }
    .nav-btn:disabled { color: var(--label3); opacity: 0.4; }
    .nav-btn:active:not(:disabled) { background: var(--fill); }

    /* forms */
    .form-group { margin-bottom: 14px; }
    .form-label { font-size: 12px; font-weight: 600; color: var(--label2); margin-bottom: 6px; display: block; }
    .form-input, .form-area {
      width: 100%; padding: 10px 12px; border: 1.5px solid var(--sep);
      border-radius: 10px; font-size: 15px; font-family: inherit; color: var(--label);
      outline: none; transition: border-color 0.15s; background: var(--card);
    }
    .form-area { resize: vertical; min-height: 88px; line-height: 1.5; }
    .form-input:focus, .form-area:focus { border-color: var(--accent); }
    .form-row { display: flex; gap: 10px; }
    .form-hint { font-size: 11px; color: var(--label3); margin-top: 5px; line-height: 1.5; }
    .btn-primary {
      width: 100%; padding: 13px; border: none; border-radius: 12px;
      background: var(--accent); color: #fff; font-size: 15px; font-weight: 700;
      font-family: inherit; cursor: pointer; margin-top: 4px;
    }
    .btn-primary:active { opacity: 0.8; }
    .filename {
      margin-top: 10px; padding: 8px 12px; border-radius: 10px;
      background: var(--fill); color: var(--label2);
      font-size: 12.5px; text-align: center; word-break: break-all;
      font-variant-numeric: tabular-nums;
    }
    /* 「高级」折叠区：JSON 备份/恢复/清空都藏在这后面 */
    .adv { margin-top: 18px; }
    .adv > summary {
      list-style: none; cursor: pointer;
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--label3); padding: 4px 2px 8px;
    }
    .adv > summary::-webkit-details-marker { display: none; }
    .adv > summary::before { content: '▸ '; }
    .adv[open] > summary::before { content: '▾ '; }
    .adv > summary:active { opacity: 0.5; }
    /* ── 图片 ── */
    /* 展开就是一张张大图竖着排，不做宫格缩略图；宽高按原图比例，不裁不留黑边 */
    .imgs { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; align-items: flex-start; }
    .imgs:last-child { margin-bottom: 0; }
    /* 图片不参与云同步：别的设备拉过来的记录只剩文字，纯图片的记录就靠这个占位撑住 */
    .imgmiss { font-size: 13px; opacity: 0.45; }
    .imgs img {
      display: block; width: auto; height: auto;
      max-width: 100%; max-height: 380px;
      border-radius: 12px; background: var(--fill);
    }

    /* 多张图默认合并成一叠（仿微信）：顶图后面透出两张卡的边 */
    .imgstack { position: relative; isolation: isolate; width: 168px; max-width: 100%; cursor: pointer; }
    /* 顶图后面透出两张卡的边；描一道 sep 线，白气泡里也看得见 */
    .imgstack::before, .imgstack::after {
      content: ''; position: absolute; top: 9px; bottom: 9px; z-index: 0;
      border-radius: 12px; background: var(--fill);
      box-shadow: 0 0 0 0.5px rgba(31,30,26,0.10), -2px 2px 6px rgba(31,30,26,0.14);
    }
    .imgstack::before { left: -13px; right: 13px; }
    .imgstack::after  { left: -6.5px; right: 6.5px; }
    .imgstack img {
      position: relative; z-index: 1; display: block; width: 100%;
      aspect-ratio: 4/3; object-fit: cover; border-radius: 12px;
      box-shadow: -2px 2px 6px rgba(31,30,26,0.14);
    }
    .imgstack:active { opacity: 0.85; }

    /* 气泡 + 旁边的「展开 N / 收起」灰药丸 */
    /* width:100% 是必须的：.bline 若是 shrink-to-fit，气泡的 max-width:84%
       会拿自己的内容宽去算百分比，结果气泡被越算越窄、文字乱折行 */
    .bline { display: flex; align-items: center; gap: 10px; width: 100%; }
    .brow.me .bline { justify-content: flex-end; }
    .brow:not(.me) .bline { flex-direction: row-reverse; justify-content: flex-end; }
    .expand-pill {
      flex: none; border: none; cursor: pointer; font-family: inherit;
      background: var(--fill); color: var(--label2);
      border-radius: 999px; padding: 6px 12px;
      font-size: 12.5px; font-weight: 600; white-space: nowrap;
    }
    .expand-pill:active { opacity: 0.6; }
    body.select .expand-pill { pointer-events: none; }

    /* 待发送的附件条 */
    .attach-strip { max-width: 430px; margin: 0 auto 8px; display: flex; gap: 8px; }
    .attach-thumb { position: relative; width: 62px; height: 62px; flex: none; }
    .attach-thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; display: block; }
    .attach-x {
      position: absolute; top: -6px; right: -6px; width: 22px; height: 22px;
      border-radius: 50%; border: 2px solid var(--bg); background: var(--label);
      color: #fff; font-size: 12px; line-height: 1; cursor: pointer;
      display: flex; align-items: center; justify-content: center; font-family: inherit;
    }
    .plus-btn {
      flex: none; width: 44px; height: 44px; border-radius: 50%; border: none;
      background: var(--bg2); color: var(--label); cursor: pointer; line-height: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .plus-btn:active { transform: scale(0.92); }
    .plus-btn:disabled { color: var(--label3); }
    /* 长按加号 = 读剪贴板，别让 iOS 弹出系统的长按浮层 */
    .plus-btn { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }

    /* 看大图 */
    .lightbox {
      position: fixed; inset: 0; z-index: 500; background: rgba(0,0,0,0.92);
      display: flex; align-items: center; justify-content: center; padding: 20px;
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .lightbox.open { opacity: 1; pointer-events: auto; }
    .lightbox img {
      max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px;
      -webkit-user-drag: none; user-select: none; pointer-events: none;   /* 让滑动落在灯箱上 */
    }
    .lb-count {
      position: absolute; left: 0; right: 0;
      top: calc(env(safe-area-inset-top) + 18px);
      text-align: center; color: rgba(255,255,255,0.85);
      font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums;
      pointer-events: none;
    }
    .lightbox-bar {
      position: absolute; left: 0; right: 0; bottom: 0;
      padding: 16px 20px calc(env(safe-area-inset-bottom) * var(--sab-on, 1) + 20px);
      display: flex; align-items: center; justify-content: space-between;
    }
    .lb-btn {
      border: none; background: rgba(255,255,255,0.16); color: #fff; cursor: pointer;
      border-radius: 999px; padding: 10px 18px; font-family: inherit; font-size: 15px; font-weight: 600;
      display: flex; align-items: center; gap: 7px;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    .lb-btn.danger { color: #ff6b5c; }
    .lb-btn:active { opacity: 0.6; }

    /* 配色选项：一块小色板，里面两颗气泡表示往日 / 今天 */
    .theme-row { cursor: pointer; }
    .theme-row:active { background: var(--fill); }
    .theme-swatch {
      flex: none; width: 44px; height: 34px; border-radius: 9px;
      box-shadow: inset 0 0 0 0.5px rgba(31,30,26,0.14);
      display: flex; flex-direction: column; justify-content: center; gap: 4px;
      padding: 0 5px; overflow: hidden;
    }
    .theme-swatch i { display: block; height: 8px; border-radius: 4px; }
    .theme-swatch i:first-child { width: 62%; align-self: flex-start; }
    .theme-swatch i:last-child  { width: 78%; align-self: flex-end; }

    .kw-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .kw-chip {
      border: 1px solid var(--sep); background: var(--card); color: var(--label2);
      border-radius: 999px; padding: 7px 13px; font-size: 14px;
      font-family: inherit; cursor: pointer;
    }
    .kw-chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* ── 日历（回溯 + 补记入口） ── */
    .cal-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .cal-when { text-align: center; }
    .cal-title { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .cal-sub { font-size: 11.5px; color: var(--label3); margin-top: 2px; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .cal-wd { text-align: center; font-size: 11px; font-weight: 600; color: var(--label3); padding-bottom: 2px; }
    .cal-cell {
      aspect-ratio: 1 / 1; border: none; background: none; padding: 0;
      border-radius: 12px; font-family: inherit; color: var(--label); cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
      -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
    }
    .cal-cell.blank { visibility: hidden; }
    .cal-cell:disabled { color: var(--label3); opacity: 0.3; cursor: default; }
    .cal-d { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .cal-dot { width: 5px; height: 5px; border-radius: 50%; background: transparent; }
    /* 三档密度：一眼看出哪几天记得多，不做连续天数（跟 mynd 一样不催更） */
    .cal-cell.lv1 { background: var(--fill); }
    .cal-cell.lv2 { background: var(--fill2); }
    .cal-cell.lv3 { background: var(--accent); color: var(--accent-fg); }
    .cal-cell.lv1 .cal-dot, .cal-cell.lv2 .cal-dot { background: var(--accent); }
    .cal-cell.lv3 .cal-dot { background: var(--accent-fg); }
    .cal-cell.today { box-shadow: inset 0 0 0 1.6px var(--accent); }
    .cal-cell.today .cal-d { color: var(--accent); }
    .cal-cell.lv3.today .cal-d { color: var(--accent-fg); }
    .cal-cell.bf { box-shadow: inset 0 0 0 2px var(--red); }
    .cal-cell:active:not(:disabled) { opacity: 0.55; }
    .cal-legend { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 12px; font-size: 11px; color: var(--label3); }
    .cal-legend i { width: 13px; height: 13px; border-radius: 4px; display: block; }

    /* 日历跳回某天时，那天的分隔条闪一下 */
    @keyframes flashday {
      0%, 55% { background: var(--accent); color: var(--accent-fg); }
      100% { background: transparent; color: var(--label3); }
    }
    .daysep.flash-day { animation: flashday 1.6s ease; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="app">
  <header>
    <div class="head-row">
      <div>
        <h1>Aside</h1>
        <p id="subtitle">—</p>
      </div>
      <div class="head-btns">
      <button class="icon-btn" onclick="openCalendar()" aria-label="日历">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="16" rx="3"></rect>
          <line x1="3" y1="10" x2="21" y2="10"></line>
          <line x1="8" y1="3" x2="8" y2="6.5"></line>
          <line x1="16" y1="3" x2="16" y2="6.5"></line>
        </svg>
      </button>
      <button class="icon-btn" onclick="enterSelect()" aria-label="选择记录">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 7 5.2 9.2 9.4 5"></polyline>
          <polyline points="3 17 5.2 19.2 9.4 15"></polyline>
          <line x1="13" y1="7" x2="21" y2="7"></line>
          <line x1="13" y1="17" x2="21" y2="17"></line>
        </svg>
      </button>
      <button class="icon-btn" onclick="openSettings()" aria-label="设置">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
      </div>
    </div>

    <!-- 多选顶栏 -->
    <div class="selbar">
      <button class="selbar-text" id="sel-all" onclick="toggleSelectAll()">全选</button>
      <span class="selbar-count" id="sel-count">未选择记录</span>
      <button class="selbar-text" onclick="exitSelect()">取消</button>
    </div>
  </header>

  <div class="filters"><div class="filters-inner" id="filters"></div></div>

  <div class="pinbar" id="pinbar" onclick="openPinned()"></div>

  <div class="stream-wrap" id="stream-wrap">
    <div class="stream" id="stream"></div>
  </div>

  <div class="composer">
    <div class="tip" id="tip-scan">
      <span class="tip-text">📷 想抄书上的字？点一下输入框，选「扫描文本」</span>
      <button class="tip-x" onclick="dismissScanTip()" aria-label="不再提示">✕</button>
    </div>
    <div class="cbar" id="reply-bar">
      <span class="cbar-label">↩ 回复</span>
      <button class="cbar-main" id="reply-what" onclick="jumpToReplyTarget()"></button>
      <button class="cbar-x" onclick="exitReply()" aria-label="不回复了">✕</button>
    </div>
    <div class="cbar" id="backfill-bar">
      <span class="cbar-label">补记</span>
      <button class="cbar-main" id="bf-when" onclick="openBackfillWhen()"></button>
      <button class="cbar-x" onclick="exitBackfill()" aria-label="回到今天">✕</button>
    </div>
    <div class="attach-strip hidden" id="attach-strip"></div>
    <div class="composer-inner">
      <button class="plus-btn" id="plus-btn" onclick="plusClick()"
              onpointerdown="plusDown()" onpointerup="plusCancel()" onpointercancel="plusCancel()"

<script>
/* ═══════════════════ Constants & Utils ═══════════════════ */

const ENTRIES_KEY = 'aside-entries';
const TAGS_KEY    = 'aside-tags';

const DAY_LABELS = ['日', '一', '二', '三', '四', '五', '六'];

function pad(n) { return String(n).padStart(2, '0'); }
function dateKey(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function todayKey() { return dateKey(new Date()); }

/* ── 靠哪边 ────────────────────────────────────────────────────
   右边 = 「刚记的」：4 小时内自动靠右，过了就自己漂到左边。判定用的是记录自己的
   date+time，所以补记写到上周的条目一落笔就在左边。
   e.side 是横滑手动定的覆盖值，一旦有值就不再随时间变——你放哪边它就待在哪边：
     0 / undefined  自动（按 4 小时判定）
     1              强制靠右
    -1              强制靠左
   （老版本用过 side=2 表示「靠右但用白底」，白底那一态已经去掉；下面用 > 0 判断，
     旧数据会被当成靠右，再滑一次就归一到 ±1）  */
const RECENT_MS = 4 * 60 * 60 * 1000;
function entryTs(e) {
  const [y, m, d]  = e.date.split('-').map(Number);
  const [hh, mm]   = (e.time || '00:00').split(':').map(Number);
  return new Date(y, m - 1, d, hh || 0, mm || 0).getTime();
}
function isRecent(e) { return Date.now() - entryTs(e) < RECENT_MS; }
function onRight(e)  { return e.side ? e.side > 0 : isRecent(e); }
function nowTime(d) { return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function loadJSON(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch { return fallback; }
}
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function cnDate(key) {
  const [y, m, d] = key.split('-').map(Number);
  return `${m}月${d}日 周${DAY_LABELS[new Date(y, m - 1, d).getDay()]}`;
}
// 「8月13日 16:25」：菜单行右边挂当前值用，比 cnDate 少一个「周三」，一行塞得下
function cnDateTime(key, time) {
  const [, m, d] = key.split('-').map(Number);
  return `${m}月${d}日 ${time}`;
}
function cnFullDate(key) {
  const [y, m, d] = key.split('-').map(Number);
  return `${y}年${m}月${d}日`;
}

/* ═══════════════════ Seed tags ═══════════════════ */

const SEED_TAGS = [
  {
    id: 'diet', name: '饮食', emoji: '🍚',
    pattern: '',
    keywords: ['吃', '喝', '早饭', '早餐', '午饭', '午餐', '晚饭', '晚餐', '夜宵', '加餐', '零食', '外卖', '食堂', '下馆子',
      '米饭', '面条', '面包', '馒头', '粥', '饺子', '沙拉', '西兰花', '青菜', '蔬菜', '水果', '苹果', '香蕉',
      '鸡蛋', '鸡胸', '牛肉', '猪肉', '鱼', '虾', '豆腐', '牛奶', '酸奶', '咖啡', '奶茶', '可乐', '啤酒', '喝水',
      '蛋白粉', '维生素', '卡路里', '热量', '糖', '油腻', '重口', '清淡', '撑', '吃饱', '很饱', '饿', '嘴馋',
      '消化', '胃', '肚子', '反酸', '胀气', '拉肚子']
  },
  {
    id: 'sport', name: '运动', emoji: '🏃',
    pattern: '',
    keywords: ['跑步', '跑了', '慢跑', '快走', '走路', '步数', '健身', '举铁', '力量训练', '有氧', '无氧',
      '深蹲', '硬拉', '卧推', '引体', '俯卧撑', '平板支撑', '划船机', '椭圆机', '跑步机', '哑铃', '杠铃',
      '瑜伽', '普拉提', '拉伸', '游泳', '骑车', '骑行', '爬山', '徒步', '打球', '篮球', '羽毛球', '网球',
      '公里', '配速', '心率', '组数', '训练', '锻炼', '出汗', '酸痛', '肌肉', '腿酸', '腰酸', '累瘫', '热身']
  },
  {
    id: 'todo', name: '待办', emoji: '✅',
    pattern: '',
    keywords: ['要买', '记得', '别忘', '待办', 'todo', '预约', '挂号', '下单', '续费', '缴费', '还书', '提醒',
      '明天要', '得去', '需要去', '安排一下', '回头', '有空', '截止', 'deadline', '交表', '报名']
  },
  {
    id: 'idea', name: '念头', emoji: '💭',
    pattern: '',
    // 别放「如果 / 其实 / 为什么 / 反正」这类连接词——太常见，会把普通叙述和整页书都吸过来
    keywords: ['突然想到', '忽然想', '在想', '一直在想', '念头', '灵感', '好像明白', '意识到', '发现自己',
      '说不定', '感觉自己', '有点想', '要不要', '值不值得',
      '纠结', '犹豫', '困惑', '想不通', '想通了', '突然觉得', '一个想法']
  },
  {
    // 形态规则优先级高于所有关键词打分，所以摘抄排在后面也照样先命中引号句
    id: 'quote', name: '摘抄', emoji: '📖',
    pattern: '[“”「」『』《》]|^\\s*>|——\\s*\\S',
    keywords: ['书里', '读到', '看到一句', '这句话', '作者', '原文', '引用', '金句', '摘抄', '书中', '写道', '说过']
  },
  { id: 'other', name: '其他', emoji: '📝', pattern: '', keywords: [], fallback: true }
];

/* ═══════════════════ State ═══════════════════ */

let entries = loadJSON(ENTRIES_KEY, null);
let tags    = loadJSON(TAGS_KEY, null);
let activeFilter = 'all';

if (!tags || !tags.length) { tags = JSON.parse(JSON.stringify(SEED_TAGS)); }
if (!entries) { entries = []; }
if (!tags.some(t => t.fallback)) { tags[tags.length - 1].fallback = true; }

/* 一次性迁移：SEED_TAGS 只对全新安装生效，已写进 localStorage 的标签得单独补。
   v1 曾经漏掉写回，重排下次刷新就丢了；这里 v2 一并补齐并落盘。
   只动「有没有」和「顺序」，不碰任何标签的 name/emoji/keywords/pattern。 */
const MIG_KEY = 'aside-migration';
if (Number(localStorage.getItem(MIG_KEY) || 0) < 2) {
  if (!tags.some(t => t.id === 'idea')) tags.push(JSON.parse(JSON.stringify(SEED_TAGS.find(t => t.id === 'idea'))));
  const order = ['diet', 'sport', 'todo', 'idea', 'quote', 'other'];
  tags = tags
    .map((t, i) => ({ t, i, k: order.indexOf(t.id) }))
    .sort((a, b) => {
      if (a.k < 0 && b.k < 0) return a.i - b.i;   // 自定义标签之间保持原相对顺序
      if (a.k < 0) return -1;                     // 自定义标签排在种子标签之前
      if (b.k < 0) return 1;
      return a.k - b.k;
    })
    .map(x => x.t);
  localStorage.setItem(TAGS_KEY, JSON.stringify(tags));
  localStorage.setItem(MIG_KEY, '2');
}

/* v3：v2 发出去的「念头」词表里混了「如果 / 其实 / 为什么 / 也许 / 或许 / 反正 / 算了 /
   大概是因为 / 想到」这些连接词，太常见会乱吃。只在用户没动过词表时才换掉。 */
if (Number(localStorage.getItem(MIG_KEY) || 0) < 3) {
  const shipped = ['突然想到', '忽然想', '想到', '在想', '一直在想', '念头', '灵感', '好像明白', '意识到', '发现自己',
    '为什么', '也许', '或许', '大概是因为', '其实', '说不定', '感觉自己', '有点想', '要不要', '值不值得',
    '纠结', '犹豫', '困惑', '想不通', '想通了', '反正', '算了', '突然觉得', '一个想法', '如果'];
  const idea = tags.find(t => t.id === 'idea');
  if (idea && idea.keywords.length === shipped.length && idea.keywords.every((w, i) => w === shipped[i])) {
    idea.keywords = SEED_TAGS.find(t => t.id === 'idea').keywords.slice();
    localStorage.setItem(TAGS_KEY, JSON.stringify(tags));
  }
  localStorage.setItem(MIG_KEY, '3');
}

// 全项目只有这两个写入口，云同步就挂在这儿——任何地方改了数据都会自动排上传队列
function saveEntries() { localStorage.setItem(ENTRIES_KEY, JSON.stringify(entries)); scheduleSync(); }
function saveTags()    { localStorage.setItem(TAGS_KEY, JSON.stringify(tags)); scheduleSync(); }

function tagById(id) { return tags.find(t => t.id === id) || fallbackTag(); }
function fallbackTag() { return tags.find(t => t.fallback) || tags[tags.length - 1]; }
function entryById(id) { return entries.find(e => e.id === id); }

/* ═══════════════════ 图片：IndexedDB（localStorage 只有 5MB，存不下几张） ═══════════════════ */

const MAX_IMGS = 4;        // 一条记录最多几张
const IMG_MAX_SIDE = 1280; // 长边上限
const IMG_QUALITY = 0.72;

let dbPromise = null;
let asidePromise = null;

function openAsideDB() {
  if (!asidePromise) {
    asidePromise = new Promise((res, rej) => {
      const r = indexedDB.open('aside', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('images', { keyPath: 'id' });
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }
  return asidePromise;
}

/* 改名迁移：图片库从 daylog 挪到 aside。open 不带版本号，老库不存在时浏览器会顺手
   建一个空的，所以检不到 images 表就直接删掉、不留垃圾。整段失败也只是这次不迁移，
   下次打开重来一遍——绝不让它挡住正常读写。 */
const IDB_MIG_KEY = 'aside-idb-migrated';
function migrateImages() {
  if (localStorage.getItem(IDB_MIG_KEY)) return Promise.resolve();
  return new Promise(res => {
    const r = indexedDB.open('daylog');
    r.onerror = () => res(null);
    r.onsuccess = () => {
      const old = r.result;
      if (!old.objectStoreNames.contains('images')) { old.close(); res(null); return; }
      const tx = old.transaction('images', 'readonly');
      const all = tx.objectStore('images').getAll();
      tx.oncomplete = () => { old.close(); res(all.result || []); };
      tx.onerror    = () => { old.close(); res(null); };
    };
  }).then(recs => {
    if (!recs || !recs.length) return;
    return openAsideDB().then(d => new Promise((res, rej) => {
      const tx = d.transaction('images', 'readwrite');
      const s = tx.objectStore('images');
      recs.forEach(rec => s.put(rec));
      tx.oncomplete = () => res();
      tx.onerror    = () => rej(tx.error);
    }));
  }).then(() => new Promise(res => {
    const del = indexedDB.deleteDatabase('daylog');
    del.onsuccess = del.onerror = del.onblocked = () => res();
  })).then(() => {
    localStorage.setItem(IDB_MIG_KEY, '1');
  }).catch(() => {});
}

function db() {
  if (!dbPromise) dbPromise = migrateImages().then(openAsideDB);
  return dbPromise;
}
function idbRun(mode, fn) {
  return db().then(d => new Promise((res, rej) => {
    const tx = d.transaction('images', mode);
    const req = fn(tx.objectStore('images'));
    tx.onerror = () => rej(tx.error);
    tx.oncomplete = () => res(req && req.result);
  }));
}
const putImage = rec  => idbRun('readwrite', s => s.put(rec));
const delImage = id   => idbRun('readwrite', s => s.delete(id));
const readImage = id  => idbRun('readonly',  s => s.get(id));
const allImages = ()  => idbRun('readonly',  s => s.getAll());

// 渲染用的小缓存，避免每次重渲染都读一遍 IDB
const imgCache = new Map();
const IMG_CACHE_MAX = 60;
function cacheImg(id, url) {
  imgCache.set(id, url);
  if (imgCache.size > IMG_CACHE_MAX) imgCache.delete(imgCache.keys().next().value);
}
async function imgURL(id) {
  if (imgCache.has(id)) return imgCache.get(id);
  const rec = await readImage(id);
  if (!rec) return null;
  cacheImg(id, rec.data);
  return rec.data;
}

// 压到长边 1280 的 JPEG，原图动辄 3~5MB，存下来会撑爆配额
async function shrinkToDataURL(blob) {
  let bmp;
  try { bmp = await createImageBitmap(blob, { imageOrientation: 'from-image' }); }
  catch { bmp = await createImageBitmap(blob); }
  const scale = Math.min(1, IMG_MAX_SIDE / Math.max(bmp.width, bmp.height));
  const w = Math.max(1, Math.round(bmp.width * scale));
  const h = Math.max(1, Math.round(bmp.height * scale));
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  c.getContext('2d').drawImage(bmp, 0, 0, w, h);
  bmp.close && bmp.close();
  return c.toDataURL('image/jpeg', IMG_QUALITY);
}

/* ═══════════════════ Auto tagging ═══════════════════ */

function suggestTag(text) {
  // 第一优先：形态规则（摘抄用引号/引用符/出处标记触发）
  for (const tag of tags) {
    if (!tag.pattern) continue;
    try { if (new RegExp(tag.pattern, 'm').test(text)) return tag; }
    catch { /* 规则写错就跳过，不影响记录 */ }
  }
  // 第二优先：关键词打分，长词权重更高（「深蹲」> 「动」）
  const t = text.toLowerCase();
  let best = null, bestScore = 0;
  for (const tag of tags) {
    let score = 0;
    for (const kw of tag.keywords) {
      if (kw && t.includes(String(kw).toLowerCase())) score += kw.length;
    }
    if (score > bestScore) { bestScore = score; best = tag; }
  }
  return best || fallbackTag();
}

// 从文本里抽 2~3 字的中文候选词：没有分词库，就用 n-gram + 虚词过滤，宁可少给也不刷屏
const STOP_CHARS = new Set('的是了在有我你他她它这那都很就也还又和与把被给对从到过来去做让说着得地以及或但而没能会要不太么呢吧啊今天'.split(''));
function candidateWords(text) {
  const known = new Set();
  tags.forEach(t => t.keywords.forEach(k => known.add(String(k).toLowerCase())));
  const runs = text.match(/[一-龥]{2,}/g) || [];
  const out = [];
  const seen = new Set();
  for (const len of [3, 2]) {
    for (const run of runs) {
      for (let i = 0; i + len <= run.length; i++) {
        const w = run.slice(i, i + len);
        if (seen.has(w) || known.has(w)) continue;
        if ([...w].some(c => STOP_CHARS.has(c))) continue;
        seen.add(w);
        out.push(w);
      }
    }
  }
  return out.slice(0, 20);
}

/* ═══════════════════ Render ═══════════════════ */

function visibleEntries() {
  const list = activeFilter === 'all' ? entries : entries.filter(e => e.tagId === activeFilter);
  return list.slice().sort((a, b) => a.ts - b.ts);
}

// 摘要：置顶条、thread 列表、操作表标题都用它。隐藏的记录一律不吐正文，
// 否则遮了气泡、却在别处把话原样漏出去
function preview(e, n = 40) {
  if (!e) return '';
  if (e.msk) return '（已隐藏）';
  const txt = (e.text || '').replace(/\n/g, ' ').trim();
  if (!txt) return `${(e.imgs || []).length} 张图片`;
  return txt.length > n ? txt.slice(0, n) + '…' : txt;
}

// id → 直接回复它的条数。渲染前算一次，别在循环里反复扫全表
function replyCounts() {
  const c = {};
  entries.forEach(e => { if (e.re) c[e.re] = (c[e.re] || 0) + 1; });
  return c;
}

function renderHeader() {
  const n = entries.length;
  const suffix = activeFilter === 'all' ? `共 ${n} 条` : `${tagById(activeFilter).name} ${visibleEntries().length} 条 / 共 ${n} 条`;
  document.getElementById('subtitle').textContent = `${cnFullDate(todayKey())} · ${suffix}`;
}

function renderFilters() {
  const counts = {};
  entries.forEach(e => { counts[e.tagId] = (counts[e.tagId] || 0) + 1; });
  let html = `<button class="fchip ${activeFilter === 'all' ? 'active' : ''}" onclick="setFilter('all')">全部 ${entries.length}</button>`;
  tags.forEach(t => {
    html += `<button class="fchip ${activeFilter === t.id ? 'active' : ''}" onclick="setFilter('${t.id}')">${esc(t.emoji)} ${esc(t.name)} ${counts[t.id] || 0}</button>`;
  });
  document.getElementById('filters').innerHTML = html;
}

function setFilter(id) {
  activeFilter = id;
  // 切筛选时清空勾选，免得删掉屏幕上看不见的记录
  if (selectMode) { selected.clear(); renderSelBar(); }
  renderFilters();
  renderHeader();
  renderStream();
  scrollToBottom(false);
}

function renderStream() {
  const list = visibleEntries();
  const el = document.getElementById('stream');
  if (!list.length) {
    el.innerHTML = entries.length
      ? `<div class="empty">这个标签下还没有记录</div>`
      : `<div class="empty">记点什么吧<br>吃了什么、动了多久、身体什么感觉</div>`;
    return;
  }
  const today = todayKey();
  const rc = replyCounts();
  let html = '';
  let lastDate = null;
  list.forEach(e => {
    if (e.date !== lastDate) {
      lastDate = e.date;
      html += `<div class="daysep" data-date="${e.date}">${e.date === today ? '今天' : esc(cnDate(e.date))}</div>`;
    }
    const t = tagById(e.tagId);
    const imgs = e.imgs || [];
    const on = selected.has(e.id);
    const stacked = imgs.length >= 2 && !expandedImgs.has(e.id);   // 多张默认叠起来
    const stop = `onpointerdown="event.stopPropagation()" onpointerup="event.stopPropagation()"`;
    let imgHtml = '';
    if (stacked) {
      imgHtml = `<div class="imgstack" ${stop} onclick="event.stopPropagation(); toggleImgs('${e.id}')">
                   <img data-img="${imgs[0]}" alt="">
                 </div>`;
    } else if (imgs.length) {
      imgHtml = `<div class="imgs n${imgs.length}" ${stop}>
                   ${imgs.map(id => `<img data-img="${id}" alt="" onclick="event.stopPropagation(); openLightbox('${e.id}','${id}')">`).join('')}
                 </div>`;
    }
    const pill = imgs.length >= 2
      ? `<button class="expand-pill" onclick="event.stopPropagation(); toggleImgs('${e.id}')">${stacked ? `展开 ${imgs.length}` : '收起'}</button>`
      : '';

    const inner = `${imgHtml}${e.text ? `<div class="btext">${esc(e.text)}</div>` : ''}`;
    // 待办：正文让位给一个能勾的圆，勾选自己吃掉点击，不然会连带触发气泡的手势
    const core = e.td
      ? `<div class="tdrow">
           <button class="td-box" ${stop} onclick="event.stopPropagation(); toggleDone('${e.id}')"
                   aria-label="${e.td === 2 ? '取消完成' : '标记完成'}">
             <svg class="tick" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12.5 9.5 18 20 6.5"></polyline></svg>
           </button>
           <div class="tdwrap">${inner}</div>
         </div>`
      : inner;
    // 挡板盖在最上层，挡住底下图片的点击；气泡本身的长按/双击照常穿透上来
    const veil = e.msk ? `<div class="msk-veil"></div>` : '';

    // 引用嵌在气泡顶部。stop 是必须的：不拦住 pointer 事件，点引用会同时触发气泡的双击判定
    let requote = '';
    if (e.re) {
      const p = entryById(e.re);
      requote = p
        ? `<div class="requote" ${stop} onclick="event.stopPropagation(); jumpToEntry('${p.id}')">
             <div class="requote-when">${esc(cnDate(p.date).replace(/ 周./, ''))} · ${esc(p.time)}</div>
             <div class="requote-text">${esc(preview(p, 26))}</div>
           </div>`
        : `<div class="requote gone">原记录已删除</div>`;
    }
    const body = requote + core;
    /* 待办和摘抄的气泡自己已经把「这是什么」画出来了（能勾的圆 / 引文排版），
       下面再挂一枚同名标签是同一句话说两遍。标签本身照旧存着，筛选和导出不受影响。
       比的是标签有没有跟形态重名，而不是「是不是待办气泡」——万一哪条待办的标签
       被手动改成了饮食，那枚标签就还是真信息，得留着。 */
    const dupTag = (e.td && t.id === FORM_TAG.td) || (e.qt && t.id === FORM_TAG.qt);

    const nre = rc[e.id] || 0;
    const thread = (nre || e.re)
      ? `<span>·</span><span class="threadchip" onclick="event.stopPropagation(); openThread('${e.id}')">💬${nre ? ' ' + nre : ''}</span>`
      : '';

    html += `
      <div class="srow ${on ? 'checked' : ''}" data-id="${e.id}" onclick="rowClick(event, '${e.id}')">
        <button class="selcirc ${on ? 'checked' : ''}" tabindex="-1" aria-label="选择">
          <svg class="off" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9.5"></circle></svg>
          <svg class="on" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"></circle><polyline points="7.6 12.3 10.7 15.3 16.4 9.2" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></polyline></svg>
        </button>
        <div class="brow ${onRight(e) ? 'me' : ''}">
          <div class="bline">
            ${pill}
            <div class="bubble ${e.hl ? 'hl' : ''} ${e.qt ? 'qt' : ''} ${e.td ? 'td' : ''} ${e.td === 2 ? 'done' : ''} ${e.msk ? 'msk' : ''}"
                 onpointerdown="bubbleDown('${e.id}')" onpointerup="bubbleUp('${e.id}')" onpointercancel="bubbleCancel()">
              ${body}
              ${veil}
            </div>
          </div>
          <div class="bmeta">
            ${dupTag ? '' : `<span class="tagchip" onclick="event.stopPropagation(); openTagPicker('${e.id}')">${esc(t.emoji)} ${esc(t.name)}</span>
            <span>·</span>`}
            <span class="btime">${esc(e.time)}</span>
            ${thread}
          </div>
        </div>
      </div>`;
  });
  el.innerHTML = html;
  hydrateImages();
}

// 「展开 N / 收起」——只是视图状态，不写进 localStorage，刷新后重新叠起来
const expandedImgs = new Set();
function toggleImgs(id) {
  if (selectMode) return;
  const opening = !expandedImgs.has(id);
  if (opening) expandedImgs.add(id); else expandedImgs.delete(id);
  renderStream();
  // 展开后变高，别把这条顶出屏幕
  if (opening) {
    const row = document.querySelector(`.srow[data-id="${id}"]`);
    if (row) row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
}

// innerHTML 里的 <img> 先不带 src，渲染完再异步从 IDB 灌进去
function hydrateImages() {
  document.querySelectorAll('#stream img[data-img]').forEach(async el => {
    const url = await imgURL(el.dataset.img);
    if (url) { el.src = url; return; }
    // 图片不参与云同步，所以别的设备拉过来的记录会带着本机没有的图片 id。
    // 只 remove 掉 <img> 的话，叠图卡的伪元素会剩个空壳、「展开 N」药丸也还杵着，得一起收掉
    const holder = el.closest('.imgstack, .imgs');
    el.remove();
    if (!holder || holder.querySelector('img')) return;
    const bubble = holder.closest('.bubble');
    holder.remove();
    const pill = bubble && bubble.parentElement.querySelector('.expand-pill');
    if (pill) pill.remove();
    if (bubble && !bubble.querySelector('.btext')) {
      bubble.innerHTML = '<div class="imgmiss">[图片未同步]</div>';   // 纯图片的记录，别留个空气泡
    }
  });
}

/* 灯箱：整条记录的图都在里面，可以左右滑 */
let lbEntry = null, lbList = [], lbIndex = 0;

function openLightbox(entryId, imgId) {
  if (selectMode) return;
  const e = entryById(entryId);
  if (!e) return;
  lbEntry = entryId;
  lbList = (e.imgs || []).slice();
  lbIndex = Math.max(0, lbList.indexOf(imgId));
  showLightboxImage();
}

function showLightboxImage() {
  const id = lbList[lbIndex];
  if (!id) { closeLightbox(); return; }
  imgURL(id).then(url => {
    if (!url) return;
    document.getElementById('lightbox-img').src = url;
    document.getElementById('lb-count').textContent = lbList.length > 1 ? `${lbIndex + 1} / ${lbList.length}` : '';
    document.getElementById('lightbox').classList.add('open');
  });
}

function lbGo(delta) {
  if (lbList.length < 2) return;
  lbIndex = (lbIndex + delta + lbList.length) % lbList.length;   // 到头绕回去
  showLightboxImage();
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
  lbEntry = null; lbList = []; lbIndex = 0;
}

function deleteCurrentImage() {
  const imgId = lbList[lbIndex];
  if (!imgId) return;
  const emptied = removeImageFromEntry(lbEntry, imgId);
  lbList.splice(lbIndex, 1);
  // 还有剩的就停在灯箱里看下一张，别把人踢出去
  if (emptied || !lbList.length) { closeLightbox(); return; }
  if (lbIndex >= lbList.length) lbIndex = lbList.length - 1;
  showLightboxImage();
}

/* 左右滑动翻页：滑动了就不当成「点空白关闭」 */
(() => {
  const lb = document.getElementById('lightbox');
  let startX = null, swiped = false;
  lb.addEventListener('pointerdown', e => { startX = e.clientX; swiped = false; });
  lb.addEventListener('pointerup', e => {
    if (startX === null) return;
    const dx = e.clientX - startX;
    startX = null;
    if (Math.abs(dx) > 45) { swiped = true; lbGo(dx < 0 ? 1 : -1); }
  });
  lb.addEventListener('pointercancel', () => { startX = null; });
  lb.addEventListener('click', e => {
    if (swiped) { swiped = false; return; }
    if (e.target.closest('.lightbox-bar')) return;
    closeLightbox();
  });
  document.addEventListener('keydown', e => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'ArrowLeft') lbGo(-1);
    else if (e.key === 'ArrowRight') lbGo(1);
    else if (e.key === 'Escape') closeLightbox();
  });
})();

// 返回 true 表示这条记录被整条收掉了（图删光且没有文字）
function removeImageFromEntry(entryId, imgId) {
  const e = entryById(entryId);
  if (!e) return false;
  e.imgs = (e.imgs || []).filter(x => x !== imgId);
  imgCache.delete(imgId);
  delImage(imgId).catch(() => {});
  const emptied = !e.text && !e.imgs.length;
  if (emptied) purgeEntries([entryId]); else saveEntries();
  renderAll();
  showToast(emptied ? '图片和这条记录都删了' : '已删除这张图');
  return emptied;
}

/* 「贴着底」是个状态，不是一次动作。
   光在启动时 scrollToBottom() 一次是不够的：图片是渲染完再从 IDB 异步灌进去的
   （见 hydrateImages），灌完内容变高，刚才那一下就不在底上了，开屏会停在倒数几条。
   所以记一个 stickBottom：只要用户没有主动往上翻，内容一变高就重新贴回底部。
   顺带把「在底部时云同步拉来新记录」也一并接住了。 */
let stickBottom = true;
const BOTTOM_SLACK = 80;   // 离底 80px 以内都算「还在底上」，容得下惯性滚动的零头

function atBottom(w) {
  return w.scrollHeight - w.scrollTop - w.clientHeight <= BOTTOM_SLACK;
}

function scrollToBottom(smooth) {
  const w = document.getElementById('stream-wrap');
  stickBottom = true;
  w.scrollTo({ top: w.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
}

(() => {
  const w = document.getElementById('stream-wrap');
  // 用户往上翻就撒手，翻回底部再接上
  w.addEventListener('scroll', () => { stickBottom = atBottom(w); }, { passive: true });
  if (window.ResizeObserver) {
    new ResizeObserver(() => {
      if (stickBottom) w.scrollTop = w.scrollHeight;   // 这里别用 scrollTo/smooth，会跟观察回调打架
    }).observe(document.getElementById('stream'));
  }
})();

function renderAll() {
  renderHeader(); renderFilters(); renderPinBar(); renderStream(); renderComposerBars();
  if (selectMode) {
    selected.forEach(id => { if (!entryById(id)) selected.delete(id); });   // 删掉的别留在选区里
    if (!entries.length) exitSelect(); else renderSelBar();
  }
}

/* ═══════════════════ Compose ═══════════════════ */

let pendingImgs = [];   // 待发送的图片 dataURL

/* 一次插进来一大段，只可能是扫描或粘贴，打字打不出这个量——用它给「摘抄」投一票。
   门槛看有没有别的线索：走过加号→「扫描文本」的（scanArmed），摆明了是在抄书，
   短短一行也算数；没有这个前提就只能靠量取胜，40 字以下不敢乱猜。 */
const BULK_MIN = 40;
const SCAN_MIN = 12;
let lastInputLen = 0;
let bulkInserted = false;
let scanArmed = false;      // 从加号菜单点过「扫描文本」，这一条还没落地
function bulkMin() { return scanArmed ? SCAN_MIN : BULK_MIN; }

function onInput() {
  const ta = document.getElementById('input');
  const added = ta.value.length - lastInputLen;
  lastInputLen = ta.value.length;
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
  document.getElementById('send-btn').disabled = !ta.value.trim() && !pendingImgs.length;
  document.getElementById('plus-btn').disabled = pendingImgs.length >= MAX_IMGS;
  if (added >= bulkMin()) bulkInserted = true;
  if (tipTimer) hideTip();   // 扫描的现场教学：字已经进来了就别占着地方（开屏那条没有 timer，不受影响）
}

function renderAttachStrip() {
  const strip = document.getElementById('attach-strip');
  strip.classList.toggle('hidden', !pendingImgs.length);
  strip.innerHTML = pendingImgs.map((url, i) => `
    <div class="attach-thumb">
      <img src="${url}" alt="">
      <button class="attach-x" onclick="removePending(${i})" aria-label="移除">✕</button>
    </div>`).join('');
  onInput();
}
function removePending(i) { pendingImgs.splice(i, 1); renderAttachStrip(); }

/* 加号：轻点 = 打开一张小菜单（照片 / 扫描文本 / 从剪贴板）；长按 = 直接读剪贴板，抄近路。

   这张菜单以前撤掉过，理由是「照片」点下去 iOS 还要再弹一层系统的
   「照片图库 / 拍照 / 选取文件」——那层是 WebKit 固定行为，网页绕不过去，
   于是变成白点两次。现在菜单回来了，是因为「扫描文本」没有别的地方可以挂：
   藏在长按里没人找得到。多点一次换一个能看见的入口，这是权衡不是回退。 */
let plusTimer = null, plusFired = false;
function plusDown() {
  plusFired = false;
  clearTimeout(plusTimer);
  if (document.getElementById('plus-btn').disabled) return;
  plusTimer = setTimeout(() => { plusFired = true; pasteImage(); }, 550);
}
function plusCancel() { clearTimeout(plusTimer); }
function plusClick() {
  if (plusFired) { plusFired = false; return; }   // 刚才长按已经处理过了
  if (pendingImgs.length >= MAX_IMGS) { showToast(`最多 ${MAX_IMGS} 张`); return; }
  openAction(`
    <div class="action-group">
      <button class="action-btn" onclick="actPickPhoto()">${ico('photo')}照片 / 拍照</button>
      ${canScan ? `<button class="action-btn" onclick="actScanText()">${ico('scan')}扫描文本</button>` : ''}
      <button class="action-btn" onclick="actPasteImage()">${ico('paste')}从剪贴板</button>
    </div>
    <div class="action-group">
      <button class="action-btn strong" onclick="forceCloseAction()">取消</button>
    </div>`);
}
/* 三个入口都得留在同一次用户手势里：forceCloseAction 只是切个 class，是同步的，
   所以后面的 input.click() / focus() 仍然算「用户点出来的」，iOS 才肯放行。 */
function actPickPhoto()  { forceCloseAction(); pickFiles(); }
function actPasteImage() { forceCloseAction(); pasteImage(); }
function actScanText()   { forceCloseAction(); startScanText(); }

function pickFiles() {
  document.getElementById('pick-file').click();
}

async function onPickFiles(ev) {
  const files = [...ev.target.files].filter(f => f.type.startsWith('image/'));
  ev.target.value = '';
  await attachBlobs(files);
}

async function pasteImage() {
  if (!navigator.clipboard || !navigator.clipboard.read) { showToast('这个浏览器读不了剪贴板'); return; }
  try {
    const items = await navigator.clipboard.read();
    const blobs = [];
    for (const it of items) {
      const type = it.types.find(t => t.startsWith('image/'));
      if (type) blobs.push(await it.getType(type));
    }
    if (!blobs.length) { showToast('剪贴板里没有图片'); return; }
    await attachBlobs(blobs);
  } catch (err) {
    showToast(err && err.name === 'NotAllowedError' ? '没有剪贴板权限' : '读剪贴板失败');
  }
}

async function attachBlobs(blobs) {
  const room = MAX_IMGS - pendingImgs.length;
  if (room <= 0) { showToast(`最多 ${MAX_IMGS} 张`); return; }
  const take = blobs.slice(0, room);
  for (const b of take) {
    try { pendingImgs.push(await shrinkToDataURL(b)); }
    catch { showToast('这张图读不了'); }
  }
  renderAttachStrip();
  if (blobs.length > room) showToast(`最多 ${MAX_IMGS} 张，多的没加`);
}

// 桌面端直接往输入框里粘贴图片
document.getElementById('input').addEventListener('paste', e => {
  const files = [...(e.clipboardData ? e.clipboardData.files : [])].filter(f => f.type.startsWith('image/'));
  if (!files.length) return;
  e.preventDefault();
  attachBlobs(files);
});

async function addEntry() {
  const ta = document.getElementById('input');
  const text = ta.value.trim();
  if (!text && !pendingImgs.length) return;
  const when = composeWhen();            // 补记时这里给的是过去的那个时间点
  let tag = suggestTag(text);            // 纯图片没有文字信号，自然落到兜底的「其他」
  // 扫/粘进来的整段文字，本来要掉进「其他」的才改判摘抄；有饮食运动信号的不抢
  const scanned = bulkInserted && text.length >= bulkMin();
  if (scanned && tag.fallback) tag = tagById('quote') || tag;

  const imgIds = [];
  for (const data of pendingImgs) {
    const id = genId();
    try { await putImage({ id, data, ts: when.ts }); imgIds.push(id); }
    catch { showToast('图片存不下了（空间不足）'); }
  }

  const id = genId();
  const entry = { id, ts: when.ts, date: when.date, time: when.time, text, tagId: tag.id, auto: true, imgs: imgIds };
  // 判成摘抄的，连排版一起给（引号气泡 + 导出成 blockquote），不用再长按挑一次。
  // 只在标签真的落到「摘抄」时才给，免得抄来一段被识别成饮食的话还排成引文。
  if (scanned && tag.id === FORM_TAG.qt) entry.qt = 1;
  if (replyTo && entryById(replyTo)) entry.re = replyTo;
  entries.push(entry);
  saveEntries();
  ta.value = '';
  pendingImgs = [];
  bulkInserted = false;
  scanArmed = false;
  const wasBackfill = !!backfill;
  replyTo = null;      // 回复是一次性的，发完就断开，不然后面每条都挂到同一串上
  renderAttachStrip();
  if (activeFilter !== 'all' && activeFilter !== tag.id) activeFilter = 'all';
  renderAll();
  // 补记落在过去，滚到底根本看不见它——直接跳过去闪一下，让人确认写对了地方
  if (wasBackfill) { jumpToEntry(id); showToast(`已补记到 ${cnDate(when.date)}`); }
  else scrollToBottom(true);
}

document.getElementById('input').addEventListener('keydown', e => {
  // 桌面端回车即记录（Shift+Enter 换行）；手机端一律用发送按钮
  if (e.key === 'Enter' && !e.shiftKey && window.matchMedia('(pointer: fine)').matches) {
    e.preventDefault();
    addEntry();
  }
});

/* ═══════════════════ Toast ═══════════════════ */

let toastTimer = null;
function showToast(msg, actionLabel, onAction) {
  const el = document.getElementById('toast');
  el.innerHTML = `<span>${esc(msg)}</span>`;
  if (actionLabel) {
    const btn = document.createElement('button');
    btn.className = 'toast-action';
    btn.textContent = actionLabel;
    btn.onclick = () => { hideToast(); onAction(); };
    el.appendChild(btn);
  }
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, actionLabel ? 4000 : 1600);
}
function hideToast() { document.getElementById('toast').classList.remove('show'); }

/* ═══════════════════ Action sheet ═══════════════════ */

/* 长按菜单的图标：照 mynd 那套 SF Symbols 风格描线（1.7 描边、圆头圆角）。
   高光 / 摘抄 / 置顶共用「气泡里放个记号」的同一族，视觉上自己归成一类 */
const ICO_BUBBLE = 'M5 4.6h14A2.4 2.4 0 0 1 21.4 7v7.4a2.4 2.4 0 0 1-2.4 2.4h-8.1L6.6 20.2v-3.4H5a2.4 2.4 0 0 1-2.4-2.4V7A2.4 2.4 0 0 1 5 4.6z';
const ICONS = {
  reply:  '<path d="M9.5 14.5 5 10l4.5-4.5"/><path d="M5 10h8a6 6 0 0 1 6 6v2.5"/>',
  thread: '<path d="M4 4.5h9a2 2 0 0 1 2 2V10a2 2 0 0 1-2 2H8.5L5.5 14.4V12H4a2 2 0 0 1-2-2V6.5a2 2 0 0 1 2-2z"/>'
        + '<path d="M17.5 8.5H19a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-1v2.4L15 16.5h-4.5"/>',

function openAction(html) {
