<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="跡">
<meta name="theme-color" content="#4853a7">
<title>跡</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --accent: #4853a7;
  --accent2: #5c68c4;
  --accent-light: #7b83d1;
  --accent-bg: rgba(72,83,167,0.06);
  --green: #3ea87a;
  --red: #d4564e;
  --label: #2e3142;
  --label2: #7b8095;
  --label3: #aeb3cc;
  --fill: #eef0f8;
  --fill2: #e4e7f2;
  --bg: #fafbff;
  --bg2: #ffffff;
  --sep: #e8eaf4;
  --radius: 14px;
  --heatmap-0: #eef0f8;
  --heatmap-1: #c8cde8;
  --heatmap-2: #8b93cc;
  --heatmap-3: #5c68c4;
  --heatmap-4: #3a44a0;
}

html { background: var(--bg); }

body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  background: var(--bg);
  color: var(--label);
  /* fixed 脱离文档流，键盘弹起无法影响布局 */
  position: fixed;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 430px;
  height: var(--app-h, 100dvh);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  font-weight: 400;
}

.header {
  position: relative;
  z-index: 10;
  background: rgba(250,251,255,0.88);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  backdrop-filter: saturate(180%) blur(20px);
  padding: calc(env(safe-area-inset-top) + 14px) 20px 14px;
  border-bottom: 1px solid var(--sep);
}

.header h1 {
  font-size: 18px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: -0.3px;
}

.header-sub {
  font-size: 12px;
  color: var(--label3);
  margin-top: 2px;
  font-weight: 400;
}

/* Views */
.view {
  display: none;
  padding: 20px 16px calc(env(safe-area-inset-bottom) + 20px);
  height: calc(100% - var(--header-h, 60px) - var(--tabbar-h, 70px));
  overflow-x: hidden;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.view.active { display: block; }

/* Home layout: heatmap fixed, timeline scrolls */
#view-home {
  display: none;
  flex-direction: column;
  padding: 0;
  overflow: hidden;
}
#view-home.active { display: flex; }

#view-home .home-timeline {
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.home-top {
  flex-shrink: 0;
  padding: 16px 16px 12px;
}

.home-timeline {
  flex: 0 1 auto;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 0 16px calc(env(safe-area-inset-bottom) + 4px);
  min-height: 0;
}

/* Tab bar */
.tab-bar {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 430px;
  background: rgba(255,255,255,0.94);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  backdrop-filter: saturate(180%) blur(20px);
  border-top: 1px solid var(--sep);
  display: flex;
  padding: 6px 0 calc(env(safe-area-inset-bottom) + 6px);
  z-index: 20;
}

.tab-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  background: none;
  border: none;
  font-size: 10px;
  font-weight: 500;
  color: var(--label3);
  cursor: pointer;
  padding: 4px 0;
  transition: color 0.15s;
  -webkit-user-select: none;
  user-select: none;
  font-family: inherit;
}

.tab-btn .tab-icon {
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.tab-btn .tab-icon svg {
  width: 21px;
  height: 21px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.tab-btn.active { color: var(--accent); }
.tab-btn.active .tab-icon svg { stroke-width: 1.8; }

/* Cards */
.card {
  background: var(--bg2);
  border-radius: var(--radius);
  border: 1px solid var(--sep);
  box-shadow: 0 2px 8px rgba(72,83,167,0.04);
  overflow: hidden;
  margin-bottom: 12px;
}

.card-inner { padding: 16px; }

/* Quick start FAB on home */
.quick-start {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: var(--radius);
  padding: 14px 20px;
  font-size: 15px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  width: 100%;
  margin-bottom: 16px;
  transition: opacity 0.12s, transform 0.08s;
  box-shadow: 0 4px 14px rgba(72,83,167,0.2);
  -webkit-user-select: none;
  user-select: none;
}

.quick-start:active { opacity: 0.8; transform: scale(0.98); }

.quick-start svg {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
}

.quick-start-text { flex: 1; text-align: left; }

.quick-start-hint {
  font-size: 12px;
  font-weight: 400;
  opacity: 0.7;
}

/* Heatmap */
.heatmap-wrap {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 4px;
}

.heatmap-months {
  display: flex;
  font-size: 11px;
  color: var(--label3);
  margin-bottom: 4px;
  padding-left: 28px;
  font-weight: 500;
}

.heatmap-months span { flex-shrink: 0; }

.heatmap-body { display: flex; }

.heatmap-labels {
  display: flex;
  flex-direction: column;
  gap: 3px;
  font-size: 10px;
  color: var(--label3);
  padding-right: 6px;
  flex-shrink: 0;
  font-weight: 500;
}

.heatmap-labels span {
  height: 12px;
  line-height: 12px;
}

.heatmap-grid {
  display: grid;
  grid-template-rows: repeat(7, 12px);
  grid-auto-flow: column;
  grid-auto-columns: 12px;
  gap: 3px;
}

.heatmap-cell {
  width: 12px;
  height: 12px;
  border-radius: 3px;
  background: var(--heatmap-0);
  cursor: pointer;
  transition: opacity 0.12s, transform 0.12s;
}

.heatmap-cell:hover { opacity: 0.8; transform: scale(1.2); }
.heatmap-cell.level-1 { background: var(--heatmap-1); }
.heatmap-cell.level-2 { background: var(--heatmap-2); }
.heatmap-cell.level-3 { background: var(--heatmap-3); }
.heatmap-cell.level-4 { background: var(--heatmap-4); }
.heatmap-cell.future { background: transparent; }

/* Heatmap tooltip */
.heatmap-tooltip {
  display: none;
  background: var(--fill);
  border-radius: 10px;
  padding: 10px 14px;
  margin-top: 10px;
  font-size: 13px;
  color: var(--label2);
}

.heatmap-tooltip.show { display: block; }

.heatmap-tooltip .tt-date {
  font-weight: 600;
  color: var(--label);
  margin-bottom: 4px;
}

.heatmap-tooltip .tt-item {
  display: flex;
  justify-content: space-between;
  padding: 3px 0;
}

/* Timeline */
.timeline-section { margin-top: 4px; }

.timeline-entry {
  display: flex;
  gap: 14px;
  padding: 14px 0;
}

.timeline-entry:not(:last-child) {
  border-bottom: 1px solid var(--sep);
}

.timeline-date {
  flex-shrink: 0;
  width: 44px;
  text-align: center;
}

.timeline-date .day {
  font-size: 26px;
  font-weight: 700;
  color: var(--accent);
  line-height: 1;
}

.timeline-date .month {
  font-size: 12px;
  color: var(--label3);
  margin-top: 3px;
  font-weight: 500;
}

.timeline-items {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.timeline-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--fill);
  border-radius: 10px;
  padding: 10px 14px;
  cursor: pointer;
  transition: background 0.12s;
}

.timeline-item:active { background: var(--fill2); }

.timeline-item .topic {
  font-size: 14px;
  font-weight: 500;
  color: var(--label);
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.timeline-item .dur {
  font-size: 13px;
  color: var(--label2);
  flex-shrink: 0;
  margin-left: 10px;
  font-weight: 500;
}

.timeline-total {
  font-size: 12px;
  color: var(--label3);
  text-align: right;
  margin-top: 4px;
  font-weight: 500;
}

.timeline-gap {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 0;
  color: var(--label3);
  font-size: 11px;
  font-weight: 500;
}

.timeline-gap::before,
.timeline-gap::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--sep);
}

.timeline-empty {
  text-align: center;
  color: var(--label3);
  font-size: 14px;
  padding: 40px 0;
  line-height: 1.8;
}

/* Stats */
.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.stat-card {
  background: var(--bg2);
  border-radius: var(--radius);
  border: 1px solid var(--sep);
  box-shadow: 0 2px 8px rgba(72,83,167,0.04);
  padding: 16px 14px;
}

.stat-value {
  font-size: 28px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: -0.5px;
}

.stat-unit {
  font-size: 13px;
  font-weight: 500;
  color: var(--accent-light);
}

.stat-label {
  font-size: 12px;
  color: var(--label3);
  margin-top: 3px;
  font-weight: 500;
}

/* Timer */
.timer-display {
  text-align: center;
  padding: 40px 0 30px;
}

.timer-time {
  font-size: 60px;
  font-weight: 300;
  letter-spacing: -2px;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}

.timer-topic-display {
  font-size: 14px;
  color: var(--label2);
  margin-top: 8px;
}

.timer-input-group {
  margin-bottom: 24px;
}

.timer-input-group label {
  font-size: 12px;
  font-weight: 500;
  color: var(--label3);
  display: block;
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.timer-input-group input[type="text"] {
  width: 100%;
  padding: 12px 14px;
  border-radius: 10px;
  border: 1px solid var(--sep);
  font-size: 16px;
  font-family: inherit;
  background: var(--bg2);
  color: var(--label);
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}

.timer-input-group input[type="text"]:focus {
  border-color: var(--accent-light);
  box-shadow: 0 0 0 3px rgba(72,83,167,0.08);
}

.combo-box {
  position: relative;
}

.combo-box input[type="text"] {
  padding-right: 38px;
}

.combo-toggle {
  position: absolute;
  right: 1px;
  top: 1px;
  bottom: 1px;
  width: 36px;
  background: none;
  border: none;
  color: var(--label3);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 0 10px 10px 0;
  transition: color 0.12s;
}

.combo-toggle:active { color: var(--accent); }

.combo-dropdown {
  display: none;
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
  background: var(--bg2);
  border: 1px solid var(--sep);
  border-radius: 10px;
  box-shadow: 0 6px 20px rgba(72,83,167,0.12);
  max-height: 200px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  z-index: 50;
}

.combo-dropdown.open { display: block; }

.combo-option {
  padding: 11px 14px;
  font-size: 15px;
  color: var(--label);
  cursor: pointer;
  transition: background 0.1s;
  font-family: inherit;
}

.combo-option:not(:last-child) {
  border-bottom: 1px solid var(--sep);
}

.combo-option:active { background: var(--fill); }

.timer-buttons {
  display: flex;
  gap: 10px;
}

.btn {
  flex: 1;
  padding: 13px;
  border-radius: var(--radius);
  font-size: 15px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  border: none;
  transition: opacity 0.12s, transform 0.08s;
  -webkit-user-select: none;
  user-select: none;
}

.btn:active { opacity: 0.75; transform: scale(0.98); }

.btn-primary {
  background: var(--accent);
  color: white;
}

.btn-secondary {
  background: var(--fill);
  color: var(--label);
}

.btn-danger {
  background: rgba(212,86,78,0.08);
  color: var(--red);
}

.btn-outline {
  background: var(--bg2);
  color: var(--accent);
  border: 1px solid var(--sep);
  font-weight: 500;
}

.timer-summary {
  text-align: center;
  padding: 20px 0;
}

.timer-summary .summary-dur {
  font-size: 36px;
  font-weight: 600;
  color: var(--accent);
}

.timer-summary .summary-label {
  font-size: 13px;
  color: var(--label3);
  margin-top: 4px;
  font-weight: 500;
}

/* Edit sheet */
.edit-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(46,49,66,0.3);
  z-index: 100;
  align-items: flex-end;
  justify-content: center;
}

.edit-overlay.show { display: flex; }

.edit-sheet {
  background: var(--bg2);
  border-radius: 18px 18px 0 0;
  padding: 24px 20px calc(env(safe-area-inset-bottom) + 20px);
  width: 100%;
  max-width: 430px;
}

.edit-sheet h3 {
  font-size: 16px;
  font-weight: 600;
  color: var(--label);
  margin-bottom: 16px;
}

.edit-field {
  margin-bottom: 14px;
}

.edit-field label {
  font-size: 12px;
  font-weight: 500;
  color: var(--label3);
  display: block;
  margin-bottom: 5px;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.edit-field input {
  width: 100%;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid var(--sep);
  font-size: 16px;
  font-family: inherit;
  background: var(--bg);
  color: var(--label);
  outline: none;
}

.edit-field input:focus {
  border-color: var(--accent-light);
}

.edit-actions {
  display: flex;
  gap: 10px;
  margin-top: 16px;
}

.edit-delete {
  margin-top: 12px;
  width: 100%;
}

/* Settings */
.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 13px 0;
  border-bottom: 1px solid var(--sep);
}

.setting-row:last-child { border-bottom: none; }

.setting-label {
  font-size: 14px;
  color: var(--label);
  font-weight: 500;
}

.setting-input {
  width: 64px;
  padding: 7px 8px;
  border-radius: 8px;
  border: 1px solid var(--sep);
  font-size: 16px;
  font-family: inherit;
  text-align: center;
  background: var(--bg);
  color: var(--label);
  outline: none;
}

.setting-input:focus { border-color: var(--accent-light); }

.settings-section {
  margin-top: 20px;
}

.settings-section h3 {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--label3);
  margin-bottom: 8px;
}

.btn-block {
  width: 100%;
  margin-top: 10px;
}

/* Cloud sync */
.sync-field {
  padding: 11px 0;
  border-bottom: 1px solid var(--sep);
}

.sync-field:last-of-type { border-bottom: none; }

.sync-field label {
  display: block;
  font-size: 12px;
  font-weight: 500;
  color: var(--label2);
  margin-bottom: 6px;
}

.sync-input {
  width: 100%;
  padding: 9px 10px;
  border-radius: 8px;
  border: 1px solid var(--sep);
  font-size: 16px;          /* 小于 16px 时 iOS 会自动放大页面 */
  font-family: inherit;
  background: var(--bg);
  color: var(--label);
  outline: none;
}

.sync-input:focus { border-color: var(--accent-light); }

.sync-state {
  font-size: 12px;
  line-height: 1.5;
  color: var(--label2);
  padding-top: 12px;
  border-top: 1px solid var(--sep);
}

/* Toast */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--tabbar-h, 60px) + 24px);
  transform: translateX(-50%) translateY(6px);
  max-width: 300px;
  padding: 9px 16px;
  border-radius: 999px;
  background: rgba(46,49,66,0.92);
  color: #fff;
  font-size: 13px;
  line-height: 1.4;
  text-align: center;
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: opacity .18s, transform .18s;
}

.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Confirm overlay */
.confirm-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(46,49,66,0.3);
  z-index: 100;
  align-items: flex-end;
  justify-content: center;
}

.confirm-overlay.show { display: flex; }

.confirm-sheet {
  background: var(--bg2);
  border-radius: 18px 18px 0 0;
  padding: 24px 20px calc(env(safe-area-inset-bottom) + 20px);
  width: 100%;
  max-width: 430px;
  text-align: center;
}

.confirm-sheet p {
  font-size: 14px;
  color: var(--label2);
  margin-bottom: 20px;
}

.confirm-sheet .btn { margin-top: 8px; }

/* Weekly chart */
.weekly-chart-wrap {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

.weekly-chart {
  display: flex;
  align-items: flex-end;
  gap: 6px;
  height: 150px;
  padding-top: 16px;
  min-width: min-content;
}

.wc-bar-group {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  height: 100%;
  min-width: 36px;
}

.wc-val {
  font-size: 11px;
  font-weight: 600;
  color: var(--accent);
  margin-bottom: 5px;
  white-space: nowrap;
}

.wc-bar {
  width: 28px;
  min-height: 2px;
  border-radius: 6px 6px 3px 3px;
  background: var(--accent-light);
  transition: height 0.3s ease;
}

.wc-label {
  font-size: 11px;
  color: var(--label3);
  margin-top: 8px;
  font-weight: 500;
  white-space: nowrap;
}
</style>
</head>
<body>

<header class="header">
  <h1>跡</h1>
  <p class="header-sub" id="headerSub">日々の学びを、ここに刻む</p>
</header>

<!-- Home View -->
<section class="view active" id="view-home">
  <div class="home-top">
    <button class="quick-start" id="quickStartBtn" onclick="quickStart()">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="9"/><polyline points="12 9 12 13 15.5 15"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="9" y1="1" x2="15" y2="1"/></svg>
      <span class="quick-start-text" id="quickStartText">开始学习</span>
    </button>

    <div class="card">
      <div class="card-inner">
        <div class="heatmap-wrap">
          <div class="heatmap-months" id="heatmapMonths"></div>
          <div class="heatmap-body">
            <div class="heatmap-labels">
              <span></span><span>一</span><span></span><span>三</span><span></span><span>五</span><span></span>
            </div>
            <div class="heatmap-grid" id="heatmapGrid"></div>
          </div>
        </div>
        <div class="heatmap-tooltip" id="heatmapTooltip"></div>
      </div>
    </div>
  </div>

  <div class="home-timeline">
    <div class="timeline-section" id="timeline"></div>
  </div>
</section>

<!-- Timer View (Tab 2) -->
<section class="view" id="view-timer">
  <div id="timerIdle">
    <div class="timer-input-group">
      <label for="topicInput">学习内容</label>
      <div class="combo-box" id="comboBox">
        <input type="text" id="topicInput" placeholder="播客、教材、单词…" autocomplete="off">
        <button type="button" class="combo-toggle" id="comboToggle" tabindex="-1">
          <svg width="12" height="12" viewBox="0 0 12 12"><polyline points="2 4 6 8 10 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>

<script>
// ── Date Helpers ─────────────────────────────────────────────
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function parseDate(s) {
  return new Date(s + 'T00:00:00');
}

function dateDiffDays(a, b) {
  return Math.round((parseDate(a) - parseDate(b)) / 86400000);
}

function isoMonday(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = (day === 0 ? -6 : 1) - day;
  d.setDate(d.getDate() + diff);
  return d;
}

function formatDuration(seconds) {
  if (seconds < 60) return `${seconds}秒`;
  const m = Math.floor(seconds / 60);
  if (m < 60) return `${m}分钟`;
  const h = Math.floor(m / 60);
  const rm = m % 60;
  return rm > 0 ? `${h}小时${rm}分钟` : `${h}小时`;
}

function formatDurShort(seconds) {
  const m = Math.floor(seconds / 60);
  if (m < 60) return `${m}分钟`;
  const hours = m / 60;
  return hours % 1 === 0 ? `${hours}小时` : `${hours.toFixed(1)}小时`;
}

function formatTimer(seconds) {
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function weekSunday(date) {
  const d = new Date(date);
  d.setDate(d.getDate() - d.getDay());
  return d;
}

function getMonthName(m) {
  return ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'][m];
}

// ── Storage ──────────────────────────────────────────────────
const KEY = 'jp-study-sessions';

function defaultData() {
  return { sessions: [], activeTimer: null, settings: { dailyGoalMinutes: 30, weeklyGoalDays: 6 } };
}

function loadData() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const d = JSON.parse(raw);
      if (!d.settings) d.settings = defaultData().settings;
      if (!d.sessions) d.sessions = [];
      return d;
    }
  } catch(e) {}
  return defaultData();
}

function saveData(data) {
  localStorage.setItem(KEY, JSON.stringify(data));
  scheduleSync();   // 全部写入都走这里，同步不用侵入任何一处业务逻辑
}

// ── Tab Navigation ───────────────────────────────────────────
function switchTab(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('view-' + id).classList.add('active');
  document.querySelector(`[data-tab="${id}"]`).classList.add('active');
  sessionStorage.setItem('jp-active-tab', id);
  if (id === 'home') renderHome();
  if (id === 'stats') renderStats();
  if (id === 'timer') renderTimerView();
}

// ── Quick Start ──────────────────────────────────────────────
function quickStart() {
  const data = loadData();
  if (data.activeTimer) {
    switchTab('timer');
  } else {
    switchTab('timer');
  }
}

function updateQuickStartBtn() {
  const data = loadData();
  const btn = document.getElementById('quickStartBtn');
  const text = document.getElementById('quickStartText');
  if (data.activeTimer) {
    const at = data.activeTimer;
    let elapsed;
    if (at.pausedAt) {
      elapsed = Math.floor((at.pausedAt - at.startedAt - (at.pausedDuration || 0)) / 1000);
    } else {
      elapsed = Math.floor((Date.now() - at.startedAt - (at.pausedDuration || 0)) / 1000);
    }
    if (elapsed < 0) elapsed = 0;
    text.innerHTML = `学习中 · ${formatTimer(elapsed)}<br><span class="quick-start-hint">${escHtml(at.topic || '未命名')}</span>`;
  } else {
    text.innerHTML = '开始学习';
  }
}

// ── Heatmap ──────────────────────────────────────────────────
function buildDayMap(sessions) {
  const map = {};
  for (const s of sessions) {
    map[s.date] = (map[s.date] || 0) + s.duration;
  }
  return map;
}

function getLevel(totalSeconds) {
  const m = totalSeconds / 60;
  if (m <= 0) return 0;
  if (m < 15) return 1;
  if (m < 30) return 2;
  if (m < 60) return 3;
  return 4;
}

function renderHeatmap() {
  const data = loadData();
  const dayMap = buildDayMap(data.sessions);
  const grid = document.getElementById('heatmapGrid');
  const monthsEl = document.getElementById('heatmapMonths');
  grid.innerHTML = '';
  monthsEl.innerHTML = '';

  const today = new Date();
  const startSunday = weekSunday(new Date(today.getFullYear(), 0, 1));
  const totalWeeks = Math.ceil((weekSunday(today).getTime() - startSunday.getTime()) / (7 * 86400000)) + 1;

  const monthPositions = [];
  let lastMonth = -1;

  for (let w = 0; w < totalWeeks; w++) {
    for (let d = 0; d < 7; d++) {
      const cellDate = new Date(startSunday);
      cellDate.setDate(startSunday.getDate() + w * 7 + d);

      const dateStr = `${cellDate.getFullYear()}-${String(cellDate.getMonth()+1).padStart(2,'0')}-${String(cellDate.getDate()).padStart(2,'0')}`;

      const cell = document.createElement('div');
      cell.className = 'heatmap-cell';

      if (cellDate > today) {
        cell.classList.add('future');
      } else {
        const total = dayMap[dateStr] || 0;
        const level = getLevel(total);
        if (level > 0) cell.classList.add('level-' + level);
        cell.dataset.date = dateStr;
        cell.onclick = () => showHeatmapTooltip(dateStr, data.sessions);
      }

      grid.appendChild(cell);

      if (d === 0 && cellDate.getMonth() !== lastMonth) {
        if (cellDate.getFullYear() === today.getFullYear()) {
          monthPositions.push({ month: cellDate.getMonth(), week: w });
        }
        lastMonth = cellDate.getMonth();
      }
    }
  }

  const cellSize = 15;
  for (let i = 0; i < monthPositions.length; i++) {
    const span = document.createElement('span');
    span.textContent = getMonthName(monthPositions[i].month);
    const nextWeek = i + 1 < monthPositions.length ? monthPositions[i+1].week : totalWeeks;
    span.style.width = (nextWeek - monthPositions[i].week) * cellSize + 'px';
    monthsEl.appendChild(span);
  }

  const wrap = document.querySelector('.heatmap-wrap');
  if (wrap) requestAnimationFrame(() => { wrap.scrollLeft = wrap.scrollWidth; });
}

function showHeatmapTooltip(dateStr, sessions) {
  const tooltip = document.getElementById('heatmapTooltip');
  const daySessions = sessions.filter(s => s.date === dateStr);
  const d = parseDate(dateStr);
  const label = `${d.getMonth()+1}月${d.getDate()}日`;

  if (daySessions.length === 0) {
    tooltip.innerHTML = `<div class="tt-date">${label}</div><div>无学习记录</div>`;
  } else {
    const total = daySessions.reduce((a, s) => a + s.duration, 0);
    let html = `<div class="tt-date">${label} — ${formatDuration(total)}</div>`;
    for (const s of daySessions) {
      html += `<div class="tt-item"><span>${escHtml(s.topic || '未命名')}</span><span>${formatDurShort(s.duration)}</span></div>`;
    }
    tooltip.innerHTML = html;
  }
  tooltip.classList.add('show');
}

// ── Timeline ─────────────────────────────────────────────────
function renderTimeline() {
  const data = loadData();
  const container = document.getElementById('timeline');
  const sessions = [...data.sessions].sort((a, b) => {
    const dd = b.date.localeCompare(a.date);
    if (dd !== 0) return dd;
    return (b.startTime || '').localeCompare(a.startTime || '');
  });

  if (sessions.length === 0) {
    container.innerHTML = '<div class="timeline-empty">还没有学习记录<br>点击上方按钮开始第一次学习</div>';
    return;
  }

  const groups = [];
  let cur = null;
  for (const s of sessions) {
    if (!cur || cur.date !== s.date) {
      cur = { date: s.date, items: [] };
      groups.push(cur);
    }
    cur.items.push(s);
  }

  let html = '';
  for (let i = 0; i < groups.length; i++) {
    const g = groups[i];
    const d = parseDate(g.date);
    const total = g.items.reduce((a, s) => a + s.duration, 0);

    if (i > 0) {
      const gap = dateDiffDays(groups[i-1].date, g.date);
      if (gap >= 2) {
        html += `<div class="timeline-gap">${gap}天</div>`;
      }
    }

    html += '<div class="timeline-entry">';
    html += `<div class="timeline-date"><div class="day">${String(d.getDate()).padStart(2,'0')}</div><div class="month">${d.getMonth()+1}月</div></div>`;
    html += '<div class="timeline-items">';
    for (const s of g.items) {
      html += `<div class="timeline-item" onclick="openEdit('${s.id}')"><span class="topic">${escHtml(s.topic || '未命名')}</span><span class="dur">${formatDurShort(s.duration)}</span></div>`;
    }
    if (g.items.length > 1) {
      html += `<div class="timeline-total">${formatDuration(total)}</div>`;
    }
    html += '</div></div>';
  }
  container.innerHTML = html;
}

function truncMid(s, max) {
  if (s.length <= max) return s;
  const tail = Math.ceil(max * 0.4);
  const head = max - tail - 1;
  return s.slice(0, head) + '…' + s.slice(-tail);
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderHome() {
  updateQuickStartBtn();
  renderHeatmap();
  renderTimeline();
  document.getElementById('heatmapTooltip').classList.remove('show');
}

// ── Edit / Delete Sessions ───────────────────────────────────
let editingId = null;

function openEdit(id) {
  const data = loadData();
  const session = data.sessions.find(s => s.id === id);
  if (!session) return;

  editingId = id;
  document.getElementById('editTopic').value = session.topic || '';
  document.getElementById('editDuration').value = Math.round(session.duration / 60);
  document.getElementById('editOverlay').classList.add('show');
}

function closeEdit() {
  document.getElementById('editOverlay').classList.remove('show');
  editingId = null;
}

function saveEdit() {
  if (!editingId) return;
  const data = loadData();
  const session = data.sessions.find(s => s.id === editingId);
  if (!session) return;

  session.topic = document.getElementById('editTopic').value.trim();
  const mins = parseInt(document.getElementById('editDuration').value);
  if (mins > 0) session.duration = mins * 60;

  saveData(data);
  closeEdit();
  renderHome();
}

function exportEditToCalendar() {
  if (!editingId) return;
  const data = loadData();
  const session = data.sessions.find(s => s.id === editingId);
  if (!session) return;
  downloadICS(session);
}

function deleteSession() {
  if (!editingId) return;
  const data = loadData();
  data.sessions = data.sessions.filter(s => s.id !== editingId);
  saveData(data);
  closeEdit();
  renderHome();
}

// ── Stats ────────────────────────────────────────────────────
function renderStats() {
  const data = loadData();
  const sessions = data.sessions;
  const settings = data.settings;
  const grid = document.getElementById('statsGrid');

  const totalSec = sessions.reduce((a, s) => a + s.duration, 0);
  const uniqueDays = new Set(sessions.map(s => s.date));
  const avgSec = uniqueDays.size > 0 ? Math.round(totalSec / uniqueDays.size) : 0;

  const dayMap = buildDayMap(sessions);
  let streak = 0;
  const t = new Date();
  for (let i = 0; i < 365; i++) {
    const d = new Date(t);
    d.setDate(d.getDate() - i);
    const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const mins = (dayMap[ds] || 0) / 60;
    if (mins >= settings.dailyGoalMinutes) {
      streak++;
    } else if (i === 0) {
      continue;
    } else {
      break;
    }
  }

  const sunday = weekSunday(new Date());
  const mondayStr = `${sunday.getFullYear()}-${String(sunday.getMonth()+1).padStart(2,'0')}-${String(sunday.getDate()).padStart(2,'0')}`;
  const weekDays = new Set();
  for (const s of sessions) {
    if (s.date >= mondayStr) weekDays.add(s.date);
  }

  const totalH = Math.floor(totalSec / 3600);
  const totalM = Math.floor((totalSec % 3600) / 60);

  grid.innerHTML = `
    <div class="stat-card">
      <div class="stat-value">${totalH > 0 ? totalH : totalM}<span class="stat-unit">${totalH > 0 ? '小时' : '分钟'}${totalH > 0 && totalM > 0 ? ` ${totalM}分钟` : ''}</span></div>
      <div class="stat-label">总学习时长</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">${streak}<span class="stat-unit">天</span></div>
      <div class="stat-label">连续达标</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">${Math.round(avgSec/60)}<span class="stat-unit">分钟</span></div>
      <div class="stat-label">日均学习</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">${weekDays.size}<span class="stat-unit">/${settings.weeklyGoalDays}天</span></div>
      <div class="stat-label">本周进度</div>
    </div>
  `;

  const weekDetail = document.getElementById('weekDetail');
  const weekSessions = sessions.filter(s => s.date >= mondayStr).sort((a,b) => b.date.localeCompare(a.date));
  if (weekSessions.length === 0) {
    weekDetail.innerHTML = '<div style="color:var(--label3);font-size:13px;text-align:center;padding:12px 0">本周还没有学习记录</div>';
  } else {
    const weekTotal = weekSessions.reduce((a,s) => a + s.duration, 0);
    const weekGroups = {};
    for (const s of weekSessions) {
      const key = s.date + '|' + (s.topic || '未命名');
      if (!weekGroups[key]) weekGroups[key] = { date: s.date, topic: s.topic || '未命名', duration: 0, count: 0 };
      weekGroups[key].duration += s.duration;
      weekGroups[key].count++;
    }
    const weekGrouped = Object.values(weekGroups).sort((a,b) => b.date.localeCompare(a.date));
    let html = '';
    for (const g of weekGrouped) {
      const d = parseDate(g.date);
      const countLabel = g.count > 1 ? ` ×${g.count}` : '';
      html += `<div style="display:flex;justify-content:space-between;padding:5px 0;font-size:13px"><span style="color:var(--label2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${d.getMonth()+1}/${d.getDate()} ${escHtml(g.topic)}${countLabel}</span><span style="color:var(--label);font-weight:500;flex-shrink:0;margin-left:8px">${formatDurShort(g.duration)}</span></div>`;
    }
    html += `<div style="text-align:right;font-size:12px;color:var(--label3);margin-top:6px;padding-top:6px;border-top:1px solid var(--sep);font-weight:500">合计 ${formatDuration(weekTotal)}</div>`;
    weekDetail.innerHTML = html;
  }

  const topicMap = {};
  const topicLatest = {};
  for (const s of sessions) {
    const t = s.topic || '未命名';
    topicMap[t] = (topicMap[t] || 0) + s.duration;
    const key = s.date + (s.startTime || '');
    if (!topicLatest[t] || key > topicLatest[t]) topicLatest[t] = key;
  }
  const topicBreakdown = document.getElementById('topicBreakdown');
  const sorted = Object.entries(topicMap).sort((a, b) => (topicLatest[b[0]] || '').localeCompare(topicLatest[a[0]] || ''));
  if (sorted.length === 0) {
    topicBreakdown.innerHTML = '<div style="color:var(--label3);font-size:13px;text-align:center;padding:12px 0">暂无数据</div>';
  } else {
    let thtml = '';
    for (const [topic, dur] of sorted) {
      const pct = totalSec > 0 ? Math.round(dur / totalSec * 100) : 0;
      thtml += `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13px"><span style="color:var(--label);font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(truncMid(topic, 18))}</span><span style="color:var(--label2);flex-shrink:0;margin-left:10px">${formatDuration(dur)}</span><span style="color:var(--label3);flex-shrink:0;width:40px;text-align:right">${pct}%</span></div>`;
    }
    topicBreakdown.innerHTML = thtml;
  }

  renderWeeklyChart();
}

// ── Weekly Chart ─────────────────────────────────────────────
function renderWeeklyChart() {
  const data = loadData();
  const container = document.getElementById('weeklyChart');
  const maxBarH = 110;

  if (data.sessions.length === 0) {
    container.innerHTML = '<div style="color:var(--label3);font-size:13px;text-align:center;padding:12px 0">暂无数据</div>';
    return;
  }

  const earliest = data.sessions.reduce((min, s) => s.date < min ? s.date : min, data.sessions[0].date);
  const firstSunday = weekSunday(parseDate(earliest));
  const curSunday = weekSunday(new Date());
  const numWeeks = Math.round((curSunday - firstSunday) / (7 * 86400000)) + 1;

  const weeks = [];
  for (let i = 0; i < numWeeks; i++) {
    const sun = new Date(firstSunday);
    sun.setDate(sun.getDate() + i * 7);
    const sunStr = `${sun.getFullYear()}-${String(sun.getMonth()+1).padStart(2,'0')}-${String(sun.getDate()).padStart(2,'0')}`;
    const sat = new Date(sun);
    sat.setDate(sat.getDate() + 6);
    const satStr = `${sat.getFullYear()}-${String(sat.getMonth()+1).padStart(2,'0')}-${String(sat.getDate()).padStart(2,'0')}`;
    weeks.push({ sun, sunStr, satStr, label: `${sun.getMonth()+1}/${sun.getDate()}` });
  }

  for (const w of weeks) {
    let total = 0;
    for (const s of data.sessions) {
      if (s.date >= w.sunStr && s.date <= w.satStr) total += s.duration;
    }
    w.hours = Math.round(total / 360) / 10;
  }

  const maxVal = Math.max(...weeks.map(w => w.hours), 0.1);

  let html = '<div class="weekly-chart-wrap"><div class="weekly-chart">';
  for (const w of weeks) {
    const h = Math.round((w.hours / maxVal) * maxBarH);
    const valLabel = w.hours % 1 === 0 ? String(w.hours) : w.hours.toFixed(1);
    html += `<div class="wc-bar-group">`;
    html += `<span class="wc-val">${valLabel}</span>`;
    html += `<div class="wc-bar" style="height:${h}px"></div>`;
    html += `<span class="wc-label">${w.label}</span>`;
    html += `</div>`;
  }
  html += '</div></div>';
  container.innerHTML = html;
  const wrap = container.querySelector('.weekly-chart-wrap');
  if (wrap) requestAnimationFrame(() => { wrap.scrollLeft = wrap.scrollWidth; });
}

// ── Timer ────────────────────────────────────────────────────
let timerInterval = null;
let stoppedDuration = 0;

function renderTimerView() {
  const data = loadData();
  populateTopicSuggestions(data);

  if (data.activeTimer) {
    showTimerState('running');
    document.getElementById('timerTopicLabel').textContent = data.activeTimer.topic || '';
    const btn = document.getElementById('pauseBtn');
    btn.textContent = data.activeTimer.pausedAt ? '继续' : '暂停';
    startTimerDisplay();
  } else {
    showTimerState('idle');
  }
}

function getTopicsByRecency(data) {
  const latest = {};
  for (const s of data.sessions) {
    if (s.topic) {
      const key = s.date + (s.startTime || '');
      if (!latest[s.topic] || key > latest[s.topic]) latest[s.topic] = key;
    }
  }
  return Object.keys(latest).sort((a, b) => latest[b].localeCompare(latest[a])).slice(0, 20);
}

function populateTopicSuggestions(data) {
  const topics = getTopicsByRecency(data);
  const dd = document.getElementById('comboDropdown');
  if (topics.length === 0) {
    dd.innerHTML = '';
    return;
  }
  dd.innerHTML = topics.map(t => `<div class="combo-option" data-value="${escHtml(t)}">${escHtml(t)}</div>`).join('');
}

(function initComboBox() {
  document.addEventListener('click', function(e) {
    const box = document.getElementById('comboBox');
    const dd = document.getElementById('comboDropdown');
    if (!box || !dd) return;
    if (!box.contains(e.target)) dd.classList.remove('open');
  });

  document.addEventListener('click', function(e) {
    if (e.target.classList.contains('combo-option')) {
      const input = document.getElementById('topicInput');
      input.value = e.target.dataset.value;
      document.getElementById('comboDropdown').classList.remove('open');
      input.focus();
    }
  });

  const toggle = document.getElementById('comboToggle');
  if (toggle) {
    toggle.addEventListener('click', function() {
      const dd = document.getElementById('comboDropdown');
      if (dd.children.length === 0) return;
      dd.classList.toggle('open');
    });
  }

  const input = document.getElementById('topicInput');
  if (input) {
    input.addEventListener('focus', function() {
      const dd = document.getElementById('comboDropdown');
      if (dd.children.length > 0) dd.classList.add('open');
    });
    input.addEventListener('input', function() {
      const dd = document.getElementById('comboDropdown');
      const val = this.value.trim().toLowerCase();
      const items = dd.querySelectorAll('.combo-option');
      let hasVisible = false;
      items.forEach(item => {
        const match = !val || item.dataset.value.toLowerCase().includes(val);
        item.style.display = match ? '' : 'none';
        if (match) hasVisible = true;
      });
      if (hasVisible) dd.classList.add('open');
      else dd.classList.remove('open');
    });
  }
})();

function showTimerState(state) {
  document.getElementById('timerIdle').style.display = state === 'idle' ? 'block' : 'none';
  document.getElementById('timerRunning').style.display = state === 'running' ? 'block' : 'none';
  document.getElementById('timerStopped').style.display = state === 'stopped' ? 'block' : 'none';
  if (state !== 'running' && timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
}

function startTimer() {
  const topic = document.getElementById('topicInput').value.trim();
  const data = loadData();
  data.activeTimer = {
    startedAt: Date.now(),
    topic: topic,
    pausedAt: null,
    pausedDuration: 0
  };
  saveData(data);
  document.getElementById('topicInput').value = '';
  showTimerState('running');
  document.getElementById('timerTopicLabel').textContent = topic;
  document.getElementById('pauseBtn').textContent = '暂停';
  startTimerDisplay();
}

function startTimerDisplay() {
  updateTimerDisplay();
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(updateTimerDisplay, 1000);
}

function updateTimerDisplay() {
  const data = loadData();
  if (!data.activeTimer) return;
  const at = data.activeTimer;
  let elapsed;
  if (at.pausedAt) {
    elapsed = Math.floor((at.pausedAt - at.startedAt - (at.pausedDuration || 0)) / 1000);
  } else {
    elapsed = Math.floor((Date.now() - at.startedAt - (at.pausedDuration || 0)) / 1000);
  }
  if (elapsed < 0) elapsed = 0;
  document.getElementById('timerTime').textContent = formatTimer(elapsed);
}

function togglePause() {
  const data = loadData();
  if (!data.activeTimer) return;
  const at = data.activeTimer;
  const btn = document.getElementById('pauseBtn');

  if (at.pausedAt) {
    at.pausedDuration = (at.pausedDuration || 0) + (Date.now() - at.pausedAt);
    at.pausedAt = null;
    btn.textContent = '暂停';
    startTimerDisplay();
  } else {
    at.pausedAt = Date.now();
    btn.textContent = '继续';
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    updateTimerDisplay();
  }
  saveData(data);
}

function stopTimer() {
  const data = loadData();
  if (!data.activeTimer) return;
  const at = data.activeTimer;

  let endTime = at.pausedAt || Date.now();
  stoppedDuration = Math.floor((endTime - at.startedAt - (at.pausedDuration || 0)) / 1000);
  if (stoppedDuration < 0) stoppedDuration = 0;

  showTimerState('stopped');
  document.getElementById('summaryDur').textContent = formatDuration(stoppedDuration);
  document.getElementById('topicEdit').value = at.topic || '';
}

function saveSession() {
  const data = loadData();
  const at = data.activeTimer;
  if (!at) return;

  const topic = document.getElementById('topicEdit').value.trim();
  const startDate = new Date(at.startedAt);
  const session = {
    id: String(at.startedAt),
    date: `${startDate.getFullYear()}-${String(startDate.getMonth()+1).padStart(2,'0')}-${String(startDate.getDate()).padStart(2,'0')}`,
    startTime: `${String(startDate.getHours()).padStart(2,'0')}:${String(startDate.getMinutes()).padStart(2,'0')}`,
    duration: stoppedDuration,
    topic: topic
  };

  data.sessions.push(session);
  data.activeTimer = null;
  saveData(data);

  downloadICS(session);
  showTimerState('idle');
  switchTab('home');
}

function generateICS(session) {
  let start;
  if (session.date && session.startTime) {
    const [h, m] = session.startTime.split(':').map(Number);
    start = parseDate(session.date);
    start.setHours(h, m, 0, 0);
  } else {
    start = new Date(parseInt(session.id));
  }
  const end = new Date(start.getTime() + session.duration * 1000);
  const fmt = d => `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}T${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}${String(d.getSeconds()).padStart(2,'0')}`;
  const lines = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//JP Study Timer//EN',
    'BEGIN:VEVENT',
    'UID:' + session.id + '@jp-study',
    'DTSTART:' + fmt(start),
    'DTEND:' + fmt(end),
    'SUMMARY:日语学习',
    'DESCRIPTION:' + (session.topic || '').replace(/\n/g, '\\n'),
    'END:VEVENT',
    'END:VCALENDAR'
  ];
  return lines.join('\r\n');
}

function downloadICS(session) {
  const ics = generateICS(session);
  const blob = new Blob([ics], { type: 'text/calendar' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '日语学习.ics';
  a.click();
  URL.revokeObjectURL(url);
}

function discardSession() {
  const data = loadData();
  data.activeTimer = null;
  saveData(data);
  showTimerState('idle');
}

function loadSettings() {
  const data = loadData();
  const ae = document.activeElement;
  if (ae && (ae.id === 'goalMinutes' || ae.id === 'goalDays')) return;   // 正在改的框不回填

function showConfirm() { document.getElementById('confirmOverlay').classList.add('show'); }
function hideConfirm() { document.getElementById('confirmOverlay').classList.remove('show'); }

function clearAllData() {
  localStorage.removeItem(KEY);
  /* 清空只清这台设备。快照和游标一起归零，下次同步就当新设备走全量拉取——
     不归零的话，比对快照会把每一条都算成「本机删过」，一轮同步就把云端也清了。 */
  localStorage.removeItem(SYNC_AT_KEY);
  localStorage.removeItem(SYNC_SNAP_KEY);
  localStorage.removeItem(SYNC_SETH_KEY);
  syncSnap = {};
  hideConfirm();
  renderAll();
  if (syncOn()) showToast('已清空本机 · 云端数据下次同步会拉回来');
}

// ── CSV Export/Import ────────────────────────────────────────
function shareOrDownload(content, filename, mime) {
  // 优先走 iOS 分享面板（一步直达），不支持或分享失败时退回 <a download>；用户主动取消不触发下载
  const file = new File([content], filename, { type: mime });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file], title: filename })
      .catch(err => { if (!err || err.name !== 'AbortError') fallbackDownload(content, filename, mime); });
  } else {
    fallbackDownload(content, filename, mime);
  }
}

function fallbackDownload(content, filename, mime) {
  const url = URL.createObjectURL(new Blob([content], { type: mime }));
  const a = Object.assign(document.createElement('a'), { href: url, download: filename });
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportCSV() {
  const data = loadData();
  const rows = ['date,start_time,duration_minutes,topic'];
  for (const s of [...data.sessions].sort((a,b) => a.date.localeCompare(b.date))) {
    rows.push(`${s.date},${s.startTime || ''},${Math.round(s.duration / 60)},"${(s.topic||'').replace(/"/g,'""')}"`);
  }
  const csv = rows.join('\n');
  shareOrDownload('﻿' + csv, `japanese_study_${todayStr()}.csv`, 'text/csv;charset=utf-8;');
}

function importCSV(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const text = e.target.result.replace(/^﻿/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    const lines = text.split('\n').slice(1);
    const data = loadData();
    const header = text.split('\n')[0];
    const isMinutes = header.includes('duration_minutes');
    for (const line of lines) {
      if (!line.trim()) continue;
      const match = line.match(/^(\d{4}[-/]\d{1,2}[-/]\d{1,2}),([^,]*),(\d+),(.*)$/);
      if (!match) continue;
      const rawDate = match[1];
      const dp = rawDate.split(/[-/]/);
      const date = `${dp[0]}-${dp[1].padStart(2,'0')}-${dp[2].padStart(2,'0')}`;
      const [, , startTime, durVal, topicRaw] = match;
      const topic = topicRaw.replace(/^"|"$/g, '').replace(/""/g, '"');
      const duration = isMinutes ? parseInt(durVal) * 60 : parseInt(durVal);
      if (!data.sessions.some(s => s.date === date && s.duration === duration && s.topic === topic)) {
        data.sessions.push({
          id: String(Date.now() + Math.random()),
          date,
          startTime,
          duration,
          topic
        });
      }
    }
    saveData(data);
    renderAll();
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ── 云同步（Cloudflare Worker + D1）───────────────────────────
/* 手机上记的学习记录要在电脑网页上直接看见，中间不能有手动步骤，所以做成后台自动
   同步：存一条 → 2.5 秒后推上去；切回前台 / 网络恢复 → 拉一次。服务端在
   sync-worker/，部署步骤见那儿的 README.md。

   同步的是 sessions（每条一行）和 settings（整体一行，最后写入的赢）。
   进行中的计时不同步——它每次暂停/继续都在变，两台设备抢同一段计时的话，谁赢都
   可能吞掉一段正在计的时间。停表存成 session 之后自然就同步过去了。 */

const SYNC_URL_KEY   = 'jp-sync-url';
const SYNC_TOKEN_KEY = 'jp-sync-token';
const SYNC_AT_KEY    = 'jp-sync-at';    // 上次同步拿到的服务器时间，增量拉取的游标
const SYNC_SNAP_KEY  = 'jp-sync-snap';  // id → 内容 hash，用来算「哪几条改过」
const SYNC_SETH_KEY  = 'jp-sync-seth';  // 目标设置的 hash，单独存——混进 snap 会被当成一条记录，进而生成假墓碑

/* 瞬时故障的退避重试。没有这个的话，一次网络抖动就把这台设备晾到用户下次动手为止：
   电脑上开着 App 几秒后就被下一次写入带过去了，手机记完就锁屏，一次 500 能卡一整天。 */
const SYNC_BACKOFF = [3000, 15000, 60000];
const SYNC_TIMEOUT = 20000;  // 挂死的请求必须自己断，见 doSync 里的 AbortController

let syncSnap     = (() => { try { return JSON.parse(localStorage.getItem(SYNC_SNAP_KEY)) || {}; } catch(e) { return {}; } })();
let syncing      = false;
let syncTimer    = null;
let syncErr      = '';
let syncRetry    = 0;      // 连续失败次数，即 SYNC_BACKOFF 的下标。成功或换个由头重来就清零
let syncLastAt   = 0;      // 上次「尝试」同步的时刻，给回前台的触发做节流
let suppressSync = false;  // 同步过程里回写本地会调 saveData，别让它再触发一轮

// fatal = 重试多少次都一样、非改配置不可，别浪费退避轮次
function syncFail(msg, fatal) { const e = new Error(msg); e.fatal = !!fatal; return e; }

function syncCfg() {
  return {
    url:   (localStorage.getItem(SYNC_URL_KEY) || '').trim().replace(/\/+$/, ''),
    token: (localStorage.getItem(SYNC_TOKEN_KEY) || '').trim(),
  };
}
function syncOn() { const c = syncCfg(); return !!(c.url && c.token); }

// djb2。只存 hash 不存原文，快照压到几 KB，不跟记录抢 localStorage 那 5MB
function hashStr(s) {
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
  return (h >>> 0).toString(36);
}

// 极老的数据可能没有 id。按内容算一个：同一条在两台设备上算出来一样，不会同步成两条
function sessionId(s) {
  return s.id || ('x' + hashStr([s.date, s.startTime, s.duration, s.topic].join('|')));
}

// 跟上次同步后的快照比，算出「改过的」和「被删的」，
// 这样每处 saveData() 调用点都不用改，也不用往 session 上加 updated 字段
function collectDirty(sessions) {
  const out = [];
  const live = new Set();
  for (const s of sessions) {
    const id = sessionId(s);
    live.add(id);
    const data = JSON.stringify({ ...s, id });
    if (syncSnap[id] !== hashStr(data)) out.push({ id, data });
  }
  // 快照里有、现在没了 → 本机删过。必须给服务端留墓碑，否则下次拉取它又活过来
  for (const id in syncSnap) if (!live.has(id)) out.push({ id, deleted: 1 });
  return out;
}

function applyRemote(data, rows) {
  let n = 0;
  for (const r of rows) {
    if (!r || !r.id) continue;
    const i = data.sessions.findIndex(s => sessionId(s) === r.id);
    if (r.deleted) {
      if (i >= 0) { data.sessions.splice(i, 1); n++; }
      delete syncSnap[r.id];
      continue;
    }
    let s;
    try { s = JSON.parse(r.data); } catch(e) { continue; }
    if (!s || !s.id) continue;
    if (i >= 0) data.sessions[i] = s; else data.sessions.push(s);
    syncSnap[s.id] = hashStr(JSON.stringify(s));
    n++;
  }
  return n;
}

function scheduleSync(delay = 2500) {
  if (suppressSync || !syncOn()) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => doSync(), delay);
}

async function doSync(opts = {}) {
  const manual = !!opts.manual;
  if (!syncOn())         { if (manual) showToast('还没设置云同步'); return; }
  if (syncing)           { if (manual) showToast('正在同步…'); return; }
  if (!navigator.onLine) { if (manual) showToast('当前没有网络'); return; }
  // 编辑弹窗开着的时候拉到新数据会重绘列表，打断操作，等一会儿再说
  if (!manual && editingId) { scheduleSync(8000); return; }
  // 换了个由头重来（手点、回前台、网络恢复），退避从头算，别接着上一轮的 60 秒
  if (manual || opts.fresh) syncRetry = 0;

  syncing = true;
  syncLastAt = Date.now();
  setSyncStateText('正在同步…');
  try {
    const cfg = syncCfg();
    const since = Number(localStorage.getItem(SYNC_AT_KEY) || 0);
    const data = loadData();
    const dirty = collectDirty(data.sessions);
    const setJSON = JSON.stringify(data.settings);
    /* 没有基准 hash = 这台设备第一次同步，手上的目标设置很可能只是默认值。
       照样发上去，但标成「种子」：云端空着就用它开头，已经有了就以云端为准。
       不这么分的话，新设备第一次同步就会把别处设好的目标冲成默认值。 */
    const setBase = localStorage.getItem(SYNC_SETH_KEY);
    const setSeed = setBase === null;
    const setDirty = setSeed || hashStr(setJSON) !== setBase;

    /* 超时必须自己掐。移动网络下 fetch 可以吊着永不 reject，而 syncing 是在
       finally 里才放开的——真挂住的话这台设备后面每次同步都会被「正在同步…」
       挡回去，直到用户重启 App。 */
    const ac = new AbortController();
    const killer = setTimeout(() => ac.abort(), SYNC_TIMEOUT);
    let res;
    try {
      res = await fetch(cfg.url + '/sync', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + cfg.token },
        body: JSON.stringify({ since, sessions: dirty, settings: setDirty ? setJSON : null, settingsSeed: setSeed ? 1 : 0 }),
        signal: ac.signal,
      });
    } catch (e) {
      throw syncFail(e.name === 'AbortError' ? '超时' : '连不上服务器');
    } finally {
      clearTimeout(killer);
    }
    if (res.status === 401) throw syncFail('密钥不对', true);
    // 5xx 和 429 是服务端一时不行（冷启动撞上 D1 抖动就会抛 500），值得重试；
    // 其余 4xx 是这个请求本身有问题，重发一模一样的内容不会有别的结果
    if (!res.ok) throw syncFail('服务端 ' + res.status, res.status < 500 && res.status !== 429);
    const out = await res.json();

    // 推成功了快照才跟上。失败就原样留着，下次整批重推——宁可重推也不能漏推
    for (const d of dirty) {
      if (d.deleted) delete syncSnap[d.id];
      else syncSnap[d.id] = hashStr(d.data);
    }
    if (setDirty) localStorage.setItem(SYNC_SETH_KEY, hashStr(setJSON));

    // 回写前重新读一遍：请求飞在路上的这几秒里用户可能又存了一条
    const fresh = loadData();
    let changed = 0;
    if (out.settings) {
      try {
        const rs = JSON.parse(out.settings);
        if (rs && typeof rs === 'object') {
          const merged = { ...fresh.settings, ...rs };
          const h = hashStr(JSON.stringify(merged));
          if (h !== hashStr(JSON.stringify(fresh.settings))) changed++;   // 一样就别算成一次更新
          fresh.settings = merged;
          localStorage.setItem(SYNC_SETH_KEY, h);
        }
      } catch(e) { /* 云端设置坏了就不动本地的 */ }
    }
    changed += applyRemote(fresh, out.sessions || []);

    localStorage.setItem(SYNC_AT_KEY, String(out.now));
    localStorage.setItem(SYNC_SNAP_KEY, JSON.stringify(syncSnap));
    syncErr = '';
    syncRetry = 0;

    if (changed) {
      suppressSync = true;
      saveData(fresh);
      suppressSync = false;
      renderAll();
      if (document.getElementById('view-stats').classList.contains('active')) renderStats();
    }
    setSyncStateText();
    if (manual) showToast(changed ? `已同步，更新 ${changed} 条` : '已是最新');
    if (out.truncated) scheduleSync(600);   // 这批没拉完，接着拉下一批
  } catch (err) {
    syncErr = err.message || '同步失败';
    if (manual) showToast('同步失败：' + syncErr);
    /* 退避重试走 scheduleSync 而不是自己起 timer，为的是共用 syncTimer：期间用户
       又存了一条的话，那 2.5 秒的正常同步会顶掉排队中的重试，不会两个计时器打架。
       三轮走完就交回给自然触发（存记录 / 回前台 / 网络恢复），不无限重试。 */
    if (!err.fatal && syncRetry < SYNC_BACKOFF.length) {
      const wait = SYNC_BACKOFF[syncRetry++];
      syncErr += `，${Math.round(wait / 1000)} 秒后重试`;
      scheduleSync(wait);
    } else {
      syncRetry = 0;
    }
    setSyncStateText();
  } finally {
    syncing = false;
  }
}

function syncStateText() {
  if (!syncOn()) return '未开启 · 记录只存在这台设备上';
  if (syncErr) return '上次失败：' + syncErr;
  const at = Number(localStorage.getItem(SYNC_AT_KEY) || 0);
  if (!at) return '已设置 · 还没同步过';
  const d = new Date(at);
  const hm = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  const today = todayStr() === `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  return `上次同步 ${today ? '' : `${d.getMonth()+1}月${d.getDate()}日 `}${hm}`;
}

function setSyncStateText(msg) {
  const el = document.getElementById('syncState');
  if (el) el.textContent = msg || syncStateText();
}

function loadSyncCfg() {
  const c = syncCfg();
  // 后台同步会带着 renderAll 一起回来，正在输入的框不能被回填顶掉
  const ae = document.activeElement;
  if (!ae || (ae.id !== 'syncUrl' && ae.id !== 'syncToken')) {
    document.getElementById('syncUrl').value = c.url;
    document.getElementById('syncToken').value = c.token;
  }
  setSyncStateText();
}

function saveSyncCfg() {
  const url = document.getElementById('syncUrl').value.trim().replace(/\/+$/, '');
  const token = document.getElementById('syncToken').value.trim();
  // 换了地址或密钥就当新设备：游标和快照归零，下次走全量拉取
  const c = syncCfg();
  if (url !== c.url || token !== c.token) {
    localStorage.removeItem(SYNC_AT_KEY);
    localStorage.removeItem(SYNC_SNAP_KEY);
    syncSnap = {};
    syncErr = '';
  }
  localStorage.setItem(SYNC_URL_KEY, url);
  localStorage.setItem(SYNC_TOKEN_KEY, token);
  loadSyncCfg();
  if (!syncOn()) { showToast('地址和密钥都要填'); return; }
  doSync({ manual: true });
}

let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

// 切回前台 / 网络恢复：拉一次别的设备的改动。30 秒内刚同步过就不重复敲
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && Date.now() - syncLastAt > 30000) {
    doSync({ fresh: true });
  }
});
window.addEventListener('online', () => doSync({ fresh: true }));

// ── Service Worker ───────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

// ── Init ─────────────────────────────────────────────────────
function updateLayoutVars() {
  const header = document.querySelector('.header');
  const tabbar = document.querySelector('.tab-bar');
  if (header) document.documentElement.style.setProperty('--header-h', header.offsetHeight + 'px');
  if (tabbar) document.documentElement.style.setProperty('--tabbar-h', tabbar.offsetHeight + 'px');
}

// Lock app height; refresh whenever the viewport really changes (browser chrome
// collapse/expand, rotation, relaunch). Body has transform, so the fixed tab bar
// anchors to body's bottom — a stale --app-h makes it float up or clip off-screen.
function updateAppHeight() {
  // 键盘弹起期间跳过刷新，维持"键盘不挤压布局"的锁定设计
  const ae = document.activeElement;
  if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')) return;
  document.body.style.setProperty('--app-h', document.documentElement.clientHeight + 'px');
}

(function() {
  updateAppHeight();
  // Prevent iOS from scrolling the fixed body when input is focused
  document.addEventListener('focusin', function(e) {
    if (e.target.tagName === 'INPUT') {
      setTimeout(function() { window.scrollTo(0, 0); }, 50);
    }
  });
  // 键盘收起后校正一次高度
  document.addEventListener('focusout', function() {
    setTimeout(updateAppHeight, 100);
  });
  window.addEventListener('scroll', function() { window.scrollTo(0, 0); });
  window.addEventListener('resize', function() { updateAppHeight(); updateLayoutVars(); });
  window.addEventListener('pageshow', updateAppHeight);
})();

function renderAll() {
  renderHome();
  loadSettings();
  loadSyncCfg();
}

updateLayoutVars();

window.addEventListener('orientationchange', () => {
  setTimeout(() => { updateAppHeight(); updateLayoutVars(); }, 300);
});
renderAll();

const savedTab = sessionStorage.getItem('jp-active-tab');
if (savedTab) switchTab(savedTab);

const initData = loadData();
if (initData.activeTimer) switchTab('timer');

// 打开就先拉一次，别等到用户存了一条才发现别的设备上有新记录
if (syncOn()) doSync({ fresh: true });
</script>
</body>
</html>
