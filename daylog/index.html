<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Aside">
  <meta name="theme-color" content="#efeeea">
  <!-- 主题必须在首屏画之前定下来，否则会闪一下默认色 -->
  <script>
    try {
      var th = localStorage.getItem('daylog-theme');
      if (th && th !== 'mynd') {
        document.documentElement.setAttribute('data-theme', th);
        document.querySelector('meta[name="theme-color"]').setAttribute('content', th === 'blue' ? '#ffffff' : '#efeeea');
      }
    } catch (e) {}
  </script>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <title>Aside — 对话式记录</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    /* 配色参照 mynd：暖灰底 + 纯白气泡 + 墨绿高亮，无描边、大圆角 */
    :root {
      --accent:  #3d4f45;   /* 墨绿：今天的气泡、选中态、强调文字 */
      --accent2: #55685c;
      --accent-fg: #ffffff;
      --red:     #b4483c;
      --label:   #1a1a18;
      --label2:  #6b6b64;
      --label3:  #a3a29b;
      --fill:    #e7e6e1;
      --fill2:   #dedcd6;
      --bg:      #efeeea;   /* 页面底 */
      --bg2:     #ffffff;   /* 往日的气泡 / 输入框 / 筛选 chip / 圆按钮 */
      --card:    #ffffff;   /* 设置卡片 / 面板 / 操作表 */
      --bg-blur: rgba(239,238,234,0.92);   /* 顶栏和输入条的毛玻璃底 */
      --hl:      #f0dd7a;   /* 高光气泡 */
      --hl-fg:   #4a4126;
      --sep:     #e2e0da;
      --radius:  18px;
      --bubble-r: 20px;
      --app-h:   100dvh;
      --vv-top:  0px;
      --kb:      0px;
    }

    /* 备选配色：白底天蓝（参照 iMessage）——灰气泡在左，蓝气泡在右 */
    :root[data-theme="blue"] {
      --accent:  #1f8cf5;
      --accent2: #4aa3f7;
      --accent-fg: #ffffff;
      --red:     #e5484d;
      --label:   #000000;
      --label2:  #6e6e73;
      --label3:  #aeaeb2;
      --fill:    #e9e9eb;
      --fill2:   #dcdce0;
      --bg:      #ffffff;
      --bg2:     #e9e9eb;
      --card:    #ffffff;
      --bg-blur: rgba(255,255,255,0.9);
      --sep:     #e3e3e6;
      --hl:      #f4e361;
      --hl-fg:   #3d3608;
    }

    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: var(--label);
      -webkit-font-smoothing: antialiased;
    }

    /* 整个 App 装在一个固定高度的 flex 列里：header / chips / 滚动流 / 输入条
       高度取 visualViewport，键盘弹起时输入条自动跟着抬起（见底部 syncViewport） */
    .app {
      position: fixed; left: 0; right: 0;
      top: var(--vv-top); height: var(--app-h);
      display: flex; flex-direction: column;
    }

    /* ── Header ── */
    header {
      flex: none;
      background: var(--bg-blur);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      padding: 14px 20px 12px;
      padding-top: calc(env(safe-area-inset-top) + 14px);
    }
    .head-row { max-width: 430px; margin: 0 auto; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    header h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.6px; color: var(--label); }
    header p  { font-size: 12px; color: var(--label3); margin-top: 3px; letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }
    .icon-btn {
      flex: none; border: none; cursor: pointer; line-height: 0;
      width: 38px; height: 38px; border-radius: 50%;
      background: var(--bg2); color: var(--label);
      display: flex; align-items: center; justify-content: center;
    }
    .icon-btn:active { opacity: 0.6; }
    .head-btns { display: flex; gap: 8px; flex: none; }

    /* 多选模式的顶栏（仿「信息」：左全选 / 中计数 / 右取消） */
    .selbar { max-width: 430px; margin: 0 auto; display: none; align-items: center; justify-content: space-between; gap: 12px; min-height: 41px; }
    body.select .selbar { display: flex; }
    body.select .head-row { display: none; }
    .selbar-text {
      border: none; background: none; padding: 2px 0; cursor: pointer;
      font-family: inherit; font-size: 15px; font-weight: 700; color: var(--accent);
    }
    .selbar-text:active { opacity: 0.5; }
    .selbar-count { font-size: 15px; font-weight: 700; color: var(--label); }

    /* ── Filter chips ── */
    .filters {
      flex: none; background: var(--bg-blur);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      overflow-x: auto; -webkit-overflow-scrolling: touch;
    }
    .filters::-webkit-scrollbar { display: none; }
    .filters-inner { display: flex; gap: 8px; padding: 4px 16px 12px; width: max-content; min-width: 100%; }
    .fchip {
      flex: none; border: none; background: var(--bg2);
      color: var(--label2); border-radius: 999px; padding: 7px 14px;
      font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer;
      white-space: nowrap;
    }
    .fchip.active { background: var(--accent); color: var(--accent-fg); }
    .fchip:active { opacity: 0.75; }

    /* ── Stream ── */
    .stream-wrap { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .stream {
      max-width: 430px; margin: 0 auto;
      padding: 12px 16px 24px;
      display: flex; flex-direction: column; gap: 14px;
    }
    .daysep {
      align-self: center; margin: 10px 0 2px;
      color: var(--label3);
      font-size: 12px; font-weight: 600; letter-spacing: 0.04em;
    }
    .daysep:first-child { margin-top: 0; }

    /* 一行 = 左侧勾选圈（多选时才滑出）+ 记录本体 */
    .srow { display: flex; align-items: center; }
    .selcirc {
      flex: none; width: 0; opacity: 0; margin-right: 0; border: none; padding: 0;
      background: none; cursor: pointer; line-height: 0; color: var(--label3);
      transition: width 0.22s cubic-bezier(0.32,0.72,0,1), margin-right 0.22s, opacity 0.18s;
      overflow: hidden;
    }
    body.select .selcirc { width: 24px; margin-right: 12px; opacity: 1; }
    .selcirc .on  { display: none; }
    .selcirc.checked .off { display: none; }
    .selcirc.checked .on { display: block; color: var(--accent); }
    body.select .srow { cursor: pointer; }
    body.select .bubble, body.select .imgs img, body.select .tagchip { cursor: pointer; pointer-events: none; }
    body.select .srow.checked .bubble { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* 一条记录 = 气泡 + 气泡外下方的「标签 · 时间」 */
    .brow { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; max-width: 100%; }
    .brow.me { align-items: flex-end; }
    .bubble {
      max-width: 84%; padding: 12px 15px;
      background: var(--bg2); color: var(--label);
      border-radius: var(--bubble-r);
      cursor: pointer;
    }
    .brow.me .bubble { background: var(--accent); color: var(--accent-fg); }
    .bubble:active { opacity: 0.8; }

    /* 高光：整条气泡换成便签黄，左右两侧都盖掉 */
    .bubble.hl, .brow.me .bubble.hl { background: var(--hl); color: var(--hl-fg); }
    /* 摘抄：左边一道竖线 + 正文内缩，竖线用 currentColor 才能同时适配深底和白底 */
    .bubble.qt { position: relative; padding-left: 28px; }
    .bubble.qt::before {
      content: ''; position: absolute; left: 15px; top: 13px; bottom: 13px;
      width: 3px; border-radius: 2px; background: currentColor; opacity: 0.38;
    }
    /* 从置顶列表跳回来时闪一下 */
    @keyframes flash { 0%, 100% { box-shadow: 0 0 0 0 transparent; } 30%, 70% { box-shadow: 0 0 0 4px var(--accent2); } }
    .srow.flash .bubble { animation: flash 1.1s ease; }

    .pin-mark { flex: none; font-size: 15px; line-height: 1; opacity: 0.9; }

    /* 顶部置顶条（气球） */
    .pinbar {
      flex: none; display: none; align-items: center; justify-content: center; gap: 6px;
      padding: 0 16px 10px; background: var(--bg-blur);
      backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
      cursor: pointer;
    }
    .pinbar.on { display: flex; }
    body.select .pinbar { display: none; }
    .pinbar-pill {
      max-width: 100%; display: flex; align-items: center; gap: 6px;
      background: var(--fill); color: var(--label2);
      border-radius: 999px; padding: 6px 14px; font-size: 12.5px;
    }
    .pinbar-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pinbar-n { flex: none; color: var(--label3); }
    .pinbar:active .pinbar-pill { opacity: 0.6; }

    /* 置顶列表里的一行 */
    .pin-row { display: flex; align-items: flex-start; gap: 10px; padding: 12px 2px; border-bottom: 1px solid var(--sep); }
    .pin-row:last-child { border-bottom: none; }
    .pin-row-info { flex: 1; min-width: 0; cursor: pointer; }
    .pin-row-text { font-size: 14.5px; line-height: 1.5; color: var(--label); }
    .pin-row-meta { font-size: 11.5px; color: var(--label3); margin-top: 3px; }
    .pin-row-off {
      flex: none; border: none; background: none; color: var(--accent);
      font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; padding: 2px 0;
    }
    .pin-row-off:active { opacity: 0.5; }
    .btext { font-size: 15.5px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
    .bmeta {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 6px 0; font-size: 12px; color: var(--label3);
      font-variant-numeric: tabular-nums;
    }
    .tagchip { color: var(--label2); font-weight: 600; white-space: nowrap; }
    .tagchip:active { opacity: 0.5; }
    .empty { text-align: center; color: var(--label3); font-size: 14px; line-height: 1.7; padding: 60px 20px; }

    /* ── Composer ── */
    .composer {
      flex: none;
      background: var(--bg-blur);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      padding: 8px 16px 12px;
      padding-bottom: calc(env(safe-area-inset-bottom) * var(--sab-on, 1) + 12px);
    }
    .composer-inner { max-width: 430px; margin: 0 auto; display: flex; align-items: flex-end; gap: 10px; }

    /* 一次性提示：教「扫描文本」这个系统手势，关掉就不再出现 */
    .tip {
      max-width: 430px; margin: 0 auto 8px;
      display: none; align-items: center; gap: 8px;
      background: var(--fill); color: var(--label2);
      border-radius: 999px; padding: 8px 8px 8px 14px;
      font-size: 12.5px; line-height: 1.4;
    }
    .tip.on { display: flex; }
    body.select .tip { display: none; }
    .tip-text { flex: 1; min-width: 0; }
    .tip-x {
      flex: none; width: 24px; height: 24px; border-radius: 50%; border: none;
      background: none; color: var(--label3); cursor: pointer; font-family: inherit;
      font-size: 13px; line-height: 1; display: flex; align-items: center; justify-content: center;
    }
    .tip-x:active { opacity: 0.5; }
    /* 多选时输入条换成删除条 */
    body.select .composer-inner, body.select .attach-strip { display: none; }
    .selactions { max-width: 430px; margin: 0 auto; display: none; align-items: center; justify-content: space-between; gap: 12px; }
    body.select .selactions { display: flex; }
    .del-btn {
      border: none; border-radius: 999px; padding: 11px 20px; cursor: pointer;
      font-family: inherit; font-size: 15px; font-weight: 700;
      background: var(--red); color: #fff;
      display: flex; align-items: center; gap: 7px;
    }
    .del-btn:disabled { background: var(--fill2); color: var(--label3); }
    .del-btn:not(:disabled):active { opacity: 0.75; }
    .sel-hint { font-size: 13px; color: var(--label3); }
    #input {
      flex: 1; resize: none; border: none; background: var(--bg2);
      border-radius: 22px; padding: 12px 16px; font-size: 15.5px; line-height: 1.45;
      font-family: inherit; color: var(--label); outline: none;
      max-height: 120px;
    }
    #input::placeholder { color: var(--label3); }
    .send-btn {
      flex: none; width: 44px; height: 44px; border-radius: 50%; border: none;
      background: var(--accent); color: var(--accent-fg); cursor: pointer; line-height: 0;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, color 0.15s, transform 0.15s;
    }
    .send-btn:disabled { background: var(--bg2); color: var(--label3); }
    .send-btn:active:not(:disabled) { transform: scale(0.92); }
    .card-sub { font-size: 12px; color: var(--label3); }

    /* ── Toast ── */
    .toast {
      position: fixed; top: calc(env(safe-area-inset-top) + 60px);
      left: 50%; transform: translateX(-50%) translateY(-20px);
      background: var(--label); color: #fff; padding: 9px 14px 9px 18px;
      border-radius: 20px; font-size: 14px; font-weight: 600;
      opacity: 0; transition: all 0.25s cubic-bezier(0.32,0.72,0,1); z-index: 400;
      pointer-events: none; white-space: nowrap;
      display: flex; align-items: center; gap: 10px;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
    .toast-action {
      border: none; background: rgba(255,255,255,0.18); color: #fff;
      font-family: inherit; font-size: 13px; font-weight: 700;
      padding: 5px 11px; border-radius: 999px; cursor: pointer;
    }
    .toast-action:active { opacity: 0.6; }

    /* ── Bottom sheet ── */
    .overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.3);
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .overlay.open { opacity: 1; pointer-events: auto; }
    .sheet {
      position: fixed; left: 0; right: 0; bottom: var(--kb); z-index: 201;
      background: var(--card);
      border-radius: var(--radius) var(--radius) 0 0;
      padding: 18px 20px calc(env(safe-area-inset-bottom) * var(--sab-on, 1) + 20px);
      transform: translateY(110%); transition: transform 0.28s cubic-bezier(0.32,0.72,0,1);
      max-height: 84%; overflow-y: auto;
    }
    .sheet.open { transform: translateY(0); }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .sheet-title { font-size: 17px; font-weight: 700; }
    .sheet-done {
      border: none; background: none; color: var(--accent);
      font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; padding: 2px 0;
    }
    .sheet-done:active { opacity: 0.5; }

    /* ── Action sheet ── */
    .action-overlay {
      position: fixed; inset: 0; z-index: 300;
      background: rgba(0,0,0,0.25);
      display: flex; align-items: flex-end;
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .action-overlay.open { opacity: 1; pointer-events: auto; }
    .action-sheet {
      width: 100%; padding: 0 12px calc(env(safe-area-inset-bottom) * var(--sab-on, 1) + 12px);
      transform: translateY(110%); transition: transform 0.28s cubic-bezier(0.32,0.72,0,1);
      max-height: 90%; overflow-y: auto;
    }
    .action-overlay.open .action-sheet { transform: translateY(0); }
    .action-group {
      background: var(--card); border-radius: var(--radius);
      overflow: hidden; margin-bottom: 10px;
    }
    .action-title {
      padding: 12px 16px 10px; font-size: 13px; color: var(--label2);
      text-align: center; border-bottom: 1px solid var(--sep); line-height: 1.5;
    }
    .action-btn {
      width: 100%; padding: 15px; border: none; background: var(--card);
      font-size: 16px; font-family: inherit; color: var(--label); cursor: pointer;
      border-bottom: 1px solid var(--sep); display: flex; align-items: center; gap: 10px;
      justify-content: center;
    }
    .action-btn:last-child { border-bottom: none; }
    .action-btn:active { background: var(--fill); }
    .action-btn.danger { color: var(--red); }
    .action-btn.strong { font-weight: 700; }
    .action-check { color: var(--accent); font-weight: 800; }

    /* ── Cards (settings) ── */
    .card-label {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--label3); margin: 18px 2px 8px;
    }
    .card-label:first-of-type { margin-top: 0; }
    .card {
      background: var(--card); border-radius: var(--radius); overflow: hidden;
    }
    .row {
      display: flex; align-items: center; gap: 10px;
      padding: 13px 14px; border-bottom: 1px solid var(--sep);
    }
    .row:last-child { border-bottom: none; }
    .row-btn { width: 100%; border: none; background: var(--card); font-family: inherit;
      font-size: 15px; color: var(--accent); cursor: pointer; text-align: left; font-weight: 600; }
    .row-btn:active { background: var(--fill); }
    .row-btn.danger { color: var(--red); }
    .row-emoji { font-size: 20px; width: 26px; text-align: center; flex: none; }
    .row-info { flex: 1; min-width: 0; }
    .row-name { font-size: 15px; font-weight: 600; }
    .row-sub { font-size: 12px; color: var(--label3); margin-top: 2px; }
    .row-mini {
      flex: none; border: none; background: var(--fill);
      width: 30px; height: 30px; border-radius: 8px; color: var(--label2);
      font-size: 15px; font-family: inherit; cursor: pointer; line-height: 1;
    }
    .row-mini:disabled { color: var(--label3); opacity: 0.4; }
    .row-mini:active:not(:disabled) { background: var(--fill); }

    /* month nav */
    .month-nav { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; }
    .month-label { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .nav-btn {
      width: 30px; height: 30px; border-radius: 50%; border: none;
      background: var(--fill); color: var(--label2); font-size: 14px; cursor: pointer;
      font-family: inherit; line-height: 1;
    }
    .nav-btn:disabled { color: var(--label3); opacity: 0.4; }
    .nav-btn:active:not(:disabled) { background: var(--fill); }

    /* forms */
    .form-group { margin-bottom: 14px; }
    .form-label { font-size: 12px; font-weight: 600; color: var(--label2); margin-bottom: 6px; display: block; }
    .form-input, .form-area {
      width: 100%; padding: 10px 12px; border: 1.5px solid var(--sep);
      border-radius: 10px; font-size: 15px; font-family: inherit; color: var(--label);
      outline: none; transition: border-color 0.15s; background: var(--card);
    }
    .form-area { resize: vertical; min-height: 88px; line-height: 1.5; }
    .form-input:focus, .form-area:focus { border-color: var(--accent); }
    .form-row { display: flex; gap: 10px; }
    .form-hint { font-size: 11px; color: var(--label3); margin-top: 5px; line-height: 1.5; }
    .btn-primary {
      width: 100%; padding: 13px; border: none; border-radius: 12px;
      background: var(--accent); color: #fff; font-size: 15px; font-weight: 700;
      font-family: inherit; cursor: pointer; margin-top: 4px;
    }
    .btn-primary:active { opacity: 0.8; }
    .filename {
      margin-top: 10px; padding: 8px 12px; border-radius: 10px;
      background: var(--fill); color: var(--label2);
      font-size: 12.5px; text-align: center; word-break: break-all;
      font-variant-numeric: tabular-nums;
    }
    /* 「高级」折叠区：JSON 备份/恢复/清空都藏在这后面 */
    .adv { margin-top: 18px; }
    .adv > summary {
      list-style: none; cursor: pointer;
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--label3); padding: 4px 2px 8px;
    }
    .adv > summary::-webkit-details-marker { display: none; }
    .adv > summary::before { content: '▸ '; }
    .adv[open] > summary::before { content: '▾ '; }
    .adv > summary:active { opacity: 0.5; }
    /* ── 图片 ── */
    /* 展开就是一张张大图竖着排，不做宫格缩略图；宽高按原图比例，不裁不留黑边 */
    .imgs { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; align-items: flex-start; }
    .imgs:last-child { margin-bottom: 0; }
    .imgs img {
      display: block; width: auto; height: auto;
      max-width: 100%; max-height: 380px;
      border-radius: 12px; background: var(--fill);
    }

    /* 多张图默认合并成一叠（仿微信）：顶图后面透出两张卡的边 */
    .imgstack { position: relative; isolation: isolate; width: 168px; max-width: 100%; cursor: pointer; }
    /* 顶图后面透出两张卡的边；描一道 sep 线，白气泡里也看得见 */
    .imgstack::before, .imgstack::after {
      content: ''; position: absolute; top: 9px; bottom: 9px; z-index: 0;
      border-radius: 12px; background: var(--fill);
      box-shadow: 0 0 0 0.5px rgba(31,30,26,0.10), -2px 2px 6px rgba(31,30,26,0.14);
    }
    .imgstack::before { left: -13px; right: 13px; }
    .imgstack::after  { left: -6.5px; right: 6.5px; }
    .imgstack img {
      position: relative; z-index: 1; display: block; width: 100%;
      aspect-ratio: 4/3; object-fit: cover; border-radius: 12px;
      box-shadow: -2px 2px 6px rgba(31,30,26,0.14);
    }
    .imgstack:active { opacity: 0.85; }

    /* 气泡 + 旁边的「展开 N / 收起」灰药丸 */
    /* width:100% 是必须的：.bline 若是 shrink-to-fit，气泡的 max-width:84%
       会拿自己的内容宽去算百分比，结果气泡被越算越窄、文字乱折行 */
    .bline { display: flex; align-items: center; gap: 10px; width: 100%; }
    .brow.me .bline { justify-content: flex-end; }
    .brow:not(.me) .bline { flex-direction: row-reverse; justify-content: flex-end; }
    .expand-pill {
      flex: none; border: none; cursor: pointer; font-family: inherit;
      background: var(--fill); color: var(--label2);
      border-radius: 999px; padding: 6px 12px;
      font-size: 12.5px; font-weight: 600; white-space: nowrap;
    }
    .expand-pill:active { opacity: 0.6; }
    body.select .expand-pill { pointer-events: none; }

    /* 待发送的附件条 */
    .attach-strip { max-width: 430px; margin: 0 auto 8px; display: flex; gap: 8px; }
    .attach-thumb { position: relative; width: 62px; height: 62px; flex: none; }
    .attach-thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; display: block; }
    .attach-x {
      position: absolute; top: -6px; right: -6px; width: 22px; height: 22px;
      border-radius: 50%; border: 2px solid var(--bg); background: var(--label);
      color: #fff; font-size: 12px; line-height: 1; cursor: pointer;
      display: flex; align-items: center; justify-content: center; font-family: inherit;
    }
    .plus-btn {
      flex: none; width: 44px; height: 44px; border-radius: 50%; border: none;
      background: var(--bg2); color: var(--label); cursor: pointer; line-height: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .plus-btn:active { transform: scale(0.92); }
    .plus-btn:disabled { color: var(--label3); }
    /* 长按加号 = 读剪贴板，别让 iOS 弹出系统的长按浮层 */
    .plus-btn { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }

    /* 看大图 */
    .lightbox {
      position: fixed; inset: 0; z-index: 500; background: rgba(0,0,0,0.92);
      display: flex; align-items: center; justify-content: center; padding: 20px;
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .lightbox.open { opacity: 1; pointer-events: auto; }
    .lightbox img {
      max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px;
      -webkit-user-drag: none; user-select: none; pointer-events: none;   /* 让滑动落在灯箱上 */
    }
    .lb-count {
      position: absolute; left: 0; right: 0;
      top: calc(env(safe-area-inset-top) + 18px);
      text-align: center; color: rgba(255,255,255,0.85);
      font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums;
      pointer-events: none;
    }
    .lightbox-bar {
      position: absolute; left: 0; right: 0; bottom: 0;
      padding: 16px 20px calc(env(safe-area-inset-bottom) * var(--sab-on, 1) + 20px);
      display: flex; align-items: center; justify-content: space-between;
    }
    .lb-btn {
      border: none; background: rgba(255,255,255,0.16); color: #fff; cursor: pointer;
      border-radius: 999px; padding: 10px 18px; font-family: inherit; font-size: 15px; font-weight: 600;
      display: flex; align-items: center; gap: 7px;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    .lb-btn.danger { color: #ff6b5c; }
    .lb-btn:active { opacity: 0.6; }

    /* 配色选项：一块小色板，里面两颗气泡表示往日 / 今天 */
    .theme-row { cursor: pointer; }
    .theme-row:active { background: var(--fill); }
    .theme-swatch {
      flex: none; width: 44px; height: 34px; border-radius: 9px;
      box-shadow: inset 0 0 0 0.5px rgba(31,30,26,0.14);
      display: flex; flex-direction: column; justify-content: center; gap: 4px;
      padding: 0 5px; overflow: hidden;
    }
    .theme-swatch i { display: block; height: 8px; border-radius: 4px; }
    .theme-swatch i:first-child { width: 62%; align-self: flex-start; }
    .theme-swatch i:last-child  { width: 78%; align-self: flex-end; }

    .imgman { display: flex; flex-wrap: wrap; gap: 12px; padding: 14px 16px; justify-content: center; }
    .imgman .attach-x { border-color: var(--card); }

    .kw-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .kw-chip {
      border: 1px solid var(--sep); background: var(--card); color: var(--label2);
      border-radius: 999px; padding: 7px 13px; font-size: 14px;
      font-family: inherit; cursor: pointer;
    }
    .kw-chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    .hidden { display: none !important; }
  </style>
</head>

<script>
/* ═══════════════════ Constants & Utils ═══════════════════ */

const ENTRIES_KEY = 'daylog-entries';
const TAGS_KEY    = 'daylog-tags';

const DAY_LABELS = ['日', '一', '二', '三', '四', '五', '六'];

function pad(n) { return String(n).padStart(2, '0'); }
function dateKey(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function todayKey() { return dateKey(new Date()); }
function nowTime(d) { return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function loadJSON(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch { return fallback; }
}
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function cnDate(key) {
  const [y, m, d] = key.split('-').map(Number);
  return `${m}月${d}日 周${DAY_LABELS[new Date(y, m - 1, d).getDay()]}`;
}
function cnFullDate(key) {
  const [y, m, d] = key.split('-').map(Number);
  return `${y}年${m}月${d}日`;
}

/* ═══════════════════ Seed tags ═══════════════════ */

const SEED_TAGS = [
  {
    id: 'diet', name: '饮食', emoji: '🍚',
    pattern: '',
    keywords: ['吃', '喝', '早饭', '早餐', '午饭', '午餐', '晚饭', '晚餐', '夜宵', '加餐', '零食', '外卖', '食堂', '下馆子',
      '米饭', '面条', '面包', '馒头', '粥', '饺子', '沙拉', '西兰花', '青菜', '蔬菜', '水果', '苹果', '香蕉',
      '鸡蛋', '鸡胸', '牛肉', '猪肉', '鱼', '虾', '豆腐', '牛奶', '酸奶', '咖啡', '奶茶', '可乐', '啤酒', '喝水',
      '蛋白粉', '维生素', '卡路里', '热量', '糖', '油腻', '重口', '清淡', '撑', '吃饱', '很饱', '饿', '嘴馋',
      '消化', '胃', '肚子', '反酸', '胀气', '拉肚子']
  },
  {
    id: 'sport', name: '运动', emoji: '🏃',
    pattern: '',
    keywords: ['跑步', '跑了', '慢跑', '快走', '走路', '步数', '健身', '举铁', '力量训练', '有氧', '无氧',
      '深蹲', '硬拉', '卧推', '引体', '俯卧撑', '平板支撑', '划船机', '椭圆机', '跑步机', '哑铃', '杠铃',
      '瑜伽', '普拉提', '拉伸', '游泳', '骑车', '骑行', '爬山', '徒步', '打球', '篮球', '羽毛球', '网球',
      '公里', '配速', '心率', '组数', '训练', '锻炼', '出汗', '酸痛', '肌肉', '腿酸', '腰酸', '累瘫', '热身']
  },
  {
    id: 'todo', name: '待办', emoji: '✅',
    pattern: '',
    keywords: ['要买', '记得', '别忘', '待办', 'todo', '预约', '挂号', '下单', '续费', '缴费', '还书', '提醒',
      '明天要', '得去', '需要去', '安排一下', '回头', '有空', '截止', 'deadline', '交表', '报名']
  },
  {
    id: 'idea', name: '念头', emoji: '💭',
    pattern: '',
    // 别放「如果 / 其实 / 为什么 / 反正」这类连接词——太常见，会把普通叙述和整页书都吸过来
    keywords: ['突然想到', '忽然想', '在想', '一直在想', '念头', '灵感', '好像明白', '意识到', '发现自己',
      '说不定', '感觉自己', '有点想', '要不要', '值不值得',
      '纠结', '犹豫', '困惑', '想不通', '想通了', '突然觉得', '一个想法']
  },
  {
    // 形态规则优先级高于所有关键词打分，所以摘抄排在后面也照样先命中引号句
    id: 'quote', name: '摘抄', emoji: '📖',
    pattern: '[“”「」『』《》]|^\\s*>|——\\s*\\S',
    keywords: ['书里', '读到', '看到一句', '这句话', '作者', '原文', '引用', '金句', '摘抄', '书中', '写道', '说过']
  },
  { id: 'other', name: '其他', emoji: '📝', pattern: '', keywords: [], fallback: true }
];

/* ═══════════════════ State ═══════════════════ */

let entries = loadJSON(ENTRIES_KEY, null);
let tags    = loadJSON(TAGS_KEY, null);
let activeFilter = 'all';

if (!tags || !tags.length) { tags = JSON.parse(JSON.stringify(SEED_TAGS)); }
if (!entries) { entries = []; }
if (!tags.some(t => t.fallback)) { tags[tags.length - 1].fallback = true; }

/* 一次性迁移：SEED_TAGS 只对全新安装生效，已写进 localStorage 的标签得单独补。
   v1 曾经漏掉写回，重排下次刷新就丢了；这里 v2 一并补齐并落盘。
   只动「有没有」和「顺序」，不碰任何标签的 name/emoji/keywords/pattern。 */
const MIG_KEY = 'daylog-migration';
if (Number(localStorage.getItem(MIG_KEY) || 0) < 2) {
  if (!tags.some(t => t.id === 'idea')) tags.push(JSON.parse(JSON.stringify(SEED_TAGS.find(t => t.id === 'idea'))));
  const order = ['diet', 'sport', 'todo', 'idea', 'quote', 'other'];
  tags = tags
    .map((t, i) => ({ t, i, k: order.indexOf(t.id) }))
    .sort((a, b) => {
      if (a.k < 0 && b.k < 0) return a.i - b.i;   // 自定义标签之间保持原相对顺序
      if (a.k < 0) return -1;                     // 自定义标签排在种子标签之前
      if (b.k < 0) return 1;
      return a.k - b.k;
    })
    .map(x => x.t);
  localStorage.setItem(TAGS_KEY, JSON.stringify(tags));
  localStorage.setItem(MIG_KEY, '2');
}

/* v3：v2 发出去的「念头」词表里混了「如果 / 其实 / 为什么 / 也许 / 或许 / 反正 / 算了 /
   大概是因为 / 想到」这些连接词，太常见会乱吃。只在用户没动过词表时才换掉。 */
if (Number(localStorage.getItem(MIG_KEY) || 0) < 3) {
  const shipped = ['突然想到', '忽然想', '想到', '在想', '一直在想', '念头', '灵感', '好像明白', '意识到', '发现自己',
    '为什么', '也许', '或许', '大概是因为', '其实', '说不定', '感觉自己', '有点想', '要不要', '值不值得',
    '纠结', '犹豫', '困惑', '想不通', '想通了', '反正', '算了', '突然觉得', '一个想法', '如果'];
  const idea = tags.find(t => t.id === 'idea');
  if (idea && idea.keywords.length === shipped.length && idea.keywords.every((w, i) => w === shipped[i])) {
    idea.keywords = SEED_TAGS.find(t => t.id === 'idea').keywords.slice();
    localStorage.setItem(TAGS_KEY, JSON.stringify(tags));
  }
  localStorage.setItem(MIG_KEY, '3');
}

function saveEntries() { localStorage.setItem(ENTRIES_KEY, JSON.stringify(entries)); }
function saveTags()    { localStorage.setItem(TAGS_KEY, JSON.stringify(tags)); }

function tagById(id) { return tags.find(t => t.id === id) || fallbackTag(); }
function fallbackTag() { return tags.find(t => t.fallback) || tags[tags.length - 1]; }
function entryById(id) { return entries.find(e => e.id === id); }

/* ═══════════════════ 图片：IndexedDB（localStorage 只有 5MB，存不下几张） ═══════════════════ */

const MAX_IMGS = 4;        // 一条记录最多几张
const IMG_MAX_SIDE = 1280; // 长边上限
const IMG_QUALITY = 0.72;

let dbPromise = null;
function db() {
  if (!dbPromise) {
    dbPromise = new Promise((res, rej) => {
      const r = indexedDB.open('daylog', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('images', { keyPath: 'id' });
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }
  return dbPromise;
}
function idbRun(mode, fn) {
  return db().then(d => new Promise((res, rej) => {
    const tx = d.transaction('images', mode);
    const req = fn(tx.objectStore('images'));
    tx.onerror = () => rej(tx.error);
    tx.oncomplete = () => res(req && req.result);
  }));
}
const putImage = rec  => idbRun('readwrite', s => s.put(rec));
const delImage = id   => idbRun('readwrite', s => s.delete(id));
const readImage = id  => idbRun('readonly',  s => s.get(id));
const allImages = ()  => idbRun('readonly',  s => s.getAll());

// 渲染用的小缓存，避免每次重渲染都读一遍 IDB
const imgCache = new Map();
const IMG_CACHE_MAX = 60;
function cacheImg(id, url) {
  imgCache.set(id, url);
  if (imgCache.size > IMG_CACHE_MAX) imgCache.delete(imgCache.keys().next().value);
}
async function imgURL(id) {
  if (imgCache.has(id)) return imgCache.get(id);
  const rec = await readImage(id);
  if (!rec) return null;
  cacheImg(id, rec.data);
  return rec.data;
}

// 压到长边 1280 的 JPEG，原图动辄 3~5MB，存下来会撑爆配额
async function shrinkToDataURL(blob) {
  let bmp;
  try { bmp = await createImageBitmap(blob, { imageOrientation: 'from-image' }); }
  catch { bmp = await createImageBitmap(blob); }
  const scale = Math.min(1, IMG_MAX_SIDE / Math.max(bmp.width, bmp.height));
  const w = Math.max(1, Math.round(bmp.width * scale));
  const h = Math.max(1, Math.round(bmp.height * scale));
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  c.getContext('2d').drawImage(bmp, 0, 0, w, h);
  bmp.close && bmp.close();
  return c.toDataURL('image/jpeg', IMG_QUALITY);
}

/* ═══════════════════ Auto tagging ═══════════════════ */

function suggestTag(text) {
  // 第一优先：形态规则（摘抄用引号/引用符/出处标记触发）
  for (const tag of tags) {
    if (!tag.pattern) continue;
    try { if (new RegExp(tag.pattern, 'm').test(text)) return tag; }
    catch { /* 规则写错就跳过，不影响记录 */ }
  }
  // 第二优先：关键词打分，长词权重更高（「深蹲」> 「动」）
  const t = text.toLowerCase();
  let best = null, bestScore = 0;
  for (const tag of tags) {
    let score = 0;
    for (const kw of tag.keywords) {
      if (kw && t.includes(String(kw).toLowerCase())) score += kw.length;
    }
    if (score > bestScore) { bestScore = score; best = tag; }
  }
  return best || fallbackTag();
}

// 从文本里抽 2~3 字的中文候选词：没有分词库，就用 n-gram + 虚词过滤，宁可少给也不刷屏
const STOP_CHARS = new Set('的是了在有我你他她它这那都很就也还又和与把被给对从到过来去做让说着得地以及或但而没能会要不太么呢吧啊今天'.split(''));
function candidateWords(text) {
  const known = new Set();
  tags.forEach(t => t.keywords.forEach(k => known.add(String(k).toLowerCase())));
  const runs = text.match(/[一-龥]{2,}/g) || [];
  const out = [];
  const seen = new Set();
  for (const len of [3, 2]) {
    for (const run of runs) {
      for (let i = 0; i + len <= run.length; i++) {
        const w = run.slice(i, i + len);
        if (seen.has(w) || known.has(w)) continue;
        if ([...w].some(c => STOP_CHARS.has(c))) continue;
        seen.add(w);
        out.push(w);
      }
    }
  }
  return out.slice(0, 20);
}

/* ═══════════════════ Render ═══════════════════ */

function visibleEntries() {
  const list = activeFilter === 'all' ? entries : entries.filter(e => e.tagId === activeFilter);
  return list.slice().sort((a, b) => a.ts - b.ts);
}

function renderHeader() {
  const n = entries.length;
  const suffix = activeFilter === 'all' ? `共 ${n} 条` : `${tagById(activeFilter).name} ${visibleEntries().length} 条 / 共 ${n} 条`;
  document.getElementById('subtitle').textContent = `${cnFullDate(todayKey())} · ${suffix}`;
}

function renderFilters() {
  const counts = {};
  entries.forEach(e => { counts[e.tagId] = (counts[e.tagId] || 0) + 1; });
  let html = `<button class="fchip ${activeFilter === 'all' ? 'active' : ''}" onclick="setFilter('all')">全部 ${entries.length}</button>`;
  tags.forEach(t => {
    html += `<button class="fchip ${activeFilter === t.id ? 'active' : ''}" onclick="setFilter('${t.id}')">${esc(t.emoji)} ${esc(t.name)} ${counts[t.id] || 0}</button>`;
  });
  document.getElementById('filters').innerHTML = html;
}

function setFilter(id) {
  activeFilter = id;
  // 切筛选时清空勾选，免得删掉屏幕上看不见的记录
  if (selectMode) { selected.clear(); renderSelBar(); }
  renderFilters();
  renderHeader();
  renderStream();
  scrollToBottom(false);
}

function renderStream() {
  const list = visibleEntries();
  const el = document.getElementById('stream');
  if (!list.length) {
    el.innerHTML = entries.length
      ? `<div class="empty">这个标签下还没有记录</div>`
      : `<div class="empty">记点什么吧<br>吃了什么、动了多久、身体什么感觉</div>`;
    return;
  }
  const today = todayKey();
  let html = '';
  let lastDate = null;
  list.forEach(e => {
    if (e.date !== lastDate) {
      lastDate = e.date;
      html += `<div class="daysep">${e.date === today ? '今天' : esc(cnDate(e.date))}</div>`;
    }
    const t = tagById(e.tagId);
    const imgs = e.imgs || [];
    const on = selected.has(e.id);
    const stacked = imgs.length >= 2 && !expandedImgs.has(e.id);   // 多张默认叠起来
    const stop = `onpointerdown="event.stopPropagation()" onpointerup="event.stopPropagation()"`;
    let imgHtml = '';
    if (stacked) {
      imgHtml = `<div class="imgstack" ${stop} onclick="event.stopPropagation(); toggleImgs('${e.id}')">
                   <img data-img="${imgs[0]}" alt="">
                 </div>`;
    } else if (imgs.length) {
      imgHtml = `<div class="imgs n${imgs.length}" ${stop}>
                   ${imgs.map(id => `<img data-img="${id}" alt="" onclick="event.stopPropagation(); openLightbox('${e.id}','${id}')">`).join('')}
                 </div>`;
    }
    const pill = imgs.length >= 2
      ? `<button class="expand-pill" onclick="event.stopPropagation(); toggleImgs('${e.id}')">${stacked ? `展开 ${imgs.length}` : '收起'}</button>`
      : '';
    html += `
      <div class="srow ${on ? 'checked' : ''}" data-id="${e.id}" onclick="rowClick(event, '${e.id}')">
        <button class="selcirc ${on ? 'checked' : ''}" tabindex="-1" aria-label="选择">
          <svg class="off" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9.5"></circle></svg>
          <svg class="on" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"></circle><polyline points="7.6 12.3 10.7 15.3 16.4 9.2" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></polyline></svg>
        </button>
        <div class="brow ${e.date === today ? 'me' : ''}">
          <div class="bline">
            ${e.pin ? '<span class="pin-mark">📌</span>' : ''}
            ${pill}
            <div class="bubble ${e.hl ? 'hl' : ''} ${e.qt ? 'qt' : ''}"
                 onpointerdown="bubbleDown('${e.id}')" onpointerup="bubbleUp('${e.id}')" onpointercancel="bubbleCancel()">
              ${imgHtml}
              ${e.text ? `<div class="btext">${esc(e.text)}</div>` : ''}
            </div>
          </div>
          <div class="bmeta">
            <span class="tagchip" onclick="event.stopPropagation(); openTagPicker('${e.id}')">${esc(t.emoji)} ${esc(t.name)}</span>
            <span>·</span>
            <span class="btime">${esc(e.time)}</span>
          </div>
        </div>
      </div>`;
  });
  el.innerHTML = html;
  hydrateImages();
}

// 「展开 N / 收起」——只是视图状态，不写进 localStorage，刷新后重新叠起来
const expandedImgs = new Set();
function toggleImgs(id) {
  if (selectMode) return;
  const opening = !expandedImgs.has(id);
  if (opening) expandedImgs.add(id); else expandedImgs.delete(id);
  renderStream();
  // 展开后变高，别把这条顶出屏幕
  if (opening) {
    const row = document.querySelector(`.srow[data-id="${id}"]`);
    if (row) row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
}

// innerHTML 里的 <img> 先不带 src，渲染完再异步从 IDB 灌进去
function hydrateImages() {
  document.querySelectorAll('#stream img[data-img]').forEach(async el => {
    const url = await imgURL(el.dataset.img);
    if (url) el.src = url; else el.remove();
  });
}

/* 灯箱：整条记录的图都在里面，可以左右滑 */
let lbEntry = null, lbList = [], lbIndex = 0;

function openLightbox(entryId, imgId) {
  if (selectMode) return;
  const e = entryById(entryId);
  if (!e) return;
  lbEntry = entryId;
  lbList = (e.imgs || []).slice();
  lbIndex = Math.max(0, lbList.indexOf(imgId));
  showLightboxImage();
}

function showLightboxImage() {
  const id = lbList[lbIndex];
  if (!id) { closeLightbox(); return; }
  imgURL(id).then(url => {
    if (!url) return;
    document.getElementById('lightbox-img').src = url;
    document.getElementById('lb-count').textContent = lbList.length > 1 ? `${lbIndex + 1} / ${lbList.length}` : '';
    document.getElementById('lightbox').classList.add('open');
  });
}

function lbGo(delta) {
  if (lbList.length < 2) return;
  lbIndex = (lbIndex + delta + lbList.length) % lbList.length;   // 到头绕回去
  showLightboxImage();
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
  lbEntry = null; lbList = []; lbIndex = 0;
}

function deleteCurrentImage() {
  const imgId = lbList[lbIndex];
  if (!imgId) return;
  const emptied = removeImageFromEntry(lbEntry, imgId);
  lbList.splice(lbIndex, 1);
  // 还有剩的就停在灯箱里看下一张，别把人踢出去
  if (emptied || !lbList.length) { closeLightbox(); return; }
  if (lbIndex >= lbList.length) lbIndex = lbList.length - 1;
  showLightboxImage();
}

/* 左右滑动翻页：滑动了就不当成「点空白关闭」 */
(() => {
  const lb = document.getElementById('lightbox');
  let startX = null, swiped = false;
  lb.addEventListener('pointerdown', e => { startX = e.clientX; swiped = false; });
  lb.addEventListener('pointerup', e => {
    if (startX === null) return;
    const dx = e.clientX - startX;
    startX = null;
    if (Math.abs(dx) > 45) { swiped = true; lbGo(dx < 0 ? 1 : -1); }
  });
  lb.addEventListener('pointercancel', () => { startX = null; });
  lb.addEventListener('click', e => {
    if (swiped) { swiped = false; return; }
    if (e.target.closest('.lightbox-bar')) return;
    closeLightbox();
  });
  document.addEventListener('keydown', e => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'ArrowLeft') lbGo(-1);
    else if (e.key === 'ArrowRight') lbGo(1);
    else if (e.key === 'Escape') closeLightbox();
  });
})();

// 返回 true 表示这条记录被整条收掉了（图删光且没有文字）
function removeImageFromEntry(entryId, imgId) {
  const e = entryById(entryId);
  if (!e) return false;
  e.imgs = (e.imgs || []).filter(x => x !== imgId);
  imgCache.delete(imgId);
  delImage(imgId).catch(() => {});
  const emptied = !e.text && !e.imgs.length;
  if (emptied) purgeEntries([entryId]); else saveEntries();
  renderAll();
  showToast(emptied ? '图片和这条记录都删了' : '已删除这张图');
  return emptied;
}

// 一条记录里多张图时，逐张删太慢，给个管理面板
function openImageManager(id) {
  const e = entryById(id);
  if (!e || !(e.imgs || []).length) return;
  openAction(`
    <div class="action-group">
      <div class="action-title">点 ✕ 删掉不要的图</div>
      <div class="imgman" id="imgman">${e.imgs.map(imgId => `
        <div class="attach-thumb">
          <img data-mimg="${imgId}" alt="">
          <button class="attach-x" onclick="deleteEntryImage('${id}','${imgId}')" aria-label="删除这张">✕</button>
        </div>`).join('')}</div>
    </div>
    <div class="action-group">
      <button class="action-btn strong" onclick="forceCloseAction()">完成</button>
    </div>`);
  document.querySelectorAll('#imgman img[data-mimg]').forEach(async el => {
    const url = await imgURL(el.dataset.mimg);
    if (url) el.src = url;
  });
}

function deleteEntryImage(entryId, imgId) {
  const emptied = removeImageFromEntry(entryId, imgId);
  const e = entryById(entryId);
  if (emptied || !e || !(e.imgs || []).length) forceCloseAction();
  else openImageManager(entryId);       // 还有剩的就原地刷新面板
}

function scrollToBottom(smooth) {
  const w = document.getElementById('stream-wrap');
  w.scrollTo({ top: w.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
}

function renderAll() {
  renderHeader(); renderFilters(); renderPinBar(); renderStream();
  if (selectMode) {
    selected.forEach(id => { if (!entryById(id)) selected.delete(id); });   // 删掉的别留在选区里
    if (!entries.length) exitSelect(); else renderSelBar();
  }
}

/* ═══════════════════ Compose ═══════════════════ */

let pendingImgs = [];   // 待发送的图片 dataURL

/* 一次插进来 40 字以上，只可能是扫描或粘贴，打字打不出这个量。
   用它来给「摘抄」加一票，并提示可以整理 OCR 的硬断行。 */
const BULK_MIN = 40;
let lastInputLen = 0;
let bulkInserted = false;

function onInput() {
  const ta = document.getElementById('input');
  const added = ta.value.length - lastInputLen;
  lastInputLen = ta.value.length;
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
  document.getElementById('send-btn').disabled = !ta.value.trim() && !pendingImgs.length;
  document.getElementById('plus-btn').disabled = pendingImgs.length >= MAX_IMGS;
  if (added >= BULK_MIN) {
    bulkInserted = true;
    // OCR 按印刷行断句，一段话会变成七八行硬回车
    if (countLines(ta.value) >= 2) showToast(`扫到 ${added} 字`, '整理断行', tidyComposer);
  }
}

function countLines(s) { return (s.match(/\n/g) || []).length; }

function tidyComposer() {
  const ta = document.getElementById('input');
  ta.value = tidyLineBreaks(ta.value);
  lastInputLen = ta.value.length;
  onInput();
  ta.focus();
}

/* 把 OCR 的硬断行接回段落。保守：句末标点后的换行、空行（段落分隔）都留着，
   只合并明显是「一行没写完被折走」的那种。 */
const TERMINAL = /[。！？…”」』.!?]$/;
const CONTINUES = /^[，。！？；：、）」』”…,.!?;:)]/;
function tidyLineBreaks(text) {
  const lines = text.split('\n').map(l => l.trim());
  const out = [];
  for (const line of lines) {
    if (!out.length || line === '' || out[out.length - 1] === '') { out.push(line); continue; }
    const prev = out[out.length - 1];
    // 下一行以「，」这类标点开头，一定是被折走的下半句，即使上一行看着已经收尾
    const join = CONTINUES.test(line) || !TERMINAL.test(prev);
    if (!join) { out.push(line); continue; }
    let a = prev;
    if (/[A-Za-z]-$/.test(a) && /^[a-z]/.test(line)) a = a.slice(0, -1);          // 英文连字符断词
    else if (/[A-Za-z0-9]$/.test(a) && /^[A-Za-z0-9]/.test(line)) a += ' ';       // 英文词之间补空格
    out[out.length - 1] = a + line;
  }
  return out.join('\n').replace(/\n{3,}/g, '\n\n').trim();
}

function renderAttachStrip() {
  const strip = document.getElementById('attach-strip');
  strip.classList.toggle('hidden', !pendingImgs.length);
  strip.innerHTML = pendingImgs.map((url, i) => `
    <div class="attach-thumb">
      <img src="${url}" alt="">
      <button class="attach-x" onclick="removePending(${i})" aria-label="移除">✕</button>
    </div>`).join('');
  onInput();
}
function removePending(i) { pendingImgs.splice(i, 1); renderAttachStrip(); }

/* 加号：轻点 = 直接开图片选择器（iOS 会自己弹「照片图库 / 拍照 / 选取文件」，
   这层是 WebKit 固定行为，网页绕不过去，所以不再叠自己的菜单）；
   长按 = 读剪贴板——iOS 上没法往 textarea 里 ⌘V，留个不占界面的入口。 */
let plusTimer = null, plusFired = false;
function plusDown() {
  plusFired = false;
  clearTimeout(plusTimer);
  if (document.getElementById('plus-btn').disabled) return;
  plusTimer = setTimeout(() => { plusFired = true; pasteImage(); }, 550);
}
function plusCancel() { clearTimeout(plusTimer); }
function plusClick() {
  if (plusFired) { plusFired = false; return; }   // 刚才长按已经处理过了
  if (pendingImgs.length >= MAX_IMGS) { showToast(`最多 ${MAX_IMGS} 张`); return; }
  pickFiles();
}

function pickFiles() {
  document.getElementById('pick-file').click();
}

async function onPickFiles(ev) {
  const files = [...ev.target.files].filter(f => f.type.startsWith('image/'));
  ev.target.value = '';
  await attachBlobs(files);
}

async function pasteImage() {
  if (!navigator.clipboard || !navigator.clipboard.read) { showToast('这个浏览器读不了剪贴板'); return; }
  try {
    const items = await navigator.clipboard.read();
    const blobs = [];
    for (const it of items) {
      const type = it.types.find(t => t.startsWith('image/'));
      if (type) blobs.push(await it.getType(type));
    }
    if (!blobs.length) { showToast('剪贴板里没有图片'); return; }
    await attachBlobs(blobs);
  } catch (err) {
    showToast(err && err.name === 'NotAllowedError' ? '没有剪贴板权限' : '读剪贴板失败');
  }
}

async function attachBlobs(blobs) {
  const room = MAX_IMGS - pendingImgs.length;
  if (room <= 0) { showToast(`最多 ${MAX_IMGS} 张`); return; }
  const take = blobs.slice(0, room);
  for (const b of take) {
    try { pendingImgs.push(await shrinkToDataURL(b)); }
    catch { showToast('这张图读不了'); }
  }
  renderAttachStrip();
  if (blobs.length > room) showToast(`最多 ${MAX_IMGS} 张，多的没加`);
}

// 桌面端直接往输入框里粘贴图片
document.getElementById('input').addEventListener('paste', e => {
  const files = [...(e.clipboardData ? e.clipboardData.files : [])].filter(f => f.type.startsWith('image/'));
  if (!files.length) return;
  e.preventDefault();
  attachBlobs(files);
});

async function addEntry() {
  const ta = document.getElementById('input');
  const text = ta.value.trim();
  if (!text && !pendingImgs.length) return;
  const d = new Date();
  let tag = suggestTag(text);            // 纯图片没有文字信号，自然落到兜底的「其他」
  // 扫/粘进来的整段文字，本来要掉进「其他」的才改判摘抄；有饮食运动信号的不抢
  if (bulkInserted && tag.fallback && text.length >= BULK_MIN) tag = tagById('quote') || tag;

  const imgIds = [];
  for (const data of pendingImgs) {
    const id = genId();
    try { await putImage({ id, data, ts: d.getTime() }); imgIds.push(id); }
    catch { showToast('图片存不下了（空间不足）'); }
  }

  entries.push({ id: genId(), ts: d.getTime(), date: dateKey(d), time: nowTime(d), text, tagId: tag.id, auto: true, imgs: imgIds });
  saveEntries();
  ta.value = '';
  pendingImgs = [];
  bulkInserted = false;
  renderAttachStrip();
  if (activeFilter !== 'all' && activeFilter !== tag.id) activeFilter = 'all';
  renderAll();
  scrollToBottom(true);
}

document.getElementById('input').addEventListener('keydown', e => {
  // 桌面端回车即记录（Shift+Enter 换行）；手机端一律用发送按钮
  if (e.key === 'Enter' && !e.shiftKey && window.matchMedia('(pointer: fine)').matches) {
    e.preventDefault();
    addEntry();
  }
});

/* ═══════════════════ Toast ═══════════════════ */

let toastTimer = null;
function showToast(msg, actionLabel, onAction) {
  const el = document.getElementById('toast');
  el.innerHTML = `<span>${esc(msg)}</span>`;
  if (actionLabel) {
    const btn = document.createElement('button');
    btn.className = 'toast-action';
    btn.textContent = actionLabel;
    btn.onclick = () => { hideToast(); onAction(); };
    el.appendChild(btn);
  }
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, actionLabel ? 4000 : 1600);
}
function hideToast() { document.getElementById('toast').classList.remove('show'); }

/* ═══════════════════ Action sheet ═══════════════════ */

function openAction(html) {
  document.getElementById('action-sheet').innerHTML = html;
  document.getElementById('action-overlay').classList.add('open');
}
function closeAction(e) {
  if (e && e.target.closest('.action-group')) return;
  document.getElementById('action-overlay').classList.remove('open');
}
function forceCloseAction() { document.getElementById('action-overlay').classList.remove('open'); }

/* 长按气泡 → 操作；轻点气泡 → 也开操作（气泡本身没有别的动作） */
let longPressTimer = null;
function bubbleDown(id) {
  if (selectMode) return;
  longPressTimer = setTimeout(() => { longPressTimer = 'fired'; openEntryAction(id); }, 500);
}
function bubbleUp(id) {
  if (selectMode) return;
  if (longPressTimer === 'fired') { longPressTimer = null; return; }
  clearTimeout(longPressTimer);
  longPressTimer = null;
  openEntryAction(id);
}
function bubbleCancel() { clearTimeout(longPressTimer); longPressTimer = null; }

function openEntryAction(id) {
  const e = entryById(id);
  if (!e) return;
  const nImg = (e.imgs || []).length;
  const preview = e.text
    ? (e.text.length > 28 ? e.text.slice(0, 28) + '…' : e.text)
    : `${nImg} 张图片`;
  openAction(`
    <div class="action-group">
      <div class="action-title">${esc(e.date)} ${esc(e.time)}<br>${esc(preview)}</div>
      <button class="action-btn" onclick="toggleMark('${id}','hl')">${e.hl ? '取消高光' : '🖍 高光'}</button>
      <button class="action-btn" onclick="toggleMark('${id}','qt')">${e.qt ? '取消摘抄格式' : '“ 摘抄'}</button>
      <button class="action-btn" onclick="toggleMark('${id}','pin')">${e.pin ? '取消置顶' : '📌 置顶'}</button>
      <button class="action-btn" onclick="forceCloseAction(); openEditText('${id}')">编辑文本</button>
      ${countLines(e.text) >= 2 ? `<button class="action-btn" onclick="forceCloseAction(); tidyEntry('${id}')">整理断行</button>` : ''}
      <button class="action-btn" onclick="forceCloseAction(); openTagPicker('${id}')">改标签</button>
      ${nImg ? `<button class="action-btn" onclick="forceCloseAction(); openImageManager('${id}')">管理图片（${nImg} 张）</button>` : ''}
      <button class="action-btn" onclick="forceCloseAction(); enterSelect('${id}')">选择多条…</button>
      <button class="action-btn danger" onclick="deleteEntry('${id}')">删除这条</button>
    </div>
    <div class="action-group">
      <button class="action-btn strong" onclick="forceCloseAction()">取消</button>
    </div>`);
}

/* ═══════════════════ 高光 / 摘抄 / 置顶 ═══════════════════ */

// pin 存的是置顶时刻，多条置顶时按它排序（后置顶的在上面）
function toggleMark(id, kind) {
  const e = entryById(id);
  if (!e) return;
  forceCloseAction();
  const on = !e[kind];
  if (kind === 'pin') e.pin = on ? Date.now() : 0;
  else e[kind] = on;
  // 摘抄样式和「摘抄」标签一起走，导出和筛选才对得上
  if (kind === 'qt' && on && tags.some(t => t.id === 'quote')) { e.tagId = 'quote'; e.auto = false; }
  saveEntries();
  renderAll();
  showToast(on ? { hl: '已高光', qt: '已排成摘抄', pin: '已置顶' }[kind]
               : { hl: '已取消高光', qt: '已取消摘抄格式', pin: '已取消置顶' }[kind]);
}

function pinnedEntries() {
  return entries.filter(e => e.pin).sort((a, b) => b.pin - a.pin);
}

function renderPinBar() {
  const bar = document.getElementById('pinbar');
  const list = pinnedEntries();
  bar.classList.toggle('on', list.length > 0);
  if (!list.length) { bar.innerHTML = ''; return; }
  const top = list[0];
  const txt = top.text || `${(top.imgs || []).length} 张图片`;
  bar.innerHTML = `<div class="pinbar-pill">
      <span>📌</span>
      <span class="pinbar-text">${esc(txt.replace(/\n/g, ' '))}</span>
      ${list.length > 1 ? `<span class="pinbar-n">· ${list.length} 条</span>` : ''}
    </div>`;
}

function openPinned() {
  const list = pinnedEntries();
  if (!list.length) return;
  const rows = list.map(e => {
    const txt = e.text || `${(e.imgs || []).length} 张图片`;
    return `<div class="pin-row">
        <div class="pin-row-info" onclick="jumpToEntry('${e.id}')">
          <div class="pin-row-text">${esc(txt.length > 60 ? txt.slice(0, 60) + '…' : txt)}</div>
          <div class="pin-row-meta">${esc(cnDate(e.date))} ${esc(e.time)} · ${esc(tagById(e.tagId).name)}</div>
        </div>
        <button class="pin-row-off" onclick="unpinFromList('${e.id}')">取消</button>
      </div>`;
  }).join('');
  openForm(`置顶 ${list.length} 条`, `<div id="pin-list">${rows}</div>
    <div class="form-hint" style="margin-top:10px">点条目回到它在时间线里的位置。</div>`, '完成');
}

function unpinFromList(id) {
  const e = entryById(id);
  if (!e) return;
  e.pin = 0;
  saveEntries();
  renderAll();
  if (pinnedEntries().length) openPinned(); else closeForm();
}

function jumpToEntry(id) {
  const e = entryById(id);
  if (!e) return;
  closeForm();
  if (activeFilter !== 'all' && activeFilter !== e.tagId) { activeFilter = 'all'; renderFilters(); renderStream(); }
  const row = document.querySelector(`.srow[data-id="${id}"]`);
  if (!row) return;
  row.scrollIntoView({ block: 'center', behavior: 'smooth' });
  row.classList.remove('flash');
  void row.offsetWidth;               // 重启动画
  row.classList.add('flash');
  setTimeout(() => row.classList.remove('flash'), 1400);
}

// 删记录的唯一出口：顺手把它挂的图从 IDB 清掉，别留孤儿
function purgeEntries(ids) {
  const set = new Set(ids);
  entries.forEach(e => {
    if (!set.has(e.id)) return;
    (e.imgs || []).forEach(imgId => { imgCache.delete(imgId); delImage(imgId).catch(() => {}); });
  });
  entries = entries.filter(e => !set.has(e.id));
  saveEntries();
}

function deleteEntry(id) {
  purgeEntries([id]);
  forceCloseAction();
  renderAll();
  showToast('已删除');
}

/* ═══════════════════ 扫描提示（教系统的「扫描文本」手势） ═══════════════════ */

const SCAN_TIP_KEY = 'daylog-tip-scan';
// 系统扫描是 iOS/iPadOS 的能力，别在桌面上提示一个点不出来的菜单
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

function initScanTip() {
  if (!isIOS || localStorage.getItem(SCAN_TIP_KEY)) return;
  document.getElementById('tip-scan').classList.add('on');
}
function dismissScanTip() {
  localStorage.setItem(SCAN_TIP_KEY, '1');
  document.getElementById('tip-scan').classList.remove('on');
  showToast('设置里还能找到用法');
}

/* ═══════════════════ 配色主题 ═══════════════════ */

const THEME_KEY = 'daylog-theme';
const THEMES = [
  { id: 'mynd', name: '暖灰墨绿', desc: '默认 · 参照 mynd', bg: '#efeeea', old: '#ffffff', me: '#3d4f45', bar: '#efeeea' },
  { id: 'blue', name: '白底天蓝', desc: '参照 iMessage',   bg: '#ffffff', old: '#e9e9eb', me: '#1f8cf5', bar: '#ffffff' },
];

function currentTheme() {
  const id = localStorage.getItem(THEME_KEY) || 'mynd';
  return THEMES.some(t => t.id === id) ? id : 'mynd';
}

function setTheme(id) {
  const t = THEMES.find(x => x.id === id) || THEMES[0];
  localStorage.setItem(THEME_KEY, t.id);
  if (t.id === 'mynd') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t.id);
  document.querySelector('meta[name="theme-color"]').setAttribute('content', t.bar);
  renderSettings();
  showToast(`配色：${t.name}`);
}

/* ═══════════════════ 多选删除（仿「信息」的批量删除） ═══════════════════ */

let selectMode = false;
const selected = new Set();

function enterSelect(preselectId) {
  if (!entries.length) { showToast('还没有记录'); return; }
  selectMode = true;
  selected.clear();
  if (preselectId) selected.add(preselectId);
  document.body.classList.add('select');
  document.getElementById('input').blur();
  renderStream();
  renderSelBar();
}

function exitSelect() {
  selectMode = false;
  selected.clear();
  document.body.classList.remove('select');
  renderStream();
  renderSelBar();
}

function rowClick(ev, id) {
  if (!selectMode) return;              // 平时点气泡走 bubbleUp，这里不插手
  ev.stopPropagation();
  toggleSelect(id);
}

function toggleSelect(id) {
  if (selected.has(id)) selected.delete(id); else selected.add(id);
  const row = document.querySelector(`.srow[data-id="${id}"]`);
  if (row) {
    row.classList.toggle('checked', selected.has(id));
    row.querySelector('.selcirc').classList.toggle('checked', selected.has(id));
  }
  renderSelBar();
}

function toggleSelectAll() {
  const ids = visibleEntries().map(e => e.id);      // 只针对当前筛选下看得见的
  const allOn = ids.length && ids.every(id => selected.has(id));
  selected.clear();
  if (!allOn) ids.forEach(id => selected.add(id));
  renderStream();
  renderSelBar();
}

function renderSelBar() {
  const n = selected.size;
  const ids = visibleEntries().map(e => e.id);
  document.getElementById('sel-count').textContent = n ? `已选 ${n} 条` : '未选择记录';
  document.getElementById('sel-all').textContent =
    ids.length && ids.every(id => selected.has(id)) ? '取消全选' : '全选';
  document.getElementById('del-btn').disabled = !n;
  document.getElementById('del-btn-text').textContent = n ? `删除 ${n} 条` : '删除';
  document.getElementById('sel-hint').textContent = n ? '' : '点一下选中，可跨天多选';
}

function confirmDeleteSelected() {
  const n = selected.size;
  if (!n) return;
  const withImgs = [...selected].reduce((s, id) => s + ((entryById(id) || {}).imgs || []).length, 0);
  openAction(`
    <div class="action-group">
      <div class="action-title">删除后无法恢复${withImgs ? `，其中 ${withImgs} 张配图也会一起删掉` : ''}</div>
      <button class="action-btn danger" onclick="deleteSelected()">删除 ${n} 条记录</button>
    </div>
    <div class="action-group">
      <button class="action-btn strong" onclick="forceCloseAction()">取消</button>
    </div>`);
}

function deleteSelected() {
  const n = selected.size;
  purgeEntries([...selected]);
  forceCloseAction();
  exitSelect();
  renderAll();
  showToast(`已删除 ${n} 条`);
}

function openTagPicker(id) {
  const e = entryById(id);
  if (!e) return;
  let html = `<div class="action-group"><div class="action-title">选择标签</div>`;
  tags.forEach(t => {
    const on = t.id === e.tagId;
    html += `<button class="action-btn" onclick="setEntryTag('${id}','${t.id}')">
      ${esc(t.emoji)} ${esc(t.name)} ${on ? '<span class="action-check">✓</span>' : ''}
    </button>`;
  });
  html += `</div><div class="action-group"><button class="action-btn strong" onclick="forceCloseAction()">取消</button></div>`;
  openAction(html);
}

function setEntryTag(id, tagId) {
  const e = entryById(id);
  if (!e) return;
  const changed = e.tagId !== tagId;
  e.tagId = tagId;
  if (changed) e.auto = false;
  saveEntries();
  forceCloseAction();
  renderAll();
  const t = tagById(tagId);
  if (changed) showToast(`已改为 ${t.name}`, '加关键词', () => openLearnKeywords(id, tagId));
  else showToast(`已是 ${t.name}`);
}

/* ═══════════════════ Form sheet（编辑文本 / 标签编辑 / 学关键词） ═══════════════════ */

function openForm(title, bodyHtml, cancelLabel) {
  document.getElementById('form-title').textContent = title;
  document.getElementById('form-body').innerHTML = bodyHtml;
  document.querySelector('#form-sheet .sheet-done').textContent = cancelLabel || '取消';
  document.getElementById('form-overlay').classList.add('open');
  document.getElementById('form-sheet').classList.add('open');
}
function closeForm() {
  document.getElementById('form-overlay').classList.remove('open');
  document.getElementById('form-sheet').classList.remove('open');
}

function openEditText(id) {
  const e = entryById(id);
  if (!e) return;
  openForm('编辑文本', `
    <div class="form-group">
      <textarea class="form-area" id="edit-text" style="min-height:120px">${esc(e.text)}</textarea>
      <div class="form-hint">时间点保持不变（记的是发生时间，不是修改时间）</div>
    </div>
    <button class="btn-primary" onclick="saveEditText('${id}')">保存</button>`);
  setTimeout(() => document.getElementById('edit-text').focus(), 250);
}

function tidyEntry(id) {
  const e = entryById(id);
  if (!e) return;
  const tidied = tidyLineBreaks(e.text);
  if (tidied === e.text) { showToast('这条不用整理'); return; }
  const before = e.text;
  e.text = tidied;
  saveEntries();
  renderAll();
  showToast(`${countLines(before) + 1} 行并成 ${countLines(tidied) + 1} 行`, '撤销', () => {
    const x = entryById(id);
    if (!x) return;
    x.text = before;
    saveEntries();
    renderAll();
  });
}

function saveEditText(id) {
  const e = entryById(id);
  const v = document.getElementById('edit-text').value.trim();
  if (!e || !v) return;
  e.text = v;
  saveEntries();
  closeForm();
  renderAll();
  showToast('已保存');
}

function openLearnKeywords(entryId, tagId) {
  const e = entryById(entryId);
  const t = tagById(tagId);
  if (!e || !t) return;
  const cands = candidateWords(e.text);
  const chips = cands.length
    ? cands.map(w => `<button class="kw-chip" onclick="this.classList.toggle('on')">${esc(w)}</button>`).join('')
    : `<div class="form-hint">这条文本里没有可用的新候选词，可以在标签管理里手动加。</div>`;
  openForm(`给「${t.name}」加关键词`, `
    <div class="form-group">
      <label class="form-label">从这条记录里挑词</label>
      <div class="kw-list" id="learn-list">${chips}</div>
      <div class="form-hint">选中的词会加进「${esc(t.name)}」的词表，下次出现同样的词就会自动命中。</div>
    </div>
    <button class="btn-primary" onclick="saveLearnKeywords('${tagId}')">加入词表</button>`);
}

function saveLearnKeywords(tagId) {
  const t = tagById(tagId);
  const picked = [...document.querySelectorAll('#learn-list .kw-chip.on')].map(b => b.textContent.trim());
  if (!picked.length) { closeForm(); return; }
  picked.forEach(w => { if (!t.keywords.includes(w)) t.keywords.push(w); });
  saveTags();
  closeForm();
  showToast(`已加入 ${picked.length} 个词`);
}

/* ═══════════════════ Settings ═══════════════════ */

let monthIndex = 0;   // 指向 availableMonths() 的下标
let advOpen = false;  // 「高级」折叠区是否展开（重渲染时保持）

function openSettings() {
  monthIndex = Math.max(0, availableMonths().length - 1);
  renderSettings();
  document.getElementById('settings-overlay').classList.add('open');
  document.getElementById('settings-sheet').classList.add('open');
}
function closeSettings() {
  document.getElementById('settings-overlay').classList.remove('open');
  document.getElementById('settings-sheet').classList.remove('open');
}

function availableMonths() {
  const set = new Set(entries.map(e => e.date.slice(0, 7)));
  return [...set].sort();
}

function renderSettings() {
  const months = availableMonths();
  const cur = months[monthIndex];
  const counts = {};
  entries.forEach(e => { counts[e.tagId] = (counts[e.tagId] || 0) + 1; });

  let html = `<div class="card-label">导出</div><div class="card">`;
  if (months.length) {
    const [y, m] = cur.split('-');
    const n = entries.filter(e => e.date.startsWith(cur)).length;
    html += `
      <div class="month-nav">
        <button class="nav-btn" onclick="stepMonth(-1)" ${monthIndex === 0 ? 'disabled' : ''}>‹</button>
        <div class="month-label">${Number(y)}年${Number(m)}月 · ${n} 条</div>
        <button class="nav-btn" onclick="stepMonth(1)" ${monthIndex >= months.length - 1 ? 'disabled' : ''}>›</button>
      </div>
      <div style="padding: 0 14px 14px">
        <button class="btn-primary" onclick="exportMarkdown('${cur}')">导出本月 Markdown</button>
        <div class="filename">📄 ${esc(mdFilename(cur))}</div>
      </div>
      <button class="row row-btn" onclick="exportMarkdown(null)">导出全部（${entries.length} 条）</button>`;
  } else {
    html += `<div class="row"><div class="row-info"><div class="row-sub">还没有记录</div></div></div>`;
  }
  html += `</div>
    <div class="form-hint" style="margin:8px 2px 0">.md 文件，可以直接丢进 Obsidian，或整份喂给 AI 分析。</div>`;

  html += `<div class="card-label">配色</div><div class="card">`;
  THEMES.forEach(t => {
    const on = t.id === currentTheme();
    html += `
      <div class="row theme-row" onclick="setTheme('${t.id}')">
        <span class="theme-swatch" style="background:${t.bg}">
          <i style="background:${t.old}"></i>
          <i style="background:${t.me}"></i>
        </span>
        <div class="row-info">
          <div class="row-name">${esc(t.name)}</div>
          <div class="row-sub">${esc(t.desc)}</div>
        </div>
        ${on ? '<span class="action-check">✓</span>' : ''}
      </div>`;
  });
  html += `</div>`;

  html += `<div class="card-label">小技巧</div><div class="card">
      <div class="row"><div class="row-info">
        <div class="row-name">📷 扫描书上的文字</div>
        <div class="row-sub">1. 点一下输入框，再点一下光标<br>2. 选菜单里的「扫描文本」<br>3. 镜头对准书页，文字直接填进来</div>
      </div></div>
    </div>
    <div class="form-hint" style="margin:8px 2px 0">这是 iOS 自带的能力（Apple Vision），识别中文比网页方案准得多，也不用联网。扫进来的整段文字会自动归到「摘抄」；断行太碎的话，长按气泡选「整理断行」。</div>`;

  html += `<div class="card-label">标签</div><div class="card">`;
  tags.forEach((t, i) => {
    const sub = t.fallback ? '兜底标签 · 不参与识别' : `${t.keywords.length} 个关键词${t.pattern ? ' · 有形态规则' : ''} · ${counts[t.id] || 0} 条`;
    html += `
      <div class="row">
        <span class="row-emoji">${esc(t.emoji)}</span>
        <div class="row-info" onclick="openTagEdit('${t.id}')">
          <div class="row-name">${esc(t.name)}</div>
          <div class="row-sub">${esc(sub)}</div>
        </div>
        <button class="row-mini" onclick="moveTag(${i},-1)" ${i === 0 ? 'disabled' : ''}>↑</button>
        <button class="row-mini" onclick="moveTag(${i},1)" ${i === tags.length - 1 ? 'disabled' : ''}>↓</button>
      </div>`;
  });
  html += `<button class="row row-btn" onclick="openTagEdit(null)">＋ 新建标签</button></div>
    <div class="form-hint" style="margin:8px 2px 0">顺序即优先级：关键词得分相同时，排在前面的标签胜出。</div>`;

  // JSON 相关一律收进折叠区：它和上面的「导出」是两回事，摆在一起会点串
  html += `<details class="adv"${advOpen ? ' open' : ''} ontoggle="setAdvOpen(this.open)">
      <summary>高级</summary>
      <div class="card">
        <button class="row row-btn" onclick="exportJSON()">完整备份（JSON，含标签与词表）</button>
        <button class="row row-btn" onclick="document.getElementById('import-file').click()">从备份恢复</button>
        <button class="row row-btn danger" onclick="clearAll()">清除全部数据</button>
      </div>
      <div class="form-hint" style="margin:8px 2px 0">换机或误删只有 JSON 能完整恢复（Markdown 不可逆、也不含关键词词表）。重复导入不会产生重复记录。</div>
    </details>`;

  document.getElementById('settings-body').innerHTML = html;
}

// 内联 ontoggle 够不到模块顶层的 let，得走一个函数声明（会挂到 window 上）
function setAdvOpen(v) { advOpen = v; }

function stepMonth(d) {
  const months = availableMonths();
  monthIndex = Math.min(months.length - 1, Math.max(0, monthIndex + d));
  renderSettings();
}

function moveTag(i, d) {
  const j = i + d;
  if (j < 0 || j >= tags.length) return;
  [tags[i], tags[j]] = [tags[j], tags[i]];
  saveTags();
  renderSettings();
  renderFilters();
}

/* ── 标签编辑 ── */

function openTagEdit(id) {
  const t = id ? tagById(id) : { id: '', name: '', emoji: '🏷️', keywords: [], pattern: '' };
  const isNew = !id;
  openForm(isNew ? '新建标签' : '编辑标签', `
    <div class="form-row">
      <div class="form-group" style="width:88px">
        <label class="form-label">图标</label>
        <input class="form-input" id="tag-emoji" value="${esc(t.emoji)}" style="text-align:center">
      </div>
      <div class="form-group" style="flex:1">
        <label class="form-label">名称</label>
        <input class="form-input" id="tag-name" value="${esc(t.name)}" placeholder="如：睡眠">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">关键词（逗号或换行分隔）</label>
      <textarea class="form-area" id="tag-kw" ${t.fallback ? 'disabled' : ''}>${esc(t.keywords.join('、'))}</textarea>
      <div class="form-hint">${t.fallback ? '兜底标签不参与识别，无需关键词。' : '文本里出现这些词就会命中；词越长权重越高。'}</div>
    </div>
    <div class="form-group">
      <label class="form-label">高级：形态规则（正则，可留空）</label>
      <input class="form-input" id="tag-pattern" value="${esc(t.pattern || '')}" placeholder="留空即不用">
      <div class="form-hint">优先级高于所有关键词。摘抄用的是引号/书名号/「——出处」。</div>
    </div>
    <button class="btn-primary" onclick="saveTag('${id || ''}')">保存</button>
    ${(!isNew && !t.fallback) ? `<button class="btn-primary" style="background:var(--red);margin-top:10px" onclick="deleteTag('${id}')">删除标签</button>` : ''}`);
}

function saveTag(id) {
  const name = document.getElementById('tag-name').value.trim();
  const emoji = document.getElementById('tag-emoji').value.trim() || '🏷️';
  const pattern = document.getElementById('tag-pattern').value.trim();
  const kwEl = document.getElementById('tag-kw');
  const keywords = kwEl.disabled ? [] : kwEl.value.split(/[、,，\n]/).map(s => s.trim()).filter(Boolean);
  if (!name) { showToast('名称不能为空'); return; }
  if (pattern) {
    try { new RegExp(pattern, 'm'); }
    catch { showToast('正则写错了'); return; }
  }
  if (id) {
    const t = tagById(id);
    Object.assign(t, { name, emoji, pattern, keywords: t.fallback ? [] : keywords });
  } else {
    // 新标签插在兜底标签之前
    const t = { id: genId(), name, emoji, pattern, keywords };
    const fi = tags.findIndex(x => x.fallback);
    tags.splice(fi < 0 ? tags.length : fi, 0, t);
  }
  saveTags();
  closeForm();
  renderSettings();
  renderAll();
  showToast('已保存');
}

function deleteTag(id) {
  const t = tagById(id);
  const n = entries.filter(e => e.tagId === id).length;
  const fb = fallbackTag();
  if (!confirm(`删除「${t.name}」？${n ? `该标签下的 ${n} 条记录会归到「${fb.name}」。` : ''}`)) return;
  entries.forEach(e => { if (e.tagId === id) { e.tagId = fb.id; e.auto = false; } });
  tags = tags.filter(x => x.id !== id);
  if (activeFilter === id) activeFilter = 'all';
  saveEntries(); saveTags();
  closeForm();
  renderSettings();
  renderAll();
  showToast('已删除标签');
}

/* ═══════════════════ Export / Import ═══════════════════ */

function shareOrDownload(content, filename, mime) {
  // 优先走 iOS 分享面板（一步直达）。部分 iOS 版本不认 text/markdown 这种 MIME，
  // canShare 会直接 false，所以再用 text/plain 试一次（扩展名保留 .md，Obsidian 认扩展名）。
  // 都不行才退回 <a download>；用户主动取消（AbortError）不触发下载。
  const tryShare = m => {
    const f = new File([content], filename, { type: m });
    return (navigator.canShare && navigator.canShare({ files: [f] }))
      ? navigator.share({ files: [f], title: filename })
      : null;
  };
  const p = tryShare(mime) || tryShare('text/plain');
  if (!p) { fallbackDownload(content, filename, mime); return; }
  p.catch(err => { if (!err || err.name !== 'AbortError') fallbackDownload(content, filename, mime); });
}
function fallbackDownload(content, filename, mime) {
  const url = URL.createObjectURL(new Blob([content], { type: mime }));
  const a = Object.assign(document.createElement('a'), { href: url, download: filename });
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function buildMarkdown(month) {
  const list = entries
    .filter(e => !month || e.date.startsWith(month))
    .sort((a, b) => a.ts - b.ts);

  const title = month
    ? `# Aside 导出 · ${Number(month.slice(0, 4))}年${Number(month.slice(5, 7))}月`
    : `# Aside 导出 · 全部记录`;

  const counts = {};
  list.forEach(e => { counts[e.tagId] = (counts[e.tagId] || 0) + 1; });
  const summary = tags.filter(t => counts[t.id]).map(t => `${t.name} ${counts[t.id]}`).join(' / ');
  const d = new Date();
  const stamp = `${dateKey(d)} ${nowTime(d)}`;

  const blocks = [`${title}`, `> 导出时间：${stamp} · 共 ${list.length} 条${summary ? ' · ' + summary : ''}`];

  let lastDate = null;
  list.forEach(e => {
    if (e.date !== lastDate) {
      lastDate = e.date;
      blocks.push(`## ${e.date} ${cnDate(e.date).replace(/^\d+月\d+日 /, '')}`);
    }
    // 导出只要文字：图片不内嵌，留一行占位，免得纯图片的记录导出成空条目
    // 摘抄排成 blockquote、高光用 Obsidian 的 ==高亮==、置顶留个 📌，格式跟着一起走
    const pad = e.qt ? '  > ' : '  ';
    const lines = [];
    if (e.text) {
      lines.push(...e.text.replace(/\n{2,}/g, '\n').split('\n')
        .map(l => l.trimEnd())
        .map(l => pad + (e.hl && l.trim() ? `==${l}==` : l)));
    }
    if ((e.imgs || []).length) lines.push(`  _[图片 ×${e.imgs.length}]_`);
    blocks.push(`- **${e.time}** \`#${tagById(e.tagId).name}\`${e.pin ? ' 📌' : ''}\n${lines.join('\n')}`);
  });
  return blocks.join('\n\n') + '\n';
}

function mdFilename(month) { return month ? `aside-${month}.md` : 'aside-all.md'; }

function exportMarkdown(month) {
  const list = entries.filter(e => !month || e.date.startsWith(month));
  if (!list.length) { showToast('这个范围没有记录'); return; }
  const filename = mdFilename(month);
  shareOrDownload(buildMarkdown(month), filename, 'text/markdown');
  showToast(`已导出 ${filename}`);
}

async function exportJSON() {
  const filename = `aside-backup-${todayKey()}.json`;
  showToast('正在打包…');
  const images = await allImages().catch(() => []);   // 图片只有 JSON 备份能带走
  shareOrDownload(JSON.stringify({ version: 2, entries, tags, images }, null, 2), filename, 'application/json');
  showToast(`已导出 ${filename}`);
}

function importJSON(ev) {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data || !Array.isArray(data.entries)) throw new Error('格式不对');
      const have = new Set(entries.map(e => e.id));
      const fresh = data.entries.filter(e => e && e.id && !have.has(e.id));
      const tagIds = new Set(tags.map(t => t.id));
      const newTags = (data.tags || []).filter(t => t && t.id && !tagIds.has(t.id));
      const imgs = (data.images || []).filter(im => im && im.id && im.data);
      if (!confirm(`将新增 ${fresh.length} 条记录${newTags.length ? `、${newTags.length} 个标签` : ''}${imgs.length ? `、${imgs.length} 张图片` : ''}（重复的会跳过）。继续？`)) return;
      // 已存在的标签不覆盖（关键词表是精心维护的主数据）
      const fi = tags.findIndex(t => t.fallback);
      tags.splice(fi < 0 ? tags.length : fi, 0, ...newTags.map(t => ({ ...t, fallback: false })));
      entries = entries.concat(fresh);
      // 引用了不存在的标签 → 归到兜底
      const ids = new Set(tags.map(t => t.id));
      const fb = fallbackTag();
      entries.forEach(e => { if (!ids.has(e.tagId)) e.tagId = fb.id; });
      saveEntries(); saveTags();
      for (const im of imgs) { await putImage(im).catch(() => {}); }   // 同 id 覆盖，幂等
      renderSettings(); renderAll(); scrollToBottom(false);
      showToast(`已导入 ${fresh.length} 条`);
    } catch (err) {
      showToast('导入失败：文件格式不对');
    }
  };
  reader.readAsText(file);
  ev.target.value = '';
}

function clearAll() {
  if (!confirm('清除全部记录、图片和标签设置？此操作不可撤销，建议先导出 JSON 备份。')) return;
  localStorage.removeItem(ENTRIES_KEY);
  localStorage.removeItem(TAGS_KEY);
  idbRun('readwrite', s => s.clear()).catch(() => {});
  imgCache.clear();
  entries = [];
  tags = JSON.parse(JSON.stringify(SEED_TAGS));
  activeFilter = 'all';
  saveEntries(); saveTags();
  renderSettings(); renderAll();
  showToast('已清空');
}

/* ═══════════════════ Viewport（iOS 键盘） ═══════════════════ */

function syncViewport() {
  const vv = window.visualViewport;
  const h = vv ? vv.height : window.innerHeight;
  const top = vv ? vv.offsetTop : 0;
  const kb = Math.max(0, window.innerHeight - h - top);
  const root = document.documentElement;
  root.style.setProperty('--app-h', h + 'px');
  root.style.setProperty('--vv-top', top + 'px');
  root.style.setProperty('--kb', kb + 'px');
  // 键盘弹起时 safe-area 底部内边距会和键盘叠加，关掉它
  root.style.setProperty('--sab-on', kb > 40 ? 0 : 1);
}
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', syncViewport);
  window.visualViewport.addEventListener('scroll', syncViewport);
}
window.addEventListener('orientationchange', () => setTimeout(syncViewport, 250));
window.addEventListener('pageshow', syncViewport);
window.addEventListener('resize', syncViewport);

/* ═══════════════════ Init ═══════════════════ */

syncViewport();
saveTags();
renderAll();
scrollToBottom(false);
renderAttachStrip();
initScanTip();

// 存了图片就得申请持久化，否则 Safari 空间紧张时会把 IndexedDB 清掉
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js').catch(() => {}));
}
</script>
